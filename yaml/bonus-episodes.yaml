---
# Bonus items: recordings of the Daily Source Code period that are not
# numbered shows. Specials posted in the DSC feed at the time, Adam's other
# shows and recordings, and other people's shows with Adam in them.
# python/build-bonus-episodes.py turns each into yaml/episodes/bonus-<id>.yaml
# (itunes:episodeType bonus, no episode number) and lays out the episode list
# of daily-source-code.yaml by date.
#
# Per item:
#   id      date and a short text; also the release name DSC-<id>.<ext>
#   kind    special (in the DSC feed then), adam (Adam's own, elsewhere),
#           guest (another show, Adam a guest or the subject)
#   source  the audio: archive path, or mp3/... in the repo
#   origin  where title, date, link and show notes come from:
#           post: <permalink> in json/dsc-posts-mirror.json
#           blog: <permalink> in json/blog-posts.json
#           feed: <rss file> + enclosure: <text in the enclosure url>
#   date    the date when there is no origin with a date; basis says why
#   url     the original enclosure url, when the origin does not have it
#   title, subtitle, author, description: set when the origin has none
#   people  guests and co-hosts (names as in yaml/persons.yaml)
#   adam    Adam's role when not host
# Unique recordings only: a same-format copy of an episode is not used, a
# different format of the same recording goes to that episode's
# alternateEnclosure (see 000-Irregularities.md).

bonus:

