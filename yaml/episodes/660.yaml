    #660 Daily Source Code for Thursday September 6th 2007

    From The Curry Condo, San Francisco, Ca, USA.

    A late night/early morning production of The Char-Cha courtesy of my emotionally disturbed internal clock. (I basically fell out of bed). We're going deep again today, because Patricia, Christina and I are incredibly thankful for all of your love and support. My wish for a phoneless iPhone came true, and John C. Dvorak raises my culinary knowledge with truffeled popcorn.

