    <p><strong>#660 Daily Source Code for Thursday September 6th 2007</strong></p><p>From The Curry Condo, San Francisco, Ca, USA.</p><p>A late night/early morning production of The Char-Cha courtesy of my emotionally disturbed internal clock. (I basically fell out of bed). We're going deep again today, because Patricia, Christina and I are incredibly thankful for all of your love and support. My wish for a phoneless iPhone came true, and John C. Dvorak raises my culinary knowledge with truffeled popcorn.</p><p><strong>Music in this episode: <br></strong></p><p><a href="http://www.mashuptown.com/2007/09/bootie-la-tonig.html">Party Ben</a> - Rehab (Can't Help Myself) <br><a href="http://www.btpodshow.com/search/?search_area=music&amp;keyword=Journey+South&amp;searchSubmit=search">Journey South</a> - What I Love About Home</p><p>Call the VoiceMail Line anytime: <br>+1 201 625 6357 or +44 207 681 3753</p><p>Dig me: <a href="mailto:adam@podshow.com">adam@podshow.com</a></p>
