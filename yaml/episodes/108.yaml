  iriver firmware hacking
   email
   From: Michael Elsdörfer <michael@podhost.de>
   Subject: Hacking the iRiver firmware
   Date: January 19, 2005 10:59:51 AM GMT+00:00
   To: Adam Curry <adam@curry.com>

   Hi Adam,

   I'm a regular listener, and I totally love your show
   yadda..yadda..yadda...[continue standard praise];-)

   I just finished listening to last Mondays' Daily Source Code and heard you
   talking about the iRiver and it's firmware. So I thought I'd drop a quick
   note to let you know about the Rockbox project over at
   http://www.rockbock.org. They are doing an excellent job - for several years
   now - in providing an alternative, open source firmware for my Archos
   Jukebox, and right now a iRiver port is in the works. So you might want to
   keep an eye on that project. As far as I know they don't have anything
   running yet, but on my Archos there is already bookmarking support
   (independent from the file type, unlike the iPod), so I guess that is pretty
   much what you were looking for.

   Keep up the good work,

   Michael

