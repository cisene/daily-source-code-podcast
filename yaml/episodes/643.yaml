description: |2-
    <p><strong>#643 Daily Source Code for Wednesday August 1st 2007</strong></p><p>From The Curry Manor, Guildford, UK.</p><p>The Charlie returns with a humpday recap of the last 24 hrs, which involved uncharictaristic drinking on my part, and some very interesting media meetings in London. And stop the bloody presses! Super Savant Roger Smalls is back with a vengance, and he's got a mind bender of a comment for us. Some cheddar chatter is to be expected, if you're into organizing the vast quantities of media you consume, then you'll like our channels. The aussies defend their honour against the kiwis and we finish with a new entry to the soundtrack of our lives.</p><p><a href="http://www.betanews.com/article/Lopsided_Case_for_Performers_Royalties_Made_by_House_Subcommittee/1185935381">Lopsided subcommitte</a>on performer's rights and royalties<br><a href="http://youtube.com/watch?v=BBwepkVurCI">Reality TV Secrets<br></a><br>Brand New: The Season Finale of<a href="http://portcitypd.podshow.com/">Port City PD</a><br><br>Visit The PodShow<a href="http://suckless.podshow.com/">Suckless Zone</a></p><p><br><strong>Music in this episode: <br></strong><br><a href="http://www.mashuptown.com/2006/09/dont_phunk_with.html">DJ Max Entropy</a> - Don't Phunk With My Fortunate Son<br><a href="http://www.btpodshow.com/music/?artist_id=3794">Kevin Burdick</a> - Too Good For This World<br></p><p>Call the VoiceMail Line anytime to help the revolution. <br>Tell us your story of Mainstream Mockery and Deception: <br></p><p>+1 201 625 6357 or +44 207 681 3753<br></p><p>Dig me: <a href="mailto:adam@podshow.com">adam@podshow.com</a></p>
