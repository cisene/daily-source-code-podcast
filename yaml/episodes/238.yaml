    Feedback on Hotel Podcast
    - Hi Adam, just listened to your hotel podcast..had'nt heard u before..u got potential....but do ya self a favour..get ya self a producer!.....bit too much dribble, dribble, dribble....having said that....let me say this..keep going. regards Warren ATKINSON Perth, AUSTRALIA
    You made my roadtrip!
    - Adam, For the last week I vacationed in the Colorado Rocky Moutnains. We opted to drive there (rather than fly) and the trek was around 1100 miles from Austin, TX to Estes Park, CO no matter how you cut it. I loaded up a couple weeks worth of The Daily Source Code into my iPod (with FM iTrip) and you kept me company on my journey, driving into the night. I must say that I've never been so entertained for such a long period of time! It's amazing how intimate of an experience it is hearing your voice rambling "to me" while driving on a dark highway at 70 mph around 3am while my kids and wife sleep in the seats next to me. I couldn't have done the trip without you and your daily source. So thank you for such a great podcast, always. I've attached a song that I think you'll find more than perfect for The Daily Source Code. It's an independant band's song so you should have no copyright infringement issues wiht playing it on your show. Enjoy DICK N JANE : Not the way you Need Their website is : www.dicknjanetheband.com—home.html Rock on, Adam, Merrell
    - DICK_N_JANE-Not_The_Way_You
