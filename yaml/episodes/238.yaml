    DSC Sept. 7 - Ham Operators
    - Adam, Just a note to say thanks for acknowledging the work that the ham operators have been doing since the storm hit New Orleans last week. There have been a number of stories in the media about how they are helping to keep communication lines open during this devastating period of time. While there are a number of HF communication nets running constantly, there are also a couple of services that use Voice over IP as their primary method of communication. Have a look at the Internet Radio Linking Project (www.irlp.net ) and the Voice over IP Weather Net (www.voipwx.net ) as examples. Both of these sites offer streaming audio of the communications when the nets are active, as they probably will be next week when the next storms start making their way west. And just as an aside, Morse code is no longer required for access to some parts of the ham spectrum in the US, and is not required at all up here in Canada. Thanks for a great show, Adam. I listen to it every day on the commute to work. 73, Rod Templeton, VE7RJT Vancouver, BC
