    - email from Adam
      - Adam --
      - Hi! Hopefully by the time you read this you'll have your net up & running. Thought that this song, from my band's recent album, would help you celebrate broadband at home again...:) I once had SBC accidentally disconnect my DSL line. It took 6 weeks for them to turn it back on. I almost went insane. So I know where you're coming from.
      - Anyway, the band is Sinister Dexter, info at http://www.sinisterdexter.net/ or http://www.garageband.com/sindex. This song is covered under a CC license, so definitely podsafe. And really, it doesn't have anything to do with technology other than the title; it's just a funk tune with LOTS OF HORNS. :)
      - Hope you enoy it!
      - Adam Elman
