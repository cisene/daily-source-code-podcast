    - email
      - From: Rodrigo Stulzer
      - Subject: Podcasts are Ridiculous!
      - Date: January 12, 2005 4:14:56 PM GMT+00:00
      - To: Adam Curry
      - http://news.com.com/How+the+Mac+was+born,+and+other+tales/2008-1082_3-5529081-5.html?tag=st.next
      - Andy Hertzfeld, Co-Creator, Apple Macintosh:
      - I'm down on podcasts. I think that's ridiculous. Suddenly you're taking
      - the information and making it completely inaccessible. You can't read it,
      - and besides a podcast is nothing. It's streaming MP3s that's good, but no
      - one can take credit for inventing a new term because streaming MP3s is
      - simple and has been around for a while. Doing it through RSS enclosures is
      - basically bad--to automatically download big files before hearing them.
      - The whole thing about audio is that it has small enough bandwidth that you
      - can stream. You just can't stream from an iPod because it doesn't have a
      - network connection, yet. I'm excited about getting an iPod with 802.11 so
      - I can stream to my AirPort Express without carrying my Mac around.
      - Rodrigo Stulzer
      - http://www.conectiva.com.br
      - New things are always on the horizon
      - L. Besselink
