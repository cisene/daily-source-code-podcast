  	email
  		From: 	  Sebastian Wiesinger <sebastian@karotte.org>
  		Subject: 	Blue Man Group
  		Date: 	January 31, 2005 10:22:33 PM GMT+00:00
  		To: 	  Adam Curry <adam@curry.com>

  		Hi Adam,

  		greetings from Germany. :) First let me tell you that I love your
  		podcast, keep up the great work.

  		On your podcast 2005-01-31 you played a track from Blue Man Group with
  		Vocals from Venus Hum. That track is actually from the Complex Rock
  		Tour Live: http://www.amazon.com/exec/obidos/tg/detail/-/B0000DBJ9P

  		This is an awesome DVD and the music on it is just great. This is
  		*not* the normal show program in Las Vegas but a special "Rock Tour"
  		which Blue Man Group did. If you can get this DVD watch it, its great.


  		I saw the german edition of the Blue Man Group theater program, that
  		also kicks ass, but it's more show than music in it.


  		Auf Wiedersehen from Germany,

  		Sebastian

  		--
  		GPG Key-ID: 0x76B79F20 (0x1B6034F476B79F20)
  		Wehret den Anfaengen: http://odem.org/informationsfreiheit/
  		Thunder rolled. ... It rolled a six.
  		--Terry Pratchett, Guards! Guards!
  Dave Lee
  	Apocalpse Radio Country
  msn search
  	email
  		From: 	  Simon Speight <simon@speight.me.uk>
  		Subject: 	MSN Search
  		Date: 	February 2, 2005 11:32:44 AM GMT+00:00
  		To: 	  Adam Curry <adam@curry.com>

  		Hi Adam,

  		Saw your blog posting about the fact that MSN Search redirects you to the UK version since you're now a fellow Brit :)

  		I tried it today and got the same results you did.  Got half an answer for you - try visiting this address: http://search.msn.com/?noredir=1

  		This will let you search the whole "inkernet" (nice phrase ;-) and find the same search results that Dave did.  Plus, it seems to set a cookie so that the next time you visit http://search.msn.com it won't redirect you to the UK version.

  		Its a solution but I agree that its a bit lame.  I prefer the way Google does it - search the whole damn thing unless *I* say so.

  		Cheers,

  		Simon Speight
