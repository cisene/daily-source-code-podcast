    Double byte encoding
    - email
      - From: Calum Matheson
      - Subject: Character Encoding
      - Date: January 25, 2005 1:21:11 AM GMT+00:00
      - To: Adam Curry
      - Hi Adam,
      - Listening to your DSC for today I heard you mention you were having a bit of trouble with character encoding. Joel Spolsky has written an excellent essay on the subject entitled
      - "The Absolute Minimum Every Software Developer Absolutely, Positively Must Know About Unicode and Character Sets (No Excuses!)".
      - It's very readable, and explained the subject to me more clearly than anything else I had came across. If you haven't seen it already it's worth the read.
      - It's at http://www.joelonsoftware.com/articles/Unicode.html
      - Regards,
      - Calum
