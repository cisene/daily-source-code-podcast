  	email
  		From: 	  Mary K. Elkins <kelkins@missmaryk.com>
  		Subject: 	girl & cello = sexy, you say?
  		Date: 	February 1, 2005 8:35:17 PM GMT+00:00
  		To: 	  Adam Curry <adam@curry.com>

  		Hi Adam,

  		My girlfriend LeeAnn Westover turned me on to your podcast. My friend and former co-worker Adam Howell spoke over the cube to me back in November about podcasts, rss feeds, and you specifically. At that point I was working 80hr+ weeks trying to figure out how to quit my full time job, so i could freelance webdesign full time (www.missmaryk.com). SO needless to say, I nodded and continued making my Honda Banner Ads and scheming on different creative ways to quit. (One idea, make the poll on the front of the website say "How cool is it that i just quit?") Sadly, his & LW's talk of this "podcasting" was absorbed only minmally.

  		I live in Winston-Salem, NC on the Southside where artists and musicians can own whole houses. I live here with my boyfriend Daniel VonSeggen (vonseggen.com) and my 2 alien ragdoll cats Omar and Aladdin. There are some photos of them on my photo weblog (www.lame-oh.com). Here they are with Biddy Amanda Monaco on a recent visit: (http://206.130.97.180/mk/lo/2005/01/omar-is-part-squirrel.html)

  		I play cello (wheeet-whooooo) in a "New Generation Cabaret" band called Clare Fader & The Vaudevillains. If you like the idea of music which includes girl-on-cello-action, you'll love us.

  		Anyway, fastforward a few months.  I have finally had the chance to begin to embrace podcasting. I love it! I find myself getting very jacked up when thinking about the exciting possibilities ahead. My brain hurts when i think about all of the freedoms and ways to get our music heard that are there via podcasting that are only usually spoken about in misty, remember-when, elvis-sun studios-stories. About a month ago, my close friend Jeffrey Dean Foster (www.jeffreydeanfoster.com) -- another fine NC musician -- emailed me about reading the new Dylan book, Chronicles. This is what he said in his email, that has recently come to my mind this week listening to your podcasts.
  		*
  		"I got the Dylan Chronicles book from Kitty. It is so enjoyable to read and yet really makes these times in music seem pretty  lightweight and inconsequential. I had visions of a NYC somewhat like that when I was young and when we finally did get there it was pretty exciting. Dark and cold most of the time but warm in the clubs. full of possibilities. I've got to invent some new possibilities. they seem to be a dying species sometimes."

  		*So I just wanted to introduce myself, my band and say a big thanks for helping invent some new possibilities for us musicians making music off the radar. Big time.
  		Love, Mary K. Elkins

  	Clare Fader & The Vaudevillains
  		Seventh and Trade
  			Betty Crocker's Bail
