    Bluetooth Cellpodder
    - From: Roy Sintenie
    - Subject: Bluetooth cellpodder
    - Date: December 27, 2004 1:02:16 AM GMT+00:00
    - To: Adam Curry
    - Hi Adam,
    - I don't think the cellpodder bluetooth version is going to work. Why? I
    - figured the idea out by myself several months ago and there are a view
    - problems:
    - 1. You are using a Sony Ericsson at the moment? I'm using a SE P900 and
    - before that a Nokia 6600....the problem with the P900 is that they beam all
    - stuff to the internal memory and it isn't possible to beam it to the memory
    - card. I asume that this is the case with all SE models.
    - 2. Most (99,99999%) phones are equipped with class 2 or class 3 bluetooth
    - radiocards. The reach of these cards is around 10 metres....but throughput
    - decreases significantly when the distance is getting bigger. For ringtones
    - and stuff like that it wouldn't be a very big problem, but for full songs or
    - mp4 movies it would.
    - 3. Device discovery...takes a view seconds with bluetooth 1.1. The new
    - bluetooth 2.0 standard does this a lot faster.
    - I love bluetooth and the symbian os ;-)...but maybe a good tip for a new
    - handheld/phone: the BENQ P50...it's available on expansys at pre-order for
    - under 400 euro's and it has bluetooth and WiFi (uhm..and windows mobile).
    - Regards,
    - Roy
