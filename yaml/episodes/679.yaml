    #679 Daily Source Code for Tuesday October 30th 2007

    From The Curry Manor, Guildford, UK.

    Tomorrow I leave for a San Francisco treat, leaving chilly Blighty behind. One more show for the road then, with mucho praise for my new MacBook Pro and chilling audio from Naomi Wolf and a discussion about Blackwater, the private US amry that is tearing it up in Iraq and at home.

    With tht comes music that fits, so enjoy the show and the tunes, talk to you guys on Thursday from the Curry Condo.

