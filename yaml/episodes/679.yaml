    <p><span class="contentIndent"><strong>#679 Daily Source Code for Tuesday October 30th 2007</strong></p><p><span class="contentIndent">From The Curry Manor, Guildford, UK.</p><p><span class="contentIndent">Tomorrow I leave for a San Francisco treat, leaving chilly Blighty behind. One more show for the road then, with mucho praise for my new MacBook Pro and chilling audio from Naomi Wolf and a discussion about Blackwater, the private US amry that is tearing it up in Iraq and at home. <br><br>With tht comes music that fits, so enjoy the show and the tunes, talk to you guys on Thursday from the Curry Condo.</p><p><span class="contentIndent"><strong>Links To Visit:</strong></p><p><span class="contentIndent"><a href="http://www.youtube.com/watch?v=RjALf12PAWc">Naomi Wolf</a>speech<br><a href="http://www.youtube.com/watch?v=nqM4tKPDlR8">Blackwater</a> - Shadow Army</p><p><span class="contentIndent"><strong>Music On This Episode:</strong></p><p><span class="contentIndent"><a href="http://www.btpodshow.com/music/?artist_id=11749">Lillian Axe</a>-Antarctica<br><a href="http://www.btpodshow.com/music/?artist_id=9496">The Martians</a> - The Pumpkin Grave</p><span class="contentIndent"><br><br><br>Call Anytime:<br>+1 201 625 6357 or +44 207 681 3753<br><br>adam@podshow.com<br>
