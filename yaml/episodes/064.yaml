    - eMail
      - From: Jason Evangelho
      - Subject: Getting involved with IndieFeed (Please Read :-)
      - Date: November 9, 2004 11:48:41 PM CET
      - To: Adam Curry
      - Reply-To: Jason Evangelho
      - Hey Adam;
      - This is Jason @ Hardcore Insomnia Radio.
      - You recently had proposed that listeners out here in podcasting land
      - hunt down great music by indie bands and you would produce the show.
      - However, I'd like to steer you in a different direction.
      - I have teamed up with Chris at Indiefeed and truly believe that this
      - has major potential for promoting bands. He is already having talks
      - with labels about sending us their catalogues and things are moving
      - quickly in a positive direction. So, what better way to recruit help,
      - then asking the grandmaster AC (boiiiing) for some help?
      - basically, we would need you to ask people via the Daily Source Code
      - if anyone would be interested in helping to maintain certain
      - IndieFeeds. I am handling the Alt/Modern Rock channel with Chris, but
      - the more movement and activity we get behind this, the more successful
      - it will be. It truly has some amazing potential.
      - So, pretty please, give IndieFeed another mention and let's start
      - rolling on this. If you need any questions answered, contact myself of
      - Chris over at Indie Feed.
      - Thanks Adam.......
      - Jason
      - http://hardcoreinsomniaradio.blogspot.com
      - --
      - "The chains of habit are too weak to be felt until they are too
      - strong to be broken."
      - ~Samuel Johnson
