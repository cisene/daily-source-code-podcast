  <a href="http://www.hammacher.com/publish/73225.asp#">iPod Drum Sticks</a><br>
  &nbsp;<br>
  &nbsp;<br>
  Music in this episode:<br>
  <a href="http://musicface.com/uncleseth/">Uncle Seth</a> - You Don&#146;t Need an iPod<br>
  <a href="http://music.podshow.com/music/listeners/artistdetails.php?BandHash=f9a44cd27115e075d3421cb44227824f">Madsumo</a> - So Many Ways To Kill You<br>
