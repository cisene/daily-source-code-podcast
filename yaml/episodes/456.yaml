description: |-
  <div class="storycontent">
           	<p>#456 Daily Source Code for Wednesday September 6th 2006</p>
  	<p>From Curry Cottage Guildford, UK</p>
  	<p>After
  some belated birthday greetings (including 5 divas), we roll straight
  through a bunch of topics: Business Week, Podcast Panels (ugh)
  Fencing&#133;Faggy? and a serious rant on Joseph Jaffe.<br>
  The Uncle Seth tune I start off with is bound to become a classic!<br>
  &nbsp;<br>
  &nbsp;<br>
  Relevant Links:<br>
  Acura <a href="http://acura.podshow.com/">TargetCast</a><br>
