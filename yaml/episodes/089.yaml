    - email
      - From: Joel Hawksley
      - Subject: drum audio in you DSC
      - Date: December 20, 2004 9:09:59 PM GMT+00:00
      - To: Adam Curry
      - Just a note, but the audio of the drumline that you played on sundays' podcast included some drum music that was in fact stolen from the movie "drumline" that came about a year ago. Not a real clip, but the actual sheet music that was never released from the movie... not good. In fact, a band in a neighboring town was sued and lost over some music they stole and ended up paying over 50,000USD to the person who wrote it.
      - On a lighter note, here's more music for you podcast...
