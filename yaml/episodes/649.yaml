    <p><strong>#649 Daily Source Code for Friday August 10th 2007</strong></p><p>From The Curry Manor, Guildford, UK.</p><p>It's been a while, a fully fubar'd maximum music DSC. Somehow the music turned out really diverse this time, which is not a bad thing! CSB spouts his wisdom, Augie and Richard call in from HQ and Gnomedex 7. and someone is really, really unhappy with us. <br><br>Brand New: Season 2 of<a href="http://portcitypd.podshow.com/">Port City PD</a></p><p>KMart Back To School<a href="http://backtoschool.podshow.com/">Channel</a><br><br>Visit The PodShow<a href="http://suckless.podshow.com/">Suckless Zone</a></p><p><br><strong>Music in this episode: <br></strong><br><br><a href="http://www.mashuptown.com/2007/07/post.html">DJ Earworm</a> - Funky Goes To Hollywood<br><a href="http://www.btpodshow.com/music/?artist_id=6699">Girls Stuff</a> - Secrets<br><a href="http://www.btpodshow.com/search/?search_area=music&amp;keyword=Linda+Finkle&amp;searchSubmit=search">Linda Finkle</a> - Georgie Porgie<br><a href="http://www.btpodshow.com/music/?artist_id=8202">The Milwaukees</a> - Highway To The Sun<br>Bobby Goldsborough - Summer (The First Time) <br><a href="http://www.btpodshow.com/search/?search_area=music&amp;keyword=Nelson+Bragg&amp;searchSubmit=search">Nelson Bragg</a> - Tell Me I'm Wrong<br></p><p>Call the VoiceMail Line anytime to help the revolution. <br>Tell us your story of Mainstream Mockery and Deception: <br></p><p>+1 201 625 6357 or +44 207 681 3753<br></p><p>Dig me: <a href="mailto:adam@podshow.com">adam@podshow.com</a></p>
