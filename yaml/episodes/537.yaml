            <p>#537 Daily Source Code for Thursday February 1st 2007</p>
   <p>From The Curry Manor, Guildford, UK</p>
   <p>I start right off at the top of the show with an apology for my foul mood. Teenagers are involved of course <img src="http://curry.podshow.com/wp-images/smilies/icon_smile.gif" alt=":)" class="wp-smiley">
  The posh people potty pigs thread picks up steam and just at the end of
  the show the Lady Patricia enters the attic with breaking news, I&#146;m a <a href="http://www.weekend-online.nl/">wanted man</a> in Holland! Never a dull moment,&nbsp;and of course there&#146;s an update on the Free Trinity project, including <a href="http://groups.google.com/group/freeTrinity?hl=en">this link</a> to the FT Google Group.</p>
   <p>Music in this episode:<br>
  <a href="http://www.btpodshow.com/music/?artist_id=4206">Blackalicious</a> - Powers<br>
  <a href="http://www.btpodshow.com/music/?artist_id=3341">Beth Thornley</a> - Stand</p>
   <p>Buy a domain name from <a href="http://godaddy.com/">GoDaddy</a> and use code DSC3 for a great discount!<br>
