           	<p>#521 Daily Source Code for Friday December 29th 2006</p>
  	<p>From Curry Cottage, Guildford, UK</p>
  	<p>It&#146;s the last show of the year and we&#146;ve crammed it full with goodies.<br>
  My 2007 Media Entertainment predictions, my final thoughts for the year and new year resolutions.<br>
  How can you resist?!</p>
