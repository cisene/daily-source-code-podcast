    <h1>#785 Daily Source Code for Tuesdy August 26th 2008</h1><br><h2>Aggregating Agression</h2><br><div><img src="http://drop.io/download/public/wa5ytbarqtgrogf1navu/ab7667cd6eb169f31db1596c846a39f510cc54a1/10986640-e5de-012a-0c67-00127994f632/a780f5b0-55a8-012b-b54f-faa7fedc7cbb/557484041_ace6b42514_large.jpg" alt="" width="360" height="479" /></div><p><em>Discover Simple, Private Sharing at<a href="http://drop.io/dailysourcecode">Drop.io</a></em></p><p>N Korea's Kim died in 2003; replaced by lookalike, says Waseda professor › <a href="http://www.japantoday.com/category/kuchikomi/view/north-koreas-kim-died-in-2003-and-was-replaced-by-lookalike-says-waseda-profesor">Japan Today: Japan News and Discussion</a></p><p>Ex-US diplomat gets 20 years for child porn - <a href="http://www.examiner.com/a-1550283~Ex_US_diplomat_gets_20_years_for_child_porn.html?cid=temp-popular">Examiner.com</a></p><p>Nebraska's &quot;Safe Haven&quot; Law Allows Parents To<a href="http://www.huffingtonpost.com/2008/08/22/nebrasks-safe-haven-law-a_n_120757.html">Abandon Unwanted Children</a></p><p><a href="http://www.cbc.ca/money/story/2008/08/21/f-banks.html">Five minutes to midnight</a>for banks</p><p>Some Britons Too Unruly for Resorts in Europe - <a href="http://www.nytimes.com/2008/08/24/world/europe/24crete.html?_r=2&amp;em&amp;oref=slogin&amp;oref=slogin">NYTimes.com</a></p><p>Portal to<a href="http://news.nationalgeographic.com/news/2008/08/080822-maya-maze.html">Maya Underworld</a>Found in Mexico? </p><p><a href="http://www.cropcircleconnector.com/2008/2008.html">Crop Circles</a>in 2008 in the UK</p><p>YouTube - <a href="http://www.youtube.com/watch?v=YXcX28NbRTg&amp;eurl=http://drop.io/dailysourcecode/blog/2">2012</a>The Online Movie</p><p>Highly-Credible People<a href="http://911summary.blogspot.com/">Question 9/11</a></p><p><a href="http://video.google.com/videoplay?docid=6737097743434902428">OUTFOXED</a> : Rupert Murdoch's War on Journalism</p><p>Device to track truant students raises privacy concerns | Houston &amp; Texas News | <a href="http://www.chron.com/disp/story.mpl/metropolitan/5961312.html">Chron.com - Houston Chronicle</a></p><p>Automaker Bailout: Detroit's Big Three Want $50 Billion in Loans - Automotive * US * <a href="http://www.cnbc.com//id/26382896">News * Story - CNBC.com<br></a><br>A Few Speculators Dominate Vast Market for Oil Trading - <a href="http://www.washingtonpost.com/wp-dyn/content/article/2008/08/20/AR2008082003898.html">washingtonpost.com</a></p><p>Here's the DSC Demographics<a href="http://tinyurl.com/356kct">survey link</a></p><p>$30 off weekly<a href="http://budget.com/dsc">Budget Rental Cars</a>or 10% off any amount with my code at<a href="http://budget.com/dsc">Budget.com/dsc</a></p><p>$25 off a Drobo with<a href="http://drobostore.com/">my code</a>DSC</p><p>Get up to 70% discount on life insurance with<a href="http://accuquote.com/dsc">AccuQuote.com</a>give them a call: 1800-410-7214</p><p>Get 35 Free Songs at<a href="http://www.emusic.com/dailysourcecode">eMusic.com</a>, no obligation, yours to keep!</p><p>Call Anytime:</p><p>Use the voicemail at<a href="http://drop.io/dailysourcecode">drop.io/dailysourcecode</a>or email me: adam@mevio.com</p>
