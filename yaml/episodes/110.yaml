  	email
  		From: 	  Atomhrt <atomhrt@gmail.com>
  		Subject: 	KCRW Worldnews
  		Date: 	February 1, 2005 1:59:33 AM GMT+00:00
  		To: 	  Adam Curry <adam@curry.com>
  		Reply-To: 	  Atomhrt <atomhrt@gmail.com>

  		Adam,

  		I just heard on Internet radio KCRW a bit where they featured you and
  		the DSC. They also said that they will be podcasting their shows in
  		about two weeks. You may already know this, but I thought I'd send you
  		a email anyway, just in case...

  		Keep up the good work and I hope that your cottage gets un-haunted. ;)
  		It could also have been Cheap Trick, giving you a hint to play one of
  		their songs!

  		Bob
  	Cheap Trick
  		Top2000
  			I Want You To Want Me
  chapman feedback
  p-dub-vs-drfloyd
  stumpadam dorothy
  kct
  	kct's digital world . com
  		Commute-cast
  You don't own me
  	more email
  		Greg DelSesto
  		<greg@lspartners.com> to me
  			 Show options	 3:17am (9 hours ago)
  		Adam,

  		Loved Rasputina.

  		Maybe you'd like to regale your audience with yet another cover.  For your
  		consideration, attached is "You Don't Own Me" by Klaus Nomi from his
  		"Encore!" album, 1983.

  		Don't tell him not to play with other boys.

  		Greg in Boston
  	Klaus Nomi
  		Encore!
