   <p><span class="contentIndent"><strong>#678 Daily Source Code for Monday October 29th 2007</strong></span></p>

   <p><span class="contentIndent">From The Curry Manor, Guildford, UK.</span></p>

   <p><span class="contentIndent">Picking
  up some of the slack from the missed Fubar Friday, we&acirc;&#128;&#153;ve got the
  HitTest, NYLon and a minimal amount of political jabbering. Lets start
  some new topics people, like my autobiography, rugby vs football and
  butterflies.</span></p>

   <p><span class="contentIndent"><strong>Music On This Episode:</strong></span></p>

   <p><span class="contentIndent"><a href="http://www.btpodshow.com/music/?artist_id=11838">Manic Street Preachers</a> - Your Love Alone Is Not enough<br><a href="http://www.btpodshow.com/music/?artist_id=10297">Gina Villalobos</a> - Somebody Save Me</span></p>
