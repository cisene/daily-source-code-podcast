      - Adam,
      - Listening to the show for the past couple of days and you mentioned that
      - you were getting iPod ear (or something like that) form those damn iPod
      - headphones.... Well, in addition to whatever the headphones were that you
      - had on the 11/12 show, I have a recommendation for you.... Studio
      - headphones. It sounds crazy, but if you're doing a lot of recording, you
      - might want to invest in a pair. I have a great pair made by Sony that I
      - bought 4 years ago, when I was working at a college radio station. I
      - love them! Hell, I even hooked them up to the iPod on the flight from
      - Chicago/O'Hare to London/Heathrow (the battery didn't make it all the
      - way, but I had a Belekin back-up battery adapter). The other thing I do
      - is that I don't use the iPod headphones with my iPod, most of the time...
      - I use headphones that I had to of gotten in the mid-90s for a Discman I
      - had at that time. The ear pads are falling off, they're beat to hell,
      - but they still sound good and they're infinitely more comfortable than
      - the iPod headphones.
