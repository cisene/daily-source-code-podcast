    - Adam, I am surprised that someone living in Flanders would not know something about Armistice day, the end of World War 1, when Germany surrendered to the Allies at 1100 on the 11th day of the 11th month of 1918. Here Canada we observe November 11 as Remembrance Day by wearing a red poppy and often read the famous poem below: In Flanders Fields By: Lieutenant Colonel John McCrae, MD (1872-1918) Canadian Army IN FLANDERS FIELDS the poppies blow Between the crosses row on row, That mark our place; and in the sky The larks, still bravely singing, fly Scarce heard amid the guns below. We are the Dead. Short days ago We lived, felt dawn, saw sunset glow, Loved and were loved, and now we lie In Flanders fields. Take up our quarrel with the foe: To you from failing hands we throw The torch; be yours to hold it high. If ye break faith with us who die We shall not sleep, though poppies grow In Flanders fields.
