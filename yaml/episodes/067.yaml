    - Stuart Hunter
      - From: Stuart Hunter
      - Subject: Headphone Suggestion
      - Date: November 12, 2004 3:09:16 PM CET
      - To: Adam Curry
      - Reply-To: Stuart Hunter
      - Adam,
      - I had the same problem as you with hurting my ears with earbuds.
      - I chose to use the Sony MDR-W08 headphones. Very lightweight, they
      - just sit slightly inside the ear rather than being stuffed right in
      - like an earbud.
      - Also unlike an earbud thay are easy to remove and leave hanging round
      - your neck when you do have to communicate with the outside world.
      - The sound is not as intense as earbuds - like I said - they aren't
      - jammed in your ears, but they are just fine for listening to podcasts.
      - http://www.circuitcity.com/rpsm/oid/16242/rpem/ccd/productDetailReview.do
      - And Richer Sounds in the UK are selling them off dirt cheap.
      - http://www.richersounds.sv01.net/index.php?f=itemdetl.php&p=300081
