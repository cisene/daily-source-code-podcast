    - email from James
      - From: James Invincible
      - Subject: headphones and other thoughts
      - Date: November 11, 2004 8:03:39 PM CET
      - To: Adam Curry
      - Adam,
      - I've been there, and completely understand what you mean about "podcast ear" - I found that when wearing the de facto iPod earbuds that my ears would become sore after time as well. I went through a bunch of others until I hit upon, IMHO, an awesome set from Sony. Unfortunately, it looks like the model I personally use has been deprecated, but the MDR-ED21LP seems to be in the same form factor. It is lamentable that Sony has moved away from this design in their newer earbuds, as the new design is pretty uncomfortable.
      - I listened to the DSC this morning, and recognized the "Promiscuous Bullet" voices as the two kids whom I sat near at the BloggerCon podCast dinner - If I were to describe meeting Tamas and Stephen, I think it could easily be construed as them being "rockstarish" and "elitist" - I definitely found them to be hipsters... but I sat back and thought about it first... they were just shy and feeling out of their element. I really think that you've handled their acidity in a really genuine way, and I appreciate that.
      - In other news, we did a split Dawn and Drew show last night, with Dawn recording her channel on our end, and Drew his - then Drew did the merging... I think it sounds pretty good. It is definitely a technique that could be honed and automated, but I'm working on it.
      - That's about all. Hope that your move is as unobtrusive to your daily life as possible.
      - Cheers,
      - James
