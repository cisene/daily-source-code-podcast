    #710 Daily Source Code for Thursday January 17th 2008

    Finally the codes are in for a special 15% discount to all Charlie heads who want to pick up the Nokia N810 internet tablet! Today I don't just hawk it to you, but show you an awesome application to use with your N810. LogMeIn (screenshot) is a remote desktop service that is browser based, works on the tablet, and is free, as in beer :) To purchase the N810 at a 15% discount, check out mypromo and coupon code pagehere on curry.com. If you do purchase one (using my code dailysourcecode) call me and let me know!

    Then we move into some PodSafe Music banter about packaging and the demise of the music industry as we know it.

