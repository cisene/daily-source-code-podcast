    <p><strong>#617 Daily Source Code for Tuesday June 11th 2007</strong></p><p>From The Curry Condo, San Francisco, Ca. USA</p><p>This non-smoking life is paying off! Somehow lots of clarity today and an exciting experiment I want you to try. Click on<a href="itpc://www.podshow.com/collection/52610.xml">this link</a>to put my DSC-Channel on your iPod. Here's an<a href="http://www.podshow.com/collection/52610.xml">RSS feed</a>of the same channel. <br>I think we can have fun with this! And anyone can make one. (Make sure you check out<a href="http://www.vidblaster.com/">VidBlaster</a>as well)</p><p>NYLon checks in to piss me off, and I'm sporting wood for Leopard. Now this my freinds is a show!</p><p>Visit The PodShow<a href="http://suckless.podshow.com/">Suckless Zone</a></p><p><br><strong>Music in this episode: <br></strong><br><a href="http://www.podshow.com/music/?artist_id=9598">Koopa</a> - One Off Song For The Summer<br><a href="http://www.podshow.com/music/?artist_id=2776">Black lab</a> - Transformers<br></p><br><div><strong>Call or VoIp the VoiceMail line anytime:</strong></div><br><div><span class="contentIndent">+1<span class="jajahWraper"><a class="jajahLink" title="Click to call this number with JAJAH..."><span class="jajahInLink">201 625 6357</a>or<span class="jajahWraper"><a class="jajahLink" title="Click to call this number with JAJAH..."><span class="jajahInLink">+44 207 681 3753</a></div><br><br><div><span class="contentIndent"><span class="contentIndent">Dig me: <a href="http://adam.podshow.com/">adam.podshow.com</a></div>
