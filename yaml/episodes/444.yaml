description: |-
  <p>#444 Daily Source Code for Friday August 18th 2006<br>
  From Curry Cottage Guildford, UK</p>
  	<p>FUBAR Friday kicks off with a ton of great PodSafe songs as suggested by the Charlie audience.<br>
  We revisit the NASA missing tape debacle, discuss the joys of flying
  and enjoying business class travel and Amy Mac checks in with another
  AC Ass-Saving Assercize. Also featured, a Tinfoil Hat moment and the
  never boring Comic Strip Blogger.<br>
