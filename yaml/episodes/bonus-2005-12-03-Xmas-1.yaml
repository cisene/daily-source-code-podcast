description: |-
  <p>First in a series of mixed podsafe music holiday songs. Just subscribe to the <a href="http://xmas.podshow.com/?feed=rss2">feed</a> and you&#8217;ll have a nice collection for the holidays!</p>
   <p>In order to respect the rights of the owners of the songs, I will be mixing two songs together with a holiday greeting from podcasters and podsafe artists in each episode. This should still give some good serendipity when you put your mp3 player on shuffle mode. Encoding is at 128kps for better quality.</p>
   <p>To kick it off we hear from <a href="http://music.podshow.com/music/producers/producerLibrary/artistdetails.php?BandHash=b69291b9e6017fff1ba9a1514f5f4c27">Podsafe for Peace</a> and <a href="http://music.podshow.com/music/producers/producerLibrary/artistdetails.php?BandHash=4fcd5120d856f2b21cf2f0ad493f54d0">Jill Parr</a>.</p>
   <p><a href="http://mp3.dailysourcecode.podshow.com/podshowXmas1.mp3">Part 1</a>
  </p>
