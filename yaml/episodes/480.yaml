  <div class="storycontent">
           	<p>#480 Daily Source Code for Wednesday October 18th 2006</p>
  	<p>Curry Condo, San Francisco, Ca.</p>
  	<p>Back at The Condo again after a whirlwind NY visit. Today is a basic travelogue of the trip.<br>
  Everything from my health situation to the mirrors in the hotel, yeah,
  it all sucked. Great fun though at the event in NY with my new friends
  Chris from MySpace and Chad from YouTube. Heh. That wuz kewl.<br>
  &nbsp;<br>
