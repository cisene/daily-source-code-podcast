    - the profs email
      - From: Rob Frieden
      - Subject: Satellite Radio Bit Rate
      - Date: February 3, 2005 5:14:01 PM GMT+00:00
      - To: Adam Curry
      - Hello Adam:
      - Thanks for mentioning my email response to your questions about satellite capacity. As to your question about Digital Audio Radio Satellite (Xm and Serius) channel bit rate here's some links: http://www.xmfan.com/viewtopic.php?t=3321; and http://www.xmfan.com/viewtopic.php?t=35567; see also an Economist article: http://www.economist.com/science/tq/displayStory.cfm?story_id=1020741
      - The unconfirmed view is that each channel uses about 16 to 32 kbps.
      - Best wishes, Rob Frieden
      - Pioneers Chair and Professor of Telecommunications
      - Penn State University
      - 102 Carnegie Building, University Park, PA 16802
