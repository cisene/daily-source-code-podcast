description: "[00:01]Show details\n\tPodcast on February 6th 2005\n\tFrom Guildford, Curry Cottage\n\t<a href=\"http://homepage.mac.com/dailysourcecode/DSC/DSC-2005-02-06.mp3\">Direct download link</a>\n\t<a href=\"http://radio.weblogs.com/0001014/categories/dailySourceCode/rss.xml\">Podcast feed</a>\n\t<a href=\"http://www.curry.com/\">Weblog</a>\n\t<a href=\"mailto:adam@curry.com\">Email</a>\n\t<a href=\"mailto:mp3feedback@gmail.com\">MP3 Submissions and feedback</a>\nNo Stinkin' Transmitters - OpenPodcast.org #554\n5th generation of RnR\nAdam's Podcasting Sweeper\nRockmaninov Opener\ndefinitive cowbell\n\tChambers Brothers - Cowbell of the day\n\t\tTime Has Come Today\n\temail\n\t\tGreg DelSesto\n\n\t\tAdam,\n\n\t\tYour listeners' cow bell submissions have been ... well, cute.\n\n\t\tBut PLEASE, the seminal cow bell song, and the best cow bell song, is of\n\t\tcourse:\n\n\t\t\"Time Has Come Today\" by the Chambers Brothers, 1968, Columbia Records.  The\n\t\talbum version was \"an 11-minute\
  \ psychedelic soul epic.\"  You, on the other\n\t\thand, were 4 years old; your life barely longer than the length of this\n\t\tsong.\n\n\t\tPlease play the intro for your listeners so that we can lay the cow bell\n\t\ttopic to rest; nothing else competes.\n\n\t\tGreg in Boston\nMJJ\niriver embedding shownotes\n\temail\n\t\tFrom: \t  Karleen, Dan <Dan.Karleen@thomson.com>\n\t\tSubject: \tmp3 caption editor for show notes\n\t\tDate: \tFebruary 3, 2005 3:23:59 PM GMT+00:00\n\t\tTo: \t  Adam Curry <adam@curry.com>\n\n\t\tLove the DSC. Regarding the idea about embedding show notes, check out http://www.iriveramerica.com/support/cd/caption_editor.aspx.  It looks like it lets you sync text with audio.\n\n\t\tDan Karleen\n\t\tMorrisville, PA\n\temail\n\t\tTom Schuring\n\t\tto adam\n\t\t Show options\t Feb 3 (9 hours ago)\n\t\they adam,\n\n\t\tthe 'old' synchronised lyric standard (SYLT frame) in the ID3 (v2.3)\n\t\tembeds a 'file' into the ID3 tag so it is included into the mp3\n\t\tyou don't\
  \ need to add an extra file so there is no synch problem\n\n\t\tthe 'file' embedded contains the lyrics and a timecode.\n\n\t\ti have been searching for a good\n\t\t\t1) editor to add this to any mp3\n\t\t\t\t2) an itunes plugin that will show the lyrics when i play them\n\t\t\t\t\t3) apple to include this stuff in the ipod.\n\n\t\t1) and 2) can be done but i guess 3) will be pretty hard..\n\n\t\ti am working on java program for 1).  if it is any good i'll share..\n\t\t(i'm using http://jid3.blinkenlights.org/ if anyone else wants to play\n\t\talong)\n\n\t\tfor 2) i know there is a SYLT plugin for Winamp playes so i hope i can find\n\t\tone for itunes\n\t\thttp://sites.rapidus.net/gpatrick/1.3.0/ReadMe.html\n\n\t\t====================================\n\n\t\tthere is also another standard developed that will let you queue up and show\n\t\timages on a timecode (and heaps more from what i understand)\n\t\thttp://www.id3.org/lyrics3200.html\n\t\tso that might be cool for the sight-seeing tours\n\
  \n\t\t====================================\n\n\t\tcheers,\n\temail\n\t\tFrom: \t  Olivier Anh <twenster@gmail.com>\n\t\tSubject: \tMP3 player & lyrics\n\t\tDate: \tFebruary 3, 2005 11:44:30 AM GMT+00:00\n\t\tTo: \t  Adam Curry <adam@curry.com>\n\t\tReply-To: \t  Olivier Anh <twenster@gmail.com>\n\n\t\tHi Adam,\n\n\t\tI'm just listening to your DSC of Feb 2nd.\n\t\tAbout the lyrics displayed in the some media players, this is a rather\n\t\tsimple hack :)\n\n\t\tBeside the audio file (let's say bla.mp3), you just add a text file\n\t\tcontaining the lyrics, with the same filename (ie bla.txt). One sung\n\t\tphrase per line. That's all :)\n\n\t\t.lrc file format is another way for lyrics. Some karaoke and media\n\t\tplayers like Winamp (through a plugin,\n\t\thttp://winamplyrics.hit.bg/info_eng.html) can read these files. lrc\n\t\tfile is a plain text file like the above : one sung phrase per line.\n\t\tIt just adds a time line, allowing to display the phrase at the right\n\t\ttime, when the\
  \ song is played :)\n\n\t\tHere's a link to the only site I can find right now... Sorry that's in\n\t\tfrench (As I'm french :) )\n\t\thttp://michbuze.club.fr/123/kar.htm#lrc\n\n\t\t(( Format LRC ))\n\t\tHere is how looks like such a file :\n\n\t\t[00:01]Celine Dion - My Heart Will Go On\n\n\t\t[00:20]Every night in my dreams\n\t\t[00:24]I see you, I feel you\n\t\t[00:29]That is how I know you go on.\n\n\t\tBelow : compatible softwares\n\n\n\t\tiRiver seem to have its own format : SNC\n\t\there a link in english :\n\t\thttp://www.wu-wien.ac.at/usr/h00b/h0053049/sncpage/index.htm\n\t\tBTW : Yesss, you''re listened in France (in Bordeaux at least) \\o/\n\n\t\tThanks for your show ! Keep going\n\n\t\tOlivier\n\t\t--\n\t\tfrench listener\nWhere are the chicks?\n\temail\n\t\tHi Adam,\n\t\tI'm stuck at home with the flu today so I've been ego-surfing online to see where my podcast is listed and I found a neat link. Have you ever wondered where all the lady podcasters are? I guess Madge counts,\
  \ but really, there are tons of us out there. Amy over at her blog Contentious has done us all a favor by compiling a list. That's one thing us girls do really well, make lists. So, here's hoping you get a minute to check out and plug some of the girlie podcasts!\n\t\t \n\t\tKim C. (of Shakespeare Souffle and Homeschool Habitat)\n\t\t \n\t\tHere's the link;\n\t\thttp://blog.contentious.com/archives/2004/12/22/women-in-podcasting-the-list\n50 Pence\n\tI See Biddies\nReality shows and anatomy for dummies\n\temail\n\n\t\tCindy Casares\n\t\t<cindycasares@hotmail.com> to adam\n\t\t Show options\t Feb 4 (8 hours ago)\n\t\tHi Adam,\n\n\t\tI don't know if anyone has replied to your comments about the autopsy show\n\t\ton Channel 4 or your reality show idea where celebs try to quit smoking, but\n\t\tthere have been some shows to that effect televised in the States. On a\n\t\tsomewhat obscure cable network called Trio, there were several episodes of\n\t\ttelevised autopsies that I saw last year.\
  \ I couldn't really watch for long\n\t\tperiods of time, but I kept sneaking peeks at it like some kind of accident\n\t\ton the highway. Unfortunately I can't find any references to it online, but\n\t\tI definitely watched it last year. It was on a lot and the doctor was German\n\t\tso I bet it was the same show you're watching over there. Also, another\n\t\tsomewhat obscure cable network called PAX, which is usually a Christian\n\t\tnetwork, has gotten in on the reality act with a show called Cold Turkey,\n\t\twhere regular people try to quit smoking. And there was an ad campaign last\n\t\tyear called Bob Quits that positioned itself as a reality show that people\n\t\tcould watch online to see this guy Bob try to quit smoking. So, they were\n\t\tactually the first ones to do it in America that I know of. No celebs yet,\n\t\tbut that can't be far behind since we already have celebrity weight loss\n\t\tshows on VH1.\n\n\t\tCold Turkey    http://www.pax.tv/shows/coldturk/\n\t\tBob Quits\
  \       http://www.bobquits.com/skins/bobquits/home.aspx\n\t\tTrio Network   http://www.trioplus.tv/plus/\n\temail\n\t\tTodd Allaria\n\t\t<todd@allaria.com> to adam\n\n\t\tHey Adam,\n\t\tJust wanted to mention that a Stop Smoking Reality show has already aired. It was pretty interesting. Each of the guests thought they were coming for a different reality until they were hit with the truth. Here is a link to the site.\n\n\t\thttp://www.paxtv.com/shows/coldturk/\n\n\t\tLove the show,\n\t\tTodd\n\n\t\t--\n\t\tTodd P. Allaria\n\t\ttodd@allaria.com\n\t\twww.allaria.com/\nJody Paulson - the fed (What they don't tell you)\n\tthe fed\nDavid Dawson\n\tOn The Wing 200501\n\t\tKent Ponds Soundseeing Tour\ntyping cont.\n\temail\n\t\tAndrew Pulrang\n\t\t<andrew.pulrang@verizon.net> to adam\n\t\t Show options\t 5:18am (21\x8E2 hours ago)\n\t\tAdam --\n\n\t\tI took typing in high school, around the time you were a VJ on MTV. I\n\t\tnever became really proficient ... I'd be the world's worst secretary\n\
  \t\t... but I did learn to touch-type, and I don't look at the keys. My\n\t\ttyping teacher cured me of that in one day simply by taping a sheet of\n\t\tpaper along the top of the keyboard, and draping it over my hands as I\n\t\ttyped. That's it. Give it a try. Oh, and remember the \"home row\" ...\n\t\tasdf and jkl;\n\n\t\tCheers!\n\n\t\tAndrew D. Pulrang\nAHP continued\n\thugoschotman-hijacks#4005E0\n\tHugo's email\n\t\tFrom: \t  Hugo Schotman <podcasting@mac.com>\n\t\tSubject: \tPodcasting studio setup: about Audio Hijack Pro\n\t\tDate: \tFebruary 3, 2005 9:54:47 AM GMT+00:00\n\t\tTo: \t  qcarnicelli@rogueamoeba.com\n\t\tCc: \t  Adam Curry <adam@curry.com>, dawnanddrewshow@gmail.com, Dave Slusher <dslusher@gmail.com>\n\n\t\tHello Quentin,\n\n\t\tIn response to your post about recording podcasts, here are some ideas.\n\t\t( http://www.rogueamoeba.com/utm/posts/Linked/record-a-podcast )\n\n\t\tThe value of AHP for Podcasters can be increased by:\n\t\t1. Keeping the application as it is.\n\
  \t\t2. Modifying the existing application in some key areas.\n\t\t3. A complete overhaul of the functionality so it becomes a Podcaster's dream studio.\n\n\t\tLet me address these points in more detail.\n\t\t1. Keeping the application as it is.\n\t\tSurprise ;)\n\t\tActually, having tested the application quite a bit, I think it is already pretty good. What could make it better without changing the actual application is for us to know how to put it to best use. For me as somebody with a fair technical understanding if I would know more about the inner workings of the application I could easily optimize my configuration. For the less technically inclined, this would have to be translated into easy setup descriptions and 'Do's & Don'ts'.\n\n\t\tConcretely, what we should know right now (what I've been trying to figure out by trial and error) is:\n\t\t- Where does latency occur?\n\t\t- What buffers are there in the application and how big are they?\n\t\t- How can I get the least amount of\
  \ latency from Mic input through some microhpone effects to my headphones?\n\t\t- What causes the increase in latency that sometimes occurs?\n\t\t(Reset by turning hijack on the microhpone off and on again.)\n\t\t- What affects the encoding and recording part and how can we make it most stable and least CPU/ Harddisk intensive?\n\n\t\tMy current reference setup can be read here...\n\t\thttp://log.hugoschotman.com/hugo/2005/02/low_latency_pod.html\n\t\t...and heard here:\n\t\thttp://log.hugoschotman.com/hugo/2005/02/low_latency_wit.html\n\t\tThe audio files also contain a narrated tour through the setup.\n\n\t\t2. Modifying the existing application in some key areas.\n\t\tTaking the questions from point 1. if these concerns can be made more visible in the user interface it would make the whole user experience better.\n\t\tFor example:\n\t\t- Add buffer indicators to the 'source' and 'effects' setup screens. Preferably calculating the delay in miliseconds.\n\t\t- It would be nice if the\
  \ application showed the cumulative latency in miliseconds for the signal that goes to the headphones.\n\t\t- Add CPU activity and I/O activity monitors with warnings for critical situations.\n\t\t- Add the possibility to configure the application's system scheduling priority.\n\t\t  (See also: the 'nice' command in the shell/ terminal.)\n\t\t- Inside AHP, give sufficient priority to the signal that is being sent to the headphones.\n\t\t- Detect and correct changes in latency to the headphones.\n\n\t\tNote that some of the comments above are described with my configuration in mind. Please let me know if something is unclear.\n\n\t\t3. A complete overhaul of the functionality so it becomes a Podcaster's dream studio.\n\t\tThis would probably mean including the soundflower functionality in the application, include a mixer, include media players, etc.\n\t\tThat would be a next step and would require input from several podcasters, including non-techies.\n\n\t\tHopefully you can do something\
  \ with these comments. Please let me know if I can be of more assistance.\n\t\tA diagram of my setup will follow within a few days.\n\t\tI've CC-d some people who are also working towards a better studio setup and who could maybe add some comments.\n\n\t\tHave fun,\n\n\t\tHugo\n\n\n\t\t--\n\t\tHugo Schotman\n\t\thttp://log.hugoschotman.com/\n\n\t\thugo.schotman@mac.com\n\t\tiChat/ AIM: hschot@mac.com\n\t\tSkype: hschot\n\n\t\tTel. +41 76 430 1570 (mobile)\n\t\t-\n\nJohn Ong\\nDuration: 01:16:36"
