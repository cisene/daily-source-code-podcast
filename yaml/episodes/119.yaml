description: "[00:01]Show details\n Podcast on February 6th 2005\n From Guildford, Curry Cottage\n <a href=\"http://homepage.mac.com/dailysourcecode/DSC/DSC-2005-02-06.mp3\">Direct download link</a>\n <a href=\"http://radio.weblogs.com/0001014/categories/dailySourceCode/rss.xml\">Podcast feed</a>\n <a href=\"http://www.curry.com/\">Weblog</a>\n <a href=\"mailto:adam@curry.com\">Email</a>\n <a href=\"mailto:mp3feedback@gmail.com\">MP3 Submissions and feedback</a>\nNo Stinkin' Transmitters - OpenPodcast.org #554\n5th generation of RnR\nAdam's Podcasting Sweeper\nRockmaninov Opener\ndefinitive cowbell\n Chambers Brothers - Cowbell of the day\n  Time Has Come Today\n email\n  Greg DelSesto\n\n  Adam,\n\n  Your listeners' cow bell submissions have been ... well, cute.\n\n  But PLEASE, the seminal cow bell song, and the best cow bell song, is of\n  course:\n\n  \"Time Has Come Today\" by the Chambers Brothers, 1968, Columbia Records. The\n  album version was \"an 11-minute psychedelic soul epic.\"\
  \ You, on the other\n  hand, were 4 years old; your life barely longer than the length of this\n  song.\n\n  Please play the intro for your listeners so that we can lay the cow bell\n  topic to rest; nothing else competes.\n\n  Greg in Boston\nMJJ\niriver embedding shownotes\n email\n  From: Karleen, Dan <Dan.Karleen@thomson.com>\n  Subject: mp3 caption editor for show notes\n  Date: February 3, 2005 3:23:59 PM GMT+00:00\n  To: Adam Curry <adam@curry.com>\n\n  Love the DSC. Regarding the idea about embedding show notes, check out http://www.iriveramerica.com/support/cd/caption_editor.aspx. It looks like it lets you sync text with audio.\n\n  Dan Karleen\n  Morrisville, PA\n email\n  Tom Schuring\n  to adam\n   Show options Feb 3 (9 hours ago)\n  hey adam,\n\n  the 'old' synchronised lyric standard (SYLT frame) in the ID3 (v2.3)\n  embeds a 'file' into the ID3 tag so it is included into the mp3\n  you don't need to add an extra file so there is no synch problem\n\n  the 'file' embedded\
  \ contains the lyrics and a timecode.\n\n  i have been searching for a good\n   1) editor to add this to any mp3\n    2) an itunes plugin that will show the lyrics when i play them\n     3) apple to include this stuff in the ipod.\n\n  1) and 2) can be done but i guess 3) will be pretty hard..\n\n  i am working on java program for 1). if it is any good i'll share..\n  (i'm using http://jid3.blinkenlights.org/ if anyone else wants to play\n  along)\n\n  for 2) i know there is a SYLT plugin for Winamp playes so i hope i can find\n  one for itunes\n  http://sites.rapidus.net/gpatrick/1.3.0/ReadMe.html\n\n  ====================================\n\n  there is also another standard developed that will let you queue up and show\n  images on a timecode (and heaps more from what i understand)\n  http://www.id3.org/lyrics3200.html\n  so that might be cool for the sight-seeing tours\n\n  ====================================\n\n  cheers,\n email\n  From: Olivier Anh <twenster@gmail.com>\n  Subject:\
  \ MP3 player & lyrics\n  Date: February 3, 2005 11:44:30 AM GMT+00:00\n  To: Adam Curry <adam@curry.com>\n  Reply-To: Olivier Anh <twenster@gmail.com>\n\n  Hi Adam,\n\n  I'm just listening to your DSC of Feb 2nd.\n  About the lyrics displayed in the some media players, this is a rather\n  simple hack :)\n\n  Beside the audio file (let's say bla.mp3), you just add a text file\n  containing the lyrics, with the same filename (ie bla.txt). One sung\n  phrase per line. That's all :)\n\n  .lrc file format is another way for lyrics. Some karaoke and media\n  players like Winamp (through a plugin,\n  http://winamplyrics.hit.bg/info_eng.html) can read these files. lrc\n  file is a plain text file like the above : one sung phrase per line.\n  It just adds a time line, allowing to display the phrase at the right\n  time, when the song is played :)\n\n  Here's a link to the only site I can find right now... Sorry that's in\n  french (As I'm french :) )\n  http://michbuze.club.fr/123/kar.htm#lrc\n\
  \n  (( Format LRC ))\n  Here is how looks like such a file :\n\n  [00:01]Celine Dion - My Heart Will Go On\n\n  [00:20]Every night in my dreams\n  [00:24]I see you, I feel you\n  [00:29]That is how I know you go on.\n\n  Below : compatible softwares\n\n\n  iRiver seem to have its own format : SNC\n  here a link in english :\n  http://www.wu-wien.ac.at/usr/h00b/h0053049/sncpage/index.htm\n  BTW : Yesss, you''re listened in France (in Bordeaux at least) \\o/\n\n  Thanks for your show ! Keep going\n\n  Olivier\n  --\n  french listener\nWhere are the chicks?\n email\n  Hi Adam,\n  I'm stuck at home with the flu today so I've been ego-surfing online to see where my podcast is listed and I found a neat link. Have you ever wondered where all the lady podcasters are? I guess Madge counts, but really, there are tons of us out there. Amy over at her blog Contentious has done us all a favor by compiling a list. That's one thing us girls do really well, make lists. So, here's hoping you get a minute\
  \ to check out and plug some of the girlie podcasts!\n   \n  Kim C. (of Shakespeare Souffle and Homeschool Habitat)\n   \n  Here's the link;\n  http://blog.contentious.com/archives/2004/12/22/women-in-podcasting-the-list\n50 Pence\n I See Biddies\nReality shows and anatomy for dummies\n email\n\n  Cindy Casares\n  <cindycasares@hotmail.com> to adam\n   Show options Feb 4 (8 hours ago)\n  Hi Adam,\n\n  I don't know if anyone has replied to your comments about the autopsy show\n  on Channel 4 or your reality show idea where celebs try to quit smoking, but\n  there have been some shows to that effect televised in the States. On a\n  somewhat obscure cable network called Trio, there were several episodes of\n  televised autopsies that I saw last year. I couldn't really watch for long\n  periods of time, but I kept sneaking peeks at it like some kind of accident\n  on the highway. Unfortunately I can't find any references to it online, but\n  I definitely watched it last year. It was on a lot\
  \ and the doctor was German\n  so I bet it was the same show you're watching over there. Also, another\n  somewhat obscure cable network called PAX, which is usually a Christian\n  network, has gotten in on the reality act with a show called Cold Turkey,\n  where regular people try to quit smoking. And there was an ad campaign last\n  year called Bob Quits that positioned itself as a reality show that people\n  could watch online to see this guy Bob try to quit smoking. So, they were\n  actually the first ones to do it in America that I know of. No celebs yet,\n  but that can't be far behind since we already have celebrity weight loss\n  shows on VH1.\n\n  Cold Turkey http://www.pax.tv/shows/coldturk/\n  Bob Quits http://www.bobquits.com/skins/bobquits/home.aspx\n  Trio Network http://www.trioplus.tv/plus/\n email\n  Todd Allaria\n  <todd@allaria.com> to adam\n\n  Hey Adam,\n  Just wanted to mention that a Stop Smoking Reality show has already aired. It was pretty interesting. Each of\
  \ the guests thought they were coming for a different reality until they were hit with the truth. Here is a link to the site.\n\n  http://www.paxtv.com/shows/coldturk/\n\n  Love the show,\n  Todd\n\n  --\n  Todd P. Allaria\n  todd@allaria.com\n  www.allaria.com/\nJody Paulson - the fed (What they don't tell you)\n the fed\nDavid Dawson\n On The Wing 200501\n  Kent Ponds Soundseeing Tour\ntyping cont.\n email\n  Andrew Pulrang\n  <andrew.pulrang@verizon.net> to adam\n   Show options 5:18am (21 2 hours ago)\n  Adam --\n\n  I took typing in high school, around the time you were a VJ on MTV. I\n  never became really proficient ... I'd be the world's worst secretary\n  ... but I did learn to touch-type, and I don't look at the keys. My\n  typing teacher cured me of that in one day simply by taping a sheet of\n  paper along the top of the keyboard, and draping it over my hands as I\n  typed. That's it. Give it a try. Oh, and remember the \"home row\" ...\n  asdf and jkl;\n\n  Cheers!\n\n  Andrew\
  \ D. Pulrang\nAHP continued\n hugoschotman-hijacks#4005E0\n Hugo's email\n  From: Hugo Schotman <podcasting@mac.com>\n  Subject: Podcasting studio setup: about Audio Hijack Pro\n  Date: February 3, 2005 9:54:47 AM GMT+00:00\n  To: qcarnicelli@rogueamoeba.com\n  Cc: Adam Curry <adam@curry.com>, dawnanddrewshow@gmail.com, Dave Slusher <dslusher@gmail.com>\n\n  Hello Quentin,\n\n  In response to your post about recording podcasts, here are some ideas.\n  ( http://www.rogueamoeba.com/utm/posts/Linked/record-a-podcast )\n\n  The value of AHP for Podcasters can be increased by:\n  1. Keeping the application as it is.\n  2. Modifying the existing application in some key areas.\n  3. A complete overhaul of the functionality so it becomes a Podcaster's dream studio.\n\n  Let me address these points in more detail.\n  1. Keeping the application as it is.\n  Surprise ;)\n  Actually, having tested the application quite a bit, I think it is already pretty good. What could make it better without changing\
  \ the actual application is for us to know how to put it to best use. For me as somebody with a fair technical understanding if I would know more about the inner workings of the application I could easily optimize my configuration. For the less technically inclined, this would have to be translated into easy setup descriptions and 'Do's & Don'ts'.\n\n  Concretely, what we should know right now (what I've been trying to figure out by trial and error) is:\n  - Where does latency occur?\n  - What buffers are there in the application and how big are they?\n  - How can I get the least amount of latency from Mic input through some microhpone effects to my headphones?\n  - What causes the increase in latency that sometimes occurs?\n  (Reset by turning hijack on the microhpone off and on again.)\n  - What affects the encoding and recording part and how can we make it most stable and least CPU/ Harddisk intensive?\n\n  My current reference setup can be read here...\n  http://log.hugoschotman.com/hugo/2005/02/low_latency_pod.html\n\
  \  ...and heard here:\n  http://log.hugoschotman.com/hugo/2005/02/low_latency_wit.html\n  The audio files also contain a narrated tour through the setup.\n\n  2. Modifying the existing application in some key areas.\n  Taking the questions from point 1. if these concerns can be made more visible in the user interface it would make the whole user experience better.\n  For example:\n  - Add buffer indicators to the 'source' and 'effects' setup screens. Preferably calculating the delay in miliseconds.\n  - It would be nice if the application showed the cumulative latency in miliseconds for the signal that goes to the headphones.\n  - Add CPU activity and I/O activity monitors with warnings for critical situations.\n  - Add the possibility to configure the application's system scheduling priority.\n    (See also: the 'nice' command in the shell/ terminal.)\n  - Inside AHP, give sufficient priority to the signal that is being sent to the headphones.\n  - Detect and correct changes in latency\
  \ to the headphones.\n\n  Note that some of the comments above are described with my configuration in mind. Please let me know if something is unclear.\n\n  3. A complete overhaul of the functionality so it becomes a Podcaster's dream studio.\n  This would probably mean including the soundflower functionality in the application, include a mixer, include media players, etc.\n  That would be a next step and would require input from several podcasters, including non-techies.\n\n  Hopefully you can do something with these comments. Please let me know if I can be of more assistance.\n  A diagram of my setup will follow within a few days.\n  I've CC-d some people who are also working towards a better studio setup and who could maybe add some comments.\n\n  Have fun,\n\n  Hugo\n\n\n  --\n  Hugo Schotman\n  http://log.hugoschotman.com/\n\n  hugo.schotman@mac.com\n  iChat/ AIM: hschot@mac.com\n  Skype: hschot\n\n  Tel. +41 76 430 1570 (mobile)\n  -\n\nJohn Ong\nDuration: 01:16:36"
