    <p><strong>#588 Daily Source Code for Wednesday April 25th 2007</strong></p><p>From Curry Condo, San Francisco, Ca. USA</p><p>Just like yesterday, we talk about baggage on the show, but it's the stuff we carry around with our emotions. Savants of the Psyche<a href="http://insytworks.com/">Robin and Suzanne Maiden</a>discuss the Alec Baldwin voicemail. Other stuff includes PodShow Sucking Less, <a href="http://news.bbc.co.uk/1/hi/entertainment/6583067.stm">Sheryl Crow</a>Pooping less and followup on yesterday's discussion about the<a href="http://www.live365.com/choice/sxreply.live">death of webradio</a>.</p><p><br><strong>Music in this episode: <br></strong><a href="http://www.podshow.com/music/?artist_id=6153">The Fire Apes</a> - Let Me Know<br><a href="http://www.podshow.com/music/?artist_id=9171">Angelique Kidjo</a>and Peter Gabriel - Salala</p><p>Anji Bees<a href="http://unwind.podshow.com/">Unwind</a> , sponsored by Tylenol PM</p><br><div><strong>Call or VoIp the VoiceMail line anytime:</strong></div><br><div><span class="contentIndent">+1<span class="jajahWraper"><a class="jajahLink" title="Click to call this number with JAJAH..."><span class="jajahInLink">201 625 6357</a>or<span class="jajahWraper"><a class="jajahLink" title="Click to call this number with JAJAH..."><span class="jajahInLink">+44 207 681 3753</a></div><br><br><div><span class="contentIndent"><span class="contentIndent">Dig me: <a href="http://adam.podshow.com/">adam.podshow.com</a></div>
