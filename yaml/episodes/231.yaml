    BioDiesl Cont...
    - the real problem with biodiesel and ethanol
      - Sam Abuelsamid sam@abuelsamid.com to adam More options 1:56 am (14 hours ago) www.theolympian.com—article Adam The problem with these bio-fuels is that if you factor in the energy input in the entire production process, it takes considerably more fossil fuel energy to produce the fuels than you get out of them. This factors in the fuel used by tractors an other equipment and also the refining process itself. "But researchers at Cornell University and the University of California-Berkeley say it takes 29 percent more fossil energy to turn corn into ethanol than the amount of fuel the process produces. For switch grass, a warm weather perennial grass found in the Great Plains and eastern North America United States, it takes 45 percent more energy and for wood, 57percent. It takes 27 percent more energy to turn soybeans into biodiesel fuel and more than double the energy produced is needed to do the same to sunflower plants, the study found." The real answer is to use less energy. sam
    - Bio Diesel smells like french fries.
      - James Berghout jamesb@jamesb.com to adam More options Aug 29 (17 hours ago) Adam, The Make Magazine podcast did a 30 minute interview about Bio Diesel. I found it really fascinating. I don't know who is right, but according to the Make magazine podcast, the diesel burning vehicles made today are better suited for Bio Diesel than those made back in the 80's. I also hear that Bio Diesel burning in your fuel tank smells like french fries. James Berghout
