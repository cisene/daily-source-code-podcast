    Driving music sales through podcasting
    - Two thoughts about driving music sales through mashups and hittests
      - Patrick Seemann pse@patom.ch to adam More options 6:35 am (9 hours ago) Hi Adam, I just want to add two thoughts to the topic: a) I listen to DSC on my commute which means that even when I like the music from mashups and hittests (and this happens often enough) I can't buy it right away. Back at home I usually don't know the title/artist anymore and don't have the time to relisten to DSC either. Would it be possible to list the songs used in the masups/hittests directly in the show notes? b) The best source to get mashup/hittest impact on music sales would be Apple/ITMS. Can't you use your contacts inside Apple to find out whether the sales number for a given title raises after it has been played in DSC? Kind regards, Patrick
    - Winwood on the HitTest - all your fault!
      - Jason Hollowed ben_nushmut@mac.com to adam More options 3:37 am (12 hours ago) Hey Adam, Just wanted to continue with the back-catalog line you brought up in DSC#230. I actually have the Winwood album Back in the High Life from iTunes already, but I was inspired to listen to it again after nearly a year away from it. OH MY GOD, I'm still amazed at how incredible Steve's voice was here. And as brilliant as Higher Love is, my personal connection goes straight to the title track. When I was born (October 28, 1986), that was the song playing on the radio when my dad got to see me for the first time. Even though I was I newborn at that moment, the song still resonates with me and actually brought me to tears in my dorm room as I listened to it (I was alone, but it wouldn't have mattered if I heard it with one or a dozen people in my room. It just reaches deep into my soul and brings out a part of me I'm still amazed even exists. Anyway, just wanted to thank you for a great podcast, I only wish I had the kind of time and resources you have to devote to your show to give to my podcast that I just started (yes, this is a plug coming in for landing!). It's about the college experience on a campus in (literally) the middle of nowhere, Missouri. The first episode was a soundseeing tour of my campus, the second features some clips from a concert I went to featuring a cover band. Check it out if you have 45 mins for the first 2 shows. It's at TruCast and in iTunes; search for TruCast. Thanks and keep up the great work! You are one of the reasons I've started doing my show! Jason Hollowed College Freshman, rookie podcaster, and (if all goes well) Future Music Educator
    - No iTunes down under
      - Craig Ashley Russell: Left Field craig@leftfield.com.au to adam More options 2:55 am (13 hours ago) And man, are we pissed off about it. Next time you're taking Jobs, tell him to put a rocket under the record companies. Cause until then, it's Limewire for Aussies, where no one makes a cent!
    - Fantasy
      - John Knell john@lightform.net to adam More options Aug 29 (18 hours ago) Hey Adam, Just bought "Fantasy" off of Itunes.... then I remembered how cool "Let's Groove" & "Boogie Wonderland" were and got them at well. So....Earth Wind & Fire got 3 songs downloaded because of the Hit test. Enjoy the Daily Download and keep up the great work. Best regards John Knell
    - 3K of iTunes!
      - Nery Orellana nery@swervedesign.com to adam More options Aug 29 (20 hours ago) Hey adam. I can't begin to tell you just how many tunes I've bought after hearing mash-ups and hit tests. I think I've spent in total to date since iTunes launched in canada just over $3000 on albums and audiobooks. It's funny I used to find my music on torrent sites before itunes showed up. And I find myself downloading great oldies versus new releases. PS> love your podcast. Love the whole rss movement and keep up the great work.
    - Doug Kaye
      - Doug Kaye to adam More options Aug 29 (21 hours ago) I should be embarrassed to tell you this -- wait, I *AM* embarrassed to tell you -- but after listening to the "Toxic Shack" mashup on the Daily Source Code last week, I went to iTunes and bought Britney Spear's "Toxic." I just wanted to hear the bass line in its original context. Really! Trust me! It was just the bass line. I'll probably never buy another Britney Spears song again, but it's more evidence that mashups do sell music. ...doug Doug Kaye, Executive Producer
    - 10 cds
      - Jon Pielaet kd7swh@gmail.com to adam More options Aug 28 (2 days ago) Hi Adam, Just wanted to let you know I have been here since day one of iPodder.org, and will be a lifetime subscriber of the Source Code. Now attending the University of Montana, (Missoula, Montana USA) I volenteered as a technology assistant in my dorm so whenever I go out on a call I tell the residents about podcasting and RSS feeds. It really seems to catch on quickly and everyone is joining "the march". As a side note in reference to your question about mash-ups in episode 229, I have bought at least ten CD's (AAC's worth) as a result of the daily source code. Podcasts can also be great marketing tools if you aren't afraid to put in the effort. If anyone needs an example, look at Rob Costlow. I gave him his first Amazon.com review after hearing him on the show and his amazon sales have surely gone up. In any event, there is no question that "we" can make it ("the march") happen. Best Regards, Jon Pieleat (Pie-lay) Miller Hall at the University of Montana-Missoula
    - Legal Mashup
      - Craig Meyer to Adam More options Aug 28 (2 days ago) Adam, You've been doing a great job promoting Indie podcasting. Thanks for all your efforts. I always enjoy the "Daily SourceCode", it makes my commute most enjoyable. I usually arrive at work (or home, depending on when you post) with a smile on my face, and/or quietly giggling to myself. I've been kicking around an idea for reducing bandwidth usage for certain style podcasts. In your recent (#228, 229) podcasts you were talking about MushUps, and something clicked in my head. The quick overview: Generate (assemble) the MashUp on the Users machine. Rather than sending the final MP3 product, send the instructions to a MP3 ReGenerator to build the MashUp from the constituent sound files using a file (stream) of MP3 Assembly instructions. So the User would use iTunes (AllOfMP3.com ;) or existing copies of the MP3 songs, with the MashUp instruction file. A new program would then stitch together the MashUp on their machine and either output to the speakers directly or create an MP3 file for the User to listen to. Assuming the final User has legal copies of the Original music, the MashUp created on their machine is all kosher! This would generate sales of the originals, and avoid RIAA jumping in to kill this new creative art form. It avoids DRM issues, and nicely finesses the "Fair Use" of User's legal copies. This would require creation of two programs: The instruction generator "Compiler", which is used by the MashUp creator. And, the MashUp Assembler engine which would use the instructions to generate the desired MashUp. The instructions would actually be quite simple, involving, selection from the original, and then either straight copying, or blending/mixing with other selections (with optional volume, pitch?, speed?) adjustments. If needed MD5 signatures of the Song originals could be used to verify that the User has the "Correct" version of the song, though this might not always work. Now, given that we have these two applications the Instruction Generator (Compiler) and Assembler. This same idea could be used to reduce the bandwidth usage of certain style podcasts, such as yours! My assumption is that Comcast and other broadband suppliers do some transparent caching of content to avoid always re-fetching common items. And also, that a dedicated listener would have several pre-existing podcasts already on their computer. Since the "Daily SourceCode" is composed of various bits, bumpers, promos. Extend the RSS enclosure to add an optional section. This would build the new podcast from smaller segments, either fetched from the internet (which would hopefully be cached at the broadband suppliers head-end), or optionally as segments copied from known offsets in pre-existing podcasts. I am assuming, that you are using CastBlaster or MegaSeg, with pre-loaded sounds bits to play. I haven't done any analysis, but your shows do have repeated segments. From something as simple as Boing, to the PodShow bumpers, and promos. Now, sometimes you do talk over this segments, (in which case maybe you only send the voice track to mix into the pre-existing segment) This PodCast Assembler idea, all falls apart with something like Dawn and Drew, where there are very few repeated segments. I realize this does a software effort, and also working with the MashUp creative people. I am hoping that CastBlaster's general front- end could be re-used, but replace the MP3 output, with a MP3 Assembler instruction generation module. So, What do you think? Craig Ps. Simplified Example of Assembler instructions Assuming song1.mp3, song2. mp3 and song3.mp3 The Result would mix 23.1 seconds of song1 (at 1/2 volume) with a looped 10 seconds of song2, and with 23.1 seconds of song3 (Pitch increased by 12%) or for the Daily SourceCode, something like: . . .
    MP3 Licensing
    - Paul Huff paul.huff@gmail.com to adam More options Aug 29 (17 hours ago) Hey Adam, I'm starting to wonder what's going to happen when the Thomson folks come knocking on the indiecasters doors asking for their minimum royalties of $2000 a year for using mp3s... mp3licensing.com—emd.html As podcasting gets more popular and all the licensing stuff happens with the music, I've been wondering when Thomson is going to try and make itself heard. I have a tiny podcast myself, and have been afraid to do any kind of money-making scheme (advertising, sponsorships, paypal donations, etc.) because I'm afraid of having to pay Thomson anything. Any thoughts? Should we be trying to move away from the mp3 file format? If so, where do we go? Nothing else is as widely supported, it seems... At any rate, keep up the great podcasts... -Paul
