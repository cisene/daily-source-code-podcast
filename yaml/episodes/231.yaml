    - Peak Oil
      - Stephan Segraves s@badice.com to adam More options Aug 28 (2 days ago) Adam, I finally caught up on my listening after a move. The comments by Darren while true have a few things left out. Peak oil is a theory that relies on the assumption that technology will not increase over time. We have come very close to using up known oil resources in the past then a new technology comes along and allows to continue to pumping from wells that would not produce without the technology. People need to understand that oil does not sit in pools underground. It is found in porous rock. The more porous a rock the more oil it holds. The more permeable a rock is the easier the oil flows out of it. With a lot of the new technology we are able to go back to old wells that may have been less permeable and pull out more oil. These technologies include steam flooding, where the well is pumped full of steam and the change in pressure brings the oil and steam substance to the surface. Yes, oil is a finite resource but it is not a predictable finite resource. Five years ago geologists were predicting 35 years of oil left on the face of the Earth, now we are predicting 75-80 yrs. before hitting peak oil. I am all for the use of bio-diesel but it is kind of expensive to produce. There are other technologies as well, such as coal to liquids, which allows us to create gasoline from coal. This is being started in China, www.upi.com—view.cfm and is pretty exciting. Coal is great because there is a huge amount of it and with new drilling laws we can keep The ultimate answer though is to move away from non-renewable energy. The oil companies are scrambling to jump on these things and the company that I worked for (which will remain nameless, though I am sure you can do a search and find it) has started real life experimentation with Hydrogen in Washington D.C. Keep up the great work Adam! -- Stephan Segraves
    Teenagers cont.
    - From a teen
      - Kabren Frostig kabrenlevinson@comcast.net to adam More options 5:00 am (11 hours ago) Hey adam, I heard the source code today, and heard the feedback from an actual teenager, I am a teenager, actually turning 16 soon, so around the same age group. As with a lot of parents, I am an only child by the way, my parents have never experienced a child grow up, let alone a teenager grow up. They seem to have a hard time letting go, at least my mom. I guess its different, since this is feedback from a male teenager, but being a teenager is hard enough with highschool, and friends, espicially being the big geek I am, we don't need any more trouble from parents. Hope this will add to your experience with a teenager. Love the Source code, Kabren (prenounced KAY- bren)
    - Teen from Belfast
      - Fra grogan darkchild@gmail.com to adam More options 4:18 am (11 hours ago) Hey Adam, My name is Francis, I'm 15 and from Belfast. Just heard the DSC for the 29th and heard you talk about Mark the surgeon. Last September I was diagnosed with Hypertrophic cardiomyopathy (I fucking DARE YOU to try and say that aloud) or simply HCM. Currently to keep my heart under control I take 1 5mg Beta-Blocker pill a day and I've done the 24 heart monitor thing. Since I always keep on forgetting to ask my doctor, are there any side effects I should expect sometime in the future (even know I've been on beta-blocks for a year) And I do watch MTV, because the simple fact is, I like to look at other people's shallowness (if that's even a word) Cheers.
    - From a 13 year old
      - Geoffrey Sneddon geoffers@gmail.com to adam More options 12:11 am (16 hours ago) Hey, I'm a 13 year old boy, and my relationship with my dad is minimal, mainly because he's either dealing with work stuff, or with political stuff - He used to be head of the North East Fife district council, for which he received an OBE. This means he is rarely in the house and not busy. When he is in the house he is often dealing with his 2500+ videos (ergh!). I'm taking you have either been too busy to reply to my previous email, or just been at 100% on Gmail (I'm still at 8MB - 0%!) Umnmmmm... I think that's all... Geoffrey Sneddon.
    - From a dad
      - Ben Collins to adam More options 12:05 am (16 hours ago) This past weekend I introduced my son Nick, (13) to the concept of a podcast. We listened to a few that I subscribe to and spent some time talking about what he could do one on. Nick is pretty typically into what most 13 year old boys are, particular video games which he will play as many hours as he can stay awake. He's pretty computer literate and in about half an hour I showed him the basics of Sound Forge and Acid. He sat and worked for about 4 hours straight and designed and created his own podcast; gameSNAFU. At the end of the day he was thrilled with his own efforts and success. For a teenager that is phenomenal concentration and follow through. He spent the rest of the day IM-ing his friends planning new episodes and working on his subscriber base. Wow. As every teenager will tell you, they are smart and insightful. And as any parent will tell you, they need focus, guidance and a creative outlet. Podcasting fits the bill brilliantly. It can be simple or technically sophisticated, meaningful or silly...whatever they want. And it gives them something to do that is active not passive at a time in life when that is really important. Many thanks, Ben Collins
