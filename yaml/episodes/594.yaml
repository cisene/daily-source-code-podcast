    <p><strong>#594 Daily Source Code for Thursday May 3d 2007</strong></p><p>From The Curry Manor, Guildford, UK</p><p>Today's show is all about The Code. <br>Of course this refers to the HD-DVD key that has been<a href="http://www.nytimes.com/2007/05/03/technology/03code.html?_r=2&amp;oref=slogin&amp;oref=slogin">in the news</a>. Super Savants Prolific Programmer and Geoff Smith help propagate the virus with words and music. And it's catching on, Cali Lewis has already done a music video of it! <a href="http://www.btpodshow.com/video/?persona_id=14&amp;movie_id=cb7bf7afa4d2bf4c1550d0ccf80dfdd1">Digg The Code</a>, and play this show. <br><br><strong>Music in this episode: <br><br></strong><a href="http://www.btpodshow.com/music/?artist_id=167">Geoff Smith</a>and The Impressions - Rythm<br>Ge<a href="http://www.btpodshow.com/video/?persona_id=14&amp;movie_id=cb7bf7afa4d2bf4c1550d0ccf80dfdd1">off Smith</a> - Digg The Code<br><a href="http://www.btpodshow.com/music/?artist_id=4984">Junior</a> - What Was I Thinking</p><p>Anji Bees<a href="http://unwind.podshow.com/">Unwind</a> , sponsored by Tylenol PM</p><br><div><strong>Call or VoIp the VoiceMail line anytime:</strong></div><br><div><span class="contentIndent">+1<span class="jajahWraper"><a class="jajahLink" title="Click to call this number with JAJAH..."><span class="jajahInLink">201 625 6357</a>or<span class="jajahWraper"><a class="jajahLink" title="Click to call this number with JAJAH..."><span class="jajahInLink">+44 207 681 3753</a></div><br><br><div><span class="contentIndent"><span class="contentIndent">Dig me: <a href="http://adam.podshow.com/">adam.podshow.com</a></div>
