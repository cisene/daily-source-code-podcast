   sids email
    sid
    to Adam
      More options 4:33pm (11 2 hours ago)
    Your comment about mash up are temporary is wrong, Mister Curry. it's the
    same as with everything that's new and in reach for everybody: there's a lot
    of bullshit in the beginning and the real quality will survive. I'll never
    forget the feeling when I heard Beyonce vs Michael Jackson (Crazy in love &
    Thriller) Euphoric !! If you don't know that one (especialy for you):
   Beyonce vs Micheal Jackson
    Thriller In Love
  Updates
  Dishwashers continued
   email
    ohn Hartnup
    <john.hartnup@gmail.com> to adam
      More options 1:05pm (26 minutes ago)
    Hi Adam,

    The two dishwasher plan was not new to me, but has anyone described to
    you the logical extension of this plan?

    It's simple: buy two houses next to each other, with identical furnishings etc.

    Live in one house until it is no longer habitable. Then simply move
    next door. While you're living in house number two, get industrial
    cleaners to clean the dirty house ready for when you need to swap
    houses again.
  Jan Polet
   Jan Polet's Hit Test
