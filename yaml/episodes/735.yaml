    <p><strong>#735 Daily Source Code for Wednesday March 19th 2008</strong></p><p>I prety much went off my rocker after reading<a href="http://www.guardian.co.uk/society/2008/mar/16/youthjustice.children">this article</a>from today's Guardian. Test our kids for 'criminal behaviour' through DNA when they are 5 years old? They're coming for our kids now people. We stick with the general 'You Work For Us' government theme, with good feedback on the voicemail and three great tunes. </p><p><strong>Music in this episode:</strong></p><p><br><font size="2"><a href="http://www.btpodshow.com/music/?artist_id=13647">Creamy.dk</a> - We Got The Time<br><a href="http://www.mashuptown.com/2008/03/pheugoos-beauti.html">Phuegoo</a> - Beautiful Easy Girls<br></p><p>Here’s the DSC Demographics<a href="http://tinyurl.com/356kct">survey link</a></p><p>For lowest prices on domain names, check out the<a href="http://curry.podshow.com/?page_id=845">DSC GoDaddy coupons</a>you can use for the best discount anywhere.</p><p>Now available exclusively through PodShow, a<a href="http://curry.podshow.com/?page_id=846">15% discount</a>on the Nokia N810 Internet Tablet. Check out my promo codes and coupon page links.</p>
