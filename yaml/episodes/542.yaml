  <a href="http://ggdub.podshow.com/">Girls Gone Weed</a> Podcast<br>
  Free Trinity <a href="http://freetrinity.com/">Site</a></p>
  	<p>Music in this episode:<br>
  <a href="http://www.btpodshow.com/music/?artist_id=8342">PM</a> - Brother Can You Help Me<br>
  <a href="http://www.btpodshow.com/music/?artist_id=6211">Roadside Attraction</a> - Asshole</p>
