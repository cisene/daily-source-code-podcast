           	<p>#542 Daily Source Code for Thursday February 8th 2007</p>
  	<p>From The Curry Manor, Guildford, UK</p>
  	<p>Snow hampers the best of laid plans, which today included <a href="http://comicstripblog.com/">Comic Strip Blogger</a>.
  No worries, plenty to fill the void with. Geeky moments about gPodder
  and the Nokia N800 as well as more &#145;potty&#146; reports from around the
  globe.</p>
  	<p>Make sure your vote is counted! Text (SMS) your preference to:<br>
