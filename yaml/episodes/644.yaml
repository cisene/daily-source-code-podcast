    <p><strong>#644 Daily Source Code for Thursday August 2nd 2007</strong></p><p>From The Curry Manor, Guildford, UK.</p><p>Ha! Just when you thought it wasn't going to happen, here's your thursday cha-cha goodness. An update on today's channel crossing, some mellow chatter and deeper thoughts about awards, coopetition and life in general. Also a chilling<a href="http://dawnanddrewwp.podshow.com/nick-starr/">situation</a>over at the Dawn and Drew Show.</p><p><br>Sir Elton wants to<a href="http://www.thesun.co.uk/article/0,,2-2007350453,00.html">close down</a>the internets<a href="http://youtube.com/watch?v=BBwepkVurCI"><br></a><br>Brand New: The Season Finale of<a href="http://portcitypd.podshow.com/">Port City PD</a><br><br>Visit The PodShow<a href="http://suckless.podshow.com/">Suckless Zone</a></p><p><br><strong>Music in this episode: <br></strong><br><a href="http://www.btpodshow.com/music/?artist_id=10871">Jeriko</a> - Happy<br><a href="http://www.btpodshow.com/music/?artist_id=10857">Carbon Leaf</a> - The Boxer<br></p><p>Call the VoiceMail Line anytime to help the revolution. <br>Tell us your story of Mainstream Mockery and Deception: <br></p><p>+1 201 625 6357 or +44 207 681 3753<br></p><p>Dig me: <a href="mailto:adam@podshow.com">adam@podshow.com</a></p>
