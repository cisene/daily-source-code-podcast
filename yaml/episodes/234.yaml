    questions regarding new podcasters
    - Hi Adam, I'm sure this one of many many emails you've recieved from newbies such as myself. First off, The past few months have literally changed my whole perspective on things. When iTunes 4.9 came out, I was introduced (finally) to the wonderful world of podcasting. I'll be honest Adam. I feel I can and will make a name for myself in podcasting. There is one problem though, when it comes to the tech side of things, I don't know where to start. Is simplly want to put out a quality sounding show where I can talk to the listeners, play them kick ass music that they should be hearing but aren't, and maybe make somebody laugh they're ass off from time to time. That's not too much to ask, is it? Not that you wouldn't, but I feel I like I may not get a reply from you due to the volume of emails you must recieve. However, if anyone would have the right answer to my question, it would be Adam Curry. I'm a PC user (boo hiss). I know I know. I'll have a mac soon if it fucking kills me. Anyway, I was wondering what the best software for a PC user/ beginning podcaster could use to produce a quality show. I can't say money is no object, but I'm not exactly starving. Also, can you recommend a website or book where I can get information on how to set up a feed, get a server, etc . I realize you are a busy man Adam, but any info you may be able to provide would be much appreciated. I know this is a bit long but I have to tell you this. I must congratulate you for the wonderful things you've managed to accomplish. I'm 33 I remember you on Headbangers Ball. I never would have guessed that that guy from MTV would help create the next movement. I truly want, no, need to be a part of this. I feel podcasting is going to literally change the way we percieve the media. I just love the idea that average people, Dawn & Drew for instance, can touch people and be successful simply for being themselves. I obviously could go on and on. If you've gotten this far, thank you so much for your time. I love the DSC and enjoy your show on Sirius. Keep up the fantastic work that you do. I hope this doesn't make me come off as a kiss-ass. I'm just bouncing off the walls, driving my wife and kids mad trying to figure out how to get into this. Cheers! See you at the Expo in Ontario. Respect, Dan Ramirez
    Soundvertising
    - That Senseo moment
      - Adam, I listen to the DSC at work(!) so when you did the Senseo thing I was looking at my screen (AS/400 RPG ILE code, if you want to know). That means I now get even more distracted than ever! Thanks ;-). But it's worth it. Renato.
    - Remembering Podcasts at Certain Landmarks
      - Hey Adam! I am a teenager but I am not going to talk about the teenager conversation. I try to make a little money over the summer by cutting lawns. To help past the time while cutting the lawns, I listen to podcasts. Normally I follow the same pattern when cutting a certain lawn. I have experienced the same thing as DGA (is that right?) when I get to a certain point when cutting a lawn. I remember something someone said or an interesting conversation in a podcast when I reach that point the next time I cut that lawn. I feel a little better now that I know other people have the same problem. Best of luck with Podshow, Sean
