    - Reaction on Katarina
      - Hi Adam, I would like to reflect on your call for help for the people in New Orleans. First of all I want to say that it must be horrible to encounter and I certainly don't want it to happen to me. But (and yes there is allways a but) yesterday also 900+ iraq people died on a bridge. And I am not hearing anybody care about that, what makes Americans more important than the people of Iraque? Most of those Americans have money and are insured but those poor citizens of iraque have nothing. The goal of my message is not to upset the people in New Orleans but to try to open the eyes of all the other people in the world. To let them see how much they are being manipulated by the media, the media acts like the many people in Iraq dying are just numbers but when it are Americans or citizens of any other western nation are special and the coverage is more emotional and personal in order to get many people involved. I plee for a more objective coverage of the news because todays journalism is not real journalism anymore it is more sensation and subjective coverage than nice objective coverage which is assisted by evidence. So far my opinion on todays journalism i would like to here your reflections on this. Greetings Basiel
