    - How the Podcast community could create NOLA relief fund by itself
      - Hi Adam I had a thought about how the Podcast Community (PC) - or at least part of it - could create real money for the NOLA relief effort. My idea is that several key players in the PC could each contribute 5 minutes to a Podcast and the resulting mega-cast could be sold for (say) ten bucks via iTunes with the proceeds going to NOLA. For example you could kick off the show, and then had over the resulting file to PJ Fenton who would hand over to Dawn and Drew who would hand it off to Madge who would hand over to Wichitaw Rutherford etc etc - and the resulting show would be a "collectors item" only available for a limited period. This wouldn't take long to put together as the file could just be played in CastBlaster by each participant before they add their bit and then pass on the file+1! The iTunes DRM would stop mass file sharing and because it wouldn't be around for a long it would encourage folks to download it NOW. I am in UK so feel kind of impotent to do anything material to help from here but I thought this would be a neat way of getting the PC to deliver for NOLA from its mass listenership. What do you think? Best regards Paul Parkinson theflashing12 podcast at www.theflashing12.com
