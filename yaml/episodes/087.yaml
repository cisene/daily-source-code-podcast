    iRiver hacking
    - From: meowing@xs4all.nl
    - Subject: iriver stuff
    - Date: December 14, 2004 9:53:30 PM GMT+00:00
    - To: Adam Curry
    - Hi Adam,
    - about the USB thing, I thought the same for quite a while,
    - after discovering that my o.s. was lacking the appropriate
    - up to date USB-driver. Can't blame iriver for that.
    - Don't remember where I got it, but it is out there,
    - and it's really blazing fast now, at least, mine is.
    - I have the iHP-140, with a 40 GB hard drive, bought it online
    - in February 2004, and luckily, Windows AND linux by default
    - recognized it as a drive. Just a portable drive, a USB-drive.
    - Never used the iriver CDroms, never needed additional software
    - to transfer files. Just used my plain old Total Commander
    - (which is like Norton Commander, but better, and for Windows).
    - No DRM-crap either. They must have gotten paid by the wrong guys,
    - iriver used to be a real key nerd tool, it supports Ogg Vorbis
    - and you can hack the firmware easy as sh*t.
    - Tip: http://www.misticriver.net/
    - http://www.misticriver.net/boards/showthread.php?t=6677&highlight=usb+speed
    - The manager-software only stuff is also with most of the Canon-
    - camera's, and that's why I don't have a Canon digital cam ;-)
    - I like all my equipment to be external drives, just like you.
    - (Guess iriver stole that thing/idea from Canon then...)
    - OK that's it for now, podcast ze!
    - Greetings from Amsterdam, the NL,
    - Julius
    - --
    - You don't stop laughing because you grow old,
    - you grow old because you stop laughing. - http://lulligvoorje.nl
