  <div class="storycontent">
           	<p>#445 Daily Source Code for Monday August 21st 2006<br>
  From Curry Cottage Guildford, UK</p>
  	<p>Throughout
  the show we&#146;re watching the PodShow Plus infrastructure troubleshooting
  process, while discussing the topics of the day: Liquid Explosives
  (Mentos anyone?) Moonlanding validity and a short lesson in women
  talking sexy. I start of with several minutes about my weekend touch
  and go landing practice and busted airspeed indicator that some may
  want to skip.<br>
  &nbsp;<br>
