    - Alexander Bell was born and mostly educated in Scotland before briefly living in Canada. He moved to the States when he was 23. And, as you can see from this page on the Mother Corp's website, here in Canada it is said that h e dreamed up the telephone in Canada (and then constructed it in the States). http://www.cbc.ca/greatest/top_ten/nominee/bell-alexander-graham.html All 3 nations probably have some claim to Bell, it all depends on who you're talking to. Educated in Scotland, inspired in Canada, empowered in the United States (already in the 1800s it was apparently the place to launch new tech ventures).
