      - Commenting on:
      - http://www.blognewsnetwork.com/members/0000001/2004/11/21.html#a6895
      - I have my own theory about why the US and UK drive on different sides of the road. During the Revolutionary War the colonists moved their channel markers (marking the entrances to harbors/ports) so that it was safe to stay on the right side of the marker. The British (and previously the colonists) rode their boats on the left side of the marker to stay safe. Thus when the British tried to attack via ships coming through the channel they grounded their boats by going left. So chock it up to us sneaky Americans. That's my theory anyway.
