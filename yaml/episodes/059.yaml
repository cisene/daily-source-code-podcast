    - Adam:
    - If you want the iTrip tone files to *actually* change frequencies, you
    - have to NOT play the bit after the pause. It's a "cancel code" that
    - makes the iTrip NOT change frequencies. It's there so if your iPod
    - plays the frequency songs by accident (say, during "all play, shuffle
    - mode") then your iTrip won't change frequency.
    - The instructions for actually changing the frequency is to start the
    - file playing until the iTrip starts blinking, then Pause playback.
    - This *prevents* the stop codes from playing, and then the iTrip
    - actually changes frequency. Get it?
    - And, please don't send that in your podcast. It would suck for anyone
    - using an iTrip and no longer packing the iTrip files to change back.
    - Or, worse, fumbling with their iPod in traffic and crashing. I used
    - to use an iTrip and I would curse your name if you did that.
    - Sincerely,
    - ///d@
