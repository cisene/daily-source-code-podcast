   email
    Michael Ridley
    Hey Adam-

    Been listening to the Daily Source Code for a few months. Very much
    enjoy the program. I enjoy the mashups that you play, as it's always
    fun to hear new and creative things. As you know, there are some
    legality issues surrounding making and distributing mashups since the
    mashup producer does not typically get the sampling and redistribution
    rights to the original music. One idea that has been thrown around on
    the pho list (http://www.pholist.org) for quite a while is client-side
    mixing of mashups. As far as I know it's still just an idea and I'm
    not aware of any software that actually does it. But I think it's an
    interesting idea and who knows- maybe it will take off one of these
    years.

    The general idea is that instead of the producer releasing the actual
    finished product of their remix (in mp3, CD format, whatever), they
    would use some tool (presumably something that works similar to Sony's
    Acid or the other remixing tools out there) to do the mix. But then
    they would distribute the mix as instructions - data - to be input by
    a client side tool. The listener would already have to have the
    constituent songs that make up the mix (presumably loops, samples,
    etc. would be distributed with the mix instructions). The client side
    tool would read the mixing instructions and render the mix output on
    the fly. In this model, the producer doesn't have to (potentially
    illegally) redistribute any of the source songs. It would be up to
    the listener to already have copies of the songs.

    Again, as far as I know this is just a concept that has been floating
    around for a while. I'm not familiar with any tools that actually DO
    this on the production or listening side, or of any standards for it.
    But I have always thought it was a creative solution to the copyright
    problem.

    Anyway, thanks for the great program. Keep up the good work!

    -m
    http://www.secretelite.com/michael
  Airport security
   email
    Wayne Pittenger
    Dear Adam,

    Got an interesting story about the state of airport security. My
    wife's friend visited us in Pennsylvania from Florida. Before she
    flew up here, she packed duffel with about 80 plastic easter eggs
    packed with various prizes for an easter egg hunt. Her husband had
    warned her that she might not get through security with a duffel full
    of easter eggs. In spite of that, she went through airport security
    and the flight north without as much as a search through the duffel.
    She still had to have her shoes checked though.

    Regards,
    Wayne Pittenger
    www.techntunes.blogspot.com
  Podcast at 37000 feet
   email
    Chris Stork
    You were my sitter in the 80's when i told the folks I was too sick
    for school. The bummer though is my 24 year old wife listens to the
    DSC and says, "Adam who?"

    Since it sounds you are an aviation buff - thought you'd like this.
    I'm a captain on an ERJ-145 for a U.S. regional airline. I plug my
    ipod into the observer audiopanel and listen to the daily sourcecode
    on long flights at 37,000 feet. You come in through our headphones and
    keep us entertained like The Lone Ranger did for our folks. With 16
    million dollars of airplane strapped to my ass and next generation
    radiocontent in my ears I like to think i'm flying into the future. As
    the sun set last night we were ontop a thin layer of clouds around
    flight level 350. When the last wisp of light fell under the deck and
    the stars popped out above it was as if we were on the edge of the
    atmosphere. For a second - we were major tom and you ground control.
    Unfortunately, as I enjoyed that moment, my flight attendant called up
    to say some dude was yacking in the aisle.

    Thanks for keeping us smiling up at altitude.
    Good luck in your flight training.
    Hope to see you on a flight.

    I had Foghat on a flight once off to a gig at the Dayton Ohio Civic
    Center. They've come along way. I made the PA to the back about the
    weather and what have you. I ended by saying, "It's been a slow ride -
    so take it easy."
    They got off, looked up and gave us the three fingered "You're a
    rockstar" salute.

    Chris Stork
