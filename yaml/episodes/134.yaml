  Sid's mashup of the day
   djwig
    This is how we burn beds
   Here a track by John Wignal, A.K.A: Dj Wig. Quality of sound is not really
   that good, but it's a briliant Mash. Beds are burning (midnight oil) and
   This is how we do it (Montell Jordan) were made for eachother.

   Later this week: 80's porn version of ' Back to Life' (Soul to Hole).

   Have fun.

   Mash Sid Up
  Beatallica legal hassles
   email
    Eric Kauschen
    <eric@saundhaus.com> to Adam
      More options 3:42 pm (11 2 hours ago)
    Adam,

    You have a far greater listenership than my podcast so you might want
    to mention that if you record a song as a parody of the original you
    are protected from copyright infringement. Weird Al Yankovic showed
    this to be true when he recorded parody songs that when he asked the
    original artist for permission first and they said no he did it anyway
    because it was a parody. I would think that Beatallica presenting
    Beatles songs in a parody format styled like Metallica should fall
    under this as well, but Beatallica should check with their lawyers as
    well.

    Eric Kauschen
    Saundhaus Studios
  Madge Weinstein
