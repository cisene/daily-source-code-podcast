description: |-
  <div class="storycontent">
           	<p>#535 Daily Source Code for Tuesday January 30th 2007</p>
  	<p>From The Curry Manor, Guildford, UK</p>
  	<p>I
  think we have a winner for the name of the new place, details in this
  episode, also, finally a start on our Free Trinity project with a <a href="http://www.brevardbiodiesel.org/map/bd.html">google map</a> of biodiesel stations in the USA, can we add europe now?<br>
  All that, awesome podsafe music (more reggae!) and a new question to ponder: &#147;Are posh people pigs?&#148;</p>
  	<p>Make sure to check out <a href="http://bolivianrhapsody.podshow.com/">Bolivian Rhapsody</a></p>
  	<p>Music in this episode:<br>
  <a href="http://www.btpodshow.com/music/?artist_id=8175">Burning Spear</a> - Holy Dub<br>
  <a href="http://www.btpodshow.com/music/?artist_id=7385">Quiet Riot</a> - Free</p>
  	<p>Buy a domain name from <a href="http://godaddy.com/">GoDaddy</a> and use code DSC3 for a great discount!<br>
  <a href="http://destinationflavor.com/">Splenda</a>&nbsp;-<span class="jajahWraper"><a class="jajahLink" title="Click to call this number with JAJAH..." jajahtargetnumber=" +1-206-600-4415" href="javascript:void(0)"><span class="jajahInLink"> +1-206-600-4415</span></a></span>, what&#146;s your flava?</p>
  	<p>Call the VoiceMail line anytime:<br>
