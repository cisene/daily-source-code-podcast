           	<p>#497 Daily Source Code for Wenesday November 15th 2006</p>
  	<p>From Curry Cottage, Guildford, UK</p>
  	<p>I&#146;m Mr. Mom for the next two days, and the Pod Daughter has come down with the flu big time.<br>
  Heavy on the music this time, with a mini-hit test related to the
  PodSafe Music Network, and more from the PMN from 300 years ago. Apple
  tells a big fat lie and gets called out. CSB calls in, and things heat
  up with Giselle&#133;<br>
  &nbsp;<br>
  Relevant Links:<br>
