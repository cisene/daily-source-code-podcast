description: |2-
    <p><strong>#647 Daily Source Code for Tuesday August 7th 2007</strong></p><p>From The Curry Manor, Guildford, UK.</p><p>Another outbreak of Foot and Mouth in Guildford, but it won't hurt ya! Unless you're cattle of course... <br>Lots of PodSafe Music Chatter in today's show, revisiting the concepts and culture and the successes we're booking. Indeed, we're getting closer to our caffinated friends on the expansion of the platform. <br>A followup on the Mall Fly By as well as news from Savants Atomic Rod and<a href="http://michebelzhollywood.btpodshow.com/">Michelle B</a>, who check in with their personal red-pill moments. <br><br>Brand New: Season 2 of<a href="http://portcitypd.podshow.com/">Port City PD</a><br><br>Visit The PodShow<a href="http://suckless.podshow.com/">Suckless Zone</a></p><p><br><strong>Music in this episode: <br></strong><br><a href="http://www.btpodshow.com/music/?artist_id=10871">Jeriko</a> - All Thumbs Up<br><a href="http://www.btpodshow.com/music/?artist_id=9251">Simian Mobile Disco</a> - It's The Beat<br></p><p>Call the VoiceMail Line anytime to help the revolution. <br>Tell us your story of Mainstream Mockery and Deception: <br></p><p>+1 201 625 6357 or +44 207 681 3753<br></p><p>Dig me: <a href="mailto:adam@podshow.com">adam@podshow.com</a></p>
