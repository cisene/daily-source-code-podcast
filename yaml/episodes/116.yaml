      Show options 3:17am (9 hours ago)
    Adam,

    Loved Rasputina.

    Maybe you'd like to regale your audience with yet another cover. For your
    consideration, attached is "You Don't Own Me" by Klaus Nomi from his
    "Encore!" album, 1983.

    Don't tell him not to play with other boys.

    Greg in Boston
