      - Hi Adam, Welcome to the UK and congratulations on the Culture Show piece, I'm sure that will generate a lot of publicity for podcasting. Interested to listen to your comments about the differences in plugs and TV systems in different countries . . . here's one for you :-) can you explain why all electric sockets are half up the wall in Holland?, that's always puzzled me!, why not have them at floor level like over here so they are not so obvious. Very much enjoy the podcasts, keep up the good work, - Mike
    - TV solutions
      - New comment posted on your Radio weblog.
      - Commenter's name:
      - Toby Jaffey
      - Email address:
      - toby-blog@earth.li
      - Web site:
      - IP address:
      - 83.104.55.179
      - Domain name:
      - pantheon.demon.co.uk
      - Commenting on:
      - http://radio.weblogs.com/0001014/categories/dailySourceCode/2004/11/27.html#a6906
      - Hi, I think the reason that you can't hear the UK audio on your TVs is that the rest of Europe use PAL G/B/H for UHF (5.5mhz audio offset), whereas the UK, South Africa, Ireland and and Hong Kong use PAL-I which has a 6mhz offset for th e the audio. I'm not sure why PAL-I does this, but basically it means that for RF reception you're not going to hear the audio. One way around it might be to get a Freeview (DVB-T) box which will put out SCART (where you get CVBS, audio L/R) which your TV should be able to deal with. Ok, so I rose to the challenge of being a TV nerd, this is what 3 years working for a Set-Top-Box company does for you :)
