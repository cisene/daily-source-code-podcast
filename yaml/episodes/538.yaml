           	<p>#538 Daily Source Code for Friday February 2nd 2007</p>
  	<p>From The Curry Manor, Guildford, UK</p>
  	<p>Another
  lovely day in the UK, the Manor is now really feeling like home,
  despite the occassional connectivity problems of course <img src="http://curry.podshow.com/wp-images/smilies/icon_smile.gif" alt=":)" class="wp-smiley"><br>
  Are Posh People Potty Pigs? It seems we need to do more investigation,
  but the reports are &#145;flowing&#146; in so to speak. Since it&#146;s FUBAR Friday,
  plenty of music to get you into the groove for the weekend and yes, a
  Free Trinity Update!</p>
  	<p>Links to visit:<br>
  <a href="http://sneakpeek.podshow.com/">SneakPeek</a><br>
  <a href="http://groups.google.com/FreeTrinity">Free Trinity</a> Google Group</p>
  	<p>Music in this episode:<br>
  <a href="http://www.btpodshow.com/music/?artist_id=7577">Brand New Heavies</a> - All Fired Up<br>
  <a href="http://www.btpodshow.com/music/?artist_id=2891">Straightfork</a> - Texas Gold<br>
  <a href="http://www.btpodshow.com/music/?artist_id=1584">Jessy Moss</a> - Sinkin Drinkin Fits<br>
  <a href="http://www.btpodshow.com/music/?artist_id=3351">The Shakes</a> - I Want A Better Life (UnLeashed)</p>
  	<p>Buy a domain name from <a href="http://godaddy.com/">GoDaddy</a> and use code DSC3 for a great discount!<br>
