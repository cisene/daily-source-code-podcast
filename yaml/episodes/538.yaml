            <p>#538 Daily Source Code for Friday February 2nd 2007</p>
   <p>From The Curry Manor, Guildford, UK</p>
   <p>Another
  lovely day in the UK, the Manor is now really feeling like home,
  despite the occassional connectivity problems of course <img src="http://curry.podshow.com/wp-images/smilies/icon_smile.gif" alt=":)" class="wp-smiley"><br>
  Are Posh People Potty Pigs? It seems we need to do more investigation,
  but the reports are &#145;flowing&#146; in so to speak. Since it&#146;s FUBAR Friday,
  plenty of music to get you into the groove for the weekend and yes, a
  Free Trinity Update!</p>
