    <p><strong>#658 Daily Source Code for Sunday September 2nd 2007</strong></p><p>From The Curry Manor, Guildford, UK.</p><p>On the eve of another big trip we catch up with the cha-cha community and savants for a sunday eveing solo-cast. Yep, my diva's are at a fashion event in the low countries and I'm all alone in The Manor... <br>Some great songs from the Organization for the Preservation of the Soundtrack Of Our Lives and one rant for Steve Jobs regarding mainstream asswipes. <br><br>Brand New: Season 2 of<a href="http://portcitypd.podshow.com/">Port City PD</a><br><br>Visit The PodShow<a href="http://suckless.podshow.com/">Suckless Zone</a></p><p><br><strong>Music in this episode: <br></strong><br><br><a href="http://www.mashuptown.com/2007/09/ghp-pop.html">GHP</a> - Ray Of Gob<br><a href="http://www.btpodshow.com/music/?artist_id=9485">The Stone Coyotes</a> - Back To New York<br></p><p>Call the VoiceMail Line anytime to help the revolution. <br>Tell us your story of Mainstream Mockery and Deception: <br></p><p>+1 201 625 6357 or +44 207 681 3753<br></p><p>Dig me: <a href="mailto:adam@podshow.com">adam@podshow.com</a></p>
