    Phil Schiller on Podcasting
    - wizards email
      - From: DigitalBill
      - To: Adam Curry
      - Date: Sun Jan 16, 2005 09:14:41 AM GMT
      - Subject: Does Apple know about Podcasting?
      - Attachments:
        - 3a-Phil Schiller.mp3
        - smime.p7s
        - Adam,
      - The question that keeps coming up time and again, is "Does Apple know
      - about Podcasting?"
      - Well, i think I have a pretty definitive answer. While Marc and I were
      - roaming the show floor on Tuesday, doing some man-on-the-street stuff
      - for our week of Macworkd coverage, we ran into Apple Vice President
      - Phil Schiller. Marc quickly asked him about podcasting.
      - Here's his response, in the attached clip. (hint: Booioinnnnng!)
      - Lots of other good interviews during the week, too,
      - including Leo Laporte, Wil Wheaton, David Pogue, Andy Ihnatko, and
      - Laura Burstein... check the site at http://www.wizardsoftechnology.com/
      - !
      - Laters,
      - "Digital" Bill
    - Mister Marc and Digital Bill
      - Macworld Expo - Roaming the show
