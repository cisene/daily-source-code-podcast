    EasyJet experiences
    - email from David Burgess
      - From: dbx1@comcast.net
      - Subject: Mail from David Burgess
      - Date: January 15, 2005 2:49:08 AM GMT+00:00
      - To: Adam Curry
      - Cc: dbx1@comcast.net
      - David Burgess [1] sent this email to you through comments [2] regarding this page [3].
      - Hello Adam.
      - I just thought I would share my EZ Jet experience. It has been a few years since I flew EZ Jet on the segment from Edinburgh to Schiphol, via Gatwick.
      - The experience was as you described: polite, efficient, and orderly. However, the plane was smaller: one aisle with two seats on each side.
      - The entertainment go roaring once the plane left the gate. A group made up of family and friends were traveling to a football match and celebrating a birthday, at the same time. Although the policy is for drink sales only on the plane, the flight attendant allowed for a special exception - after much begging from the already tipsy husband. He brought a bottle of champaign onto the plane and asked if it could be put on ice and served.
      - In the middle of the flight, the chanpaign was served "secretly" - at the request of the flight attendant - and with fanfare, by the enthusiastic husband - and friends. After two rounds of champaign "down the hatch" and glasses clinking, the football cheers and pep songs began. And supporters of opposing teams sang out their favorite tunes. It was an enjoyable flight. And the crew did not mind at all. A different flying experience.
      - You are right. It was in experience that might occur on a bus, rather than in the air.
      - Thank you for raising my curoisity in podcasting. I heard your interview over WNYC or National Public Radio, not too long ago. I think I will join the podcast production frey once video becomes an option, one of these days.
      - Thanks for plowing Internet new turf.
      - David Burgess
      - Freehold, New Jersey
      - [1] Your 01-13-05 podcast
      - [2] http://schoolblog.urj.nl/comments/
      - [3] http://rcs.blognewsnetwork.com/comments/about
