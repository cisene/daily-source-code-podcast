           	<p>#545 Daily Source Code for Tuesday February 13th 2007</p>
  	<p>From The Curry Manor, Guildford, UK</p>
  	<p>Still
  more sinus blockage than ever, breathng through my blow-hole today.
  Some (minor) geeky talk on today&#146;s Cha-Cha, some with our very own
  prolific Programmer, other stuff about ATOM vs XML-RPC. Yeah, even I
  didn&#146;t think I&#146;d be discussing that one! A plagerism check as well as
  background search on the Canberra times. Share your morning with me,
  I&#146;ll be gentle, I promis.</p>
