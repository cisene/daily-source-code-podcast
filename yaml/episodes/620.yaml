    <p>#620 Daily Source Code for Monday June 18th 2007</p><p>From The Curry Manor, Guildford, UK.</p><p>Post-Father's Day update. Man it's good to be back home, but as always, the setup sounds weird, my ears are shot from flying at altitude and my headset is busted. So what else is new? Well, plenty of Channel feedback, not all good I'm afraid. Compensatory measures are taken with an awesome mashup to kick off a week in Europe! <br><br>Visit The PodShow<a href="http://suckless.podshow.com/">Suckless Zone</a></p><p><br><strong>Music in this episode: <br></strong><br><a href="http://www.mashuptown.com/2007/06/two_for_tuesday_1.html">Divide &amp; Kreate</a> - Sweet Jaqueline<br><a href="http://www.btpodshow.com/music/?artist_id=9374">Kelvin Declined</a> - 42</p><br><div><strong>Call or VoIp the VoiceMail line anytime:</strong></div><br><div><span class="contentIndent">+1<span class="jajahWraper"><a class="jajahLink" title="Click to call this number with JAJAH..."><span class="jajahInLink">201 625 6357</a>or<span class="jajahWraper"><a class="jajahLink" title="Click to call this number with JAJAH..."><span class="jajahInLink">+44 207 681 3753</a></div><br><br><div><span class="contentIndent"><span class="contentIndent">Dig me: <a href="http://adam.podshow.com/">adam.podshow.com</a></div>
