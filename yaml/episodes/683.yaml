    <p><span class="contentIndent"><strong>#683 Daily Source Code for Thursday November 8th 2007</strong></p><p><span class="contentIndent">From The Curry Condo, San Francisco, California USA</p><p><span class="contentIndent">What the heck is goin' on in the world?? Seven countries are at minimum<a href="http://www.currencytrading.net/2007/7-countries-considering-abandoning-the-us-dollar-and-what-it-means/">considering</a>divesting of the US Dollar, the Lawyer's Guild is<a href="http://nlg.org/news/index.php?entry=entry071106-092734">impeaching</a>Bush and Cheney, all our wars are executed by private companies. Thank goodness for my Mac and Bangin' With Butler, without such luxuries in life it just woudn't be worth it :) If you are listening to this show on your computer, please watch this<a href="http://picasaweb.google.com/aatrvash/Iran02/photo?authkey=WHfBV-cDZ2E#s5096647238259937938">slide show of Iran</a>. This is what our president wants to bomb. Tragic. <a href="http://www.youtube.com/watch?v=KBxzvSbGJ2w">George Carlin</a>to the rescue!</p><p><span class="contentIndent"><strong>Music In This Episode:</strong><span class="contentIndent"><br><br><a href="http://www.btpodshow.com/music/?artist_id=11839">Black Rebel Motorcycle Club</a> - Berlin<br><a href="http://www.btpodshow.com/music/?artist_id=9053">One Day Remains</a> - Broken Years</p><p><span class="contentIndent"></p><span class="contentIndent"><br><strong>Call Anytime:</strong><br><br><br>+1 201 625 6357 or +44 207 681 3753<br><br>adam@podshow.com<span class="contentIndent">
