    - Mobcasting
      - From: Andy Carvin
      - Subject: An experiment in "mobcasting"
      - Date: January 18, 2005 5:07:41 PM GMT+00:00
      - To: Adam Curry
      - I've just created a new site to be used for
      - experiments in mobcasting: giving smart mobs access to
      - a community podcasting tool accessible through their
      - mobile phones.
      - http://mobcasting.blogspot.com
      - The first experiment is a mobcasting tool for
      - protestors at this week's presidential inauguration:
      - http://bushprotest.blogspot.com/
      - Protestors (and anyone else) attending the
      - inauguration will be able to call a telephone number
      - and post podcasts on-the-fly to the same website... -andy
      - __________________________________________________
