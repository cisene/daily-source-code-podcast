    - email from Podcast Paul
      - Hi Adam,
      - ?
      - Thanks for plugging the show mate. I was about to issue a summons on your behalf if I heard anymore about that wretched broadband connection!
      - ?
      - Anyway, here's that MP3 you wanted.
      - ?
      - I mentioned to you that I'm a lawyer - I do a little media work too. Can you believe it that the record executives etc who I spoke to (and know) rejected Dynamo's without even giving them a listen?!
      - ?
      - These geeks who are more interested in commercial revenue asked if the guys were "in their early twenties or younger" When I answered that they weren't..... They said they were very sorry etc, liked the sound but couldn't help.
      - ?
      - Doh! These idiots ought to join Apple!
      - ?
      - Hope you like this track mate - this is a classy cover of relax. Motorheads ace of spades in a rock-a-billy type style is also a real fave of mine - as is Jump by Van Halen in the same style.
      - ?
      - Enjoy!
      - ?
      - Paul Nicholls
      - Podcastpaul.com
