    - Alan Joyce
      - A SoundSeeing Tour of Office Depot
        - EDP34-1.17.05
    - SST for the blind
      - From: Byron Lee
      - Subject: Sound Seeing For The Blind
      - Date: January 18, 2005 11:07:34 AM GMT+00:00
      - To: Adam Curry
      - Adam, I really love the idea of Sound-Seeing, especailly since I am legally blind. I think it's cool when sighted people experiance the world through sound. It dosen't happen very often because people who depend on sight are too scared to close their eyes and head on out into the world. I would like to thank you for getting people excited about sound-seeing and I'd like to ask if you could start a node on ipodder for sound-seeing. Thanks for taking me around Gilford and South Florida, keep it up, maybe we can go on a tour in the Netherlands next week?
      - Sincerely,
      - Byron
    Surrey pronnunciation
