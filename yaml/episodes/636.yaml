    <p><strong>#636 Daily Source Code for Wednesday July 18th 2007</strong></p><p>From The Curry Manor, Guildford, UK.</p><p>Hump-Day and I'm feeling a bit under the weather, which btw is going to be spectacular next week in the UK. Mark my words on that one (and callmeout if I'm wrong). Great news as Shane and Amy have agreed to incorporate Free Trinity into their Year At The Wheel project! Finally we're gettin' some traction with this puppy. Some more updates, including the latest on Cheddar.... <br><br>Links to visit: <br><br>PodFin<a href="http://writ.news.findlaw.com/commentary/20070716_mak.html">der USA<br>A Year At The Wheel<br>SoundExchange</a>analysis<br>On More Thing<a href="http://macosx.nl/?p=showarticle&amp;art_id=2660">Podcast</a><br><br>Brand New: The Season Finale of<a href="http://portcitypd.podshow.com/">Port City PD</a><br><br>Visit The PodShow<a href="http://suckless.podshow.com/">Suckless Zone</a></p><p><br><strong>Music in this episode: <br></strong><br>Holly Woods - Live It Up<br>Phaze - Cold As Ice<br></p><p>Call the VoiceMail Line anytime: <br></p><p>+1 201 625 6357 or +44 207 681 3753<br></p><p>Dig me: <a href="mailto:adam@podshow.com">adam@podshow.com</a></p>
