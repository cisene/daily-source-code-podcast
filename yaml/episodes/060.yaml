    iDJ competition
    - ANP - 272 - Binnenland - CULTUUR03 IPODPARTY
    - Wire Time: woe, 03 nov 2004 - 12:18:00:00 - Received: woe, 03 nov 2004 -
    - 12:18:12:17
    - Primeur voor Nederland met iPod-feest in GEM
      - DEN HAAG (ANP) - 'Share your tunes' is de slogan van het eerste iPod-feest
    - dat in Nederland plaatsheeft, de iDJ Party. GEM, het museum voor actuele
    - kunst in Den Haag, heeft op 27 november de primeur, meldde organisator Bryan
    - Smiet woensdag.
    - De iPod mini is een digitale muziekspeler van Apple, die wereldwijd en dus
    - ook in Nederland een verkoophit is. Na de Europese lancering van het
    - apparaatje in juli waren de voorraden binnen korte tijd uitverkocht. "Ik wil
    - met de party voorzien in een nieuwe behoefte", aldus Smiet.
    - De iPod mini is een kleine versie van Apples eveneens populaire muziekdrager
    - iPod. Het apparaatje is zo groot als een creditcard, kan duizend liedjes
    - opslaan, heeft een agendafunctie en kan als opslagmedium fungeren. Het
    - concept voor het feest is overgewaaid uit New York en Londen.
