    Legal responses to streaming
    - email1
      - Adam,
      - Great Show, as usual Booooiiiinnnng.
      - Here is a link to what I could find written on the subject of streaming, Not only webcaster need to pay a compulsory license, radio stations that broadcast over the internet also need to pay a compulsory license as well
      - The ruling published on Monday stated, "Broadcasters who choose to transmit their radio signals over a digital communications network such as the Internet may do so under a compulsory license. The Office has determined that an FCC-licensed broadcaster is not exempt from a copyright owner's digital performance right for sound recordings under these circumstances."
      - Chris Malatesta
      - http://www.streamingmedia.com/article.asp?id=7769
      - Digital-Waves Consulting
      - Supporting our customers over the Digital Waves
        - Chris Malatesta
      - chris@digital-waves.net
    - email2
      - From: Curt Lewis
      - Subject: streaming isn't legal
      - Date: November 17, 2004 2:28:03 AM CET
      - To: Adam Curry
      - Just because there's no download doesn't mean it's legal. Streaming would fall into public performance since you're more or less broadcasting copyrighted material to a wide, public audience.
      - The broadcaster would need a license to do this. The listener would not. I'm assuming the broadcaster would not be Grokster in this case, but the person who actually owns the copyrighted material.
      - It's pretty ridiculous what obtuse lengths people will go to just so they can get stuff for free when they know quite well that they should be paying for it.
      - And, no, I am not a lawyer, but I'm pretty sure what I've said above is correct.
      - ________________________
      - C u r t L e w i s
      - BOFH Excuse Of The Day:
      - The mainframe needs to rest. It's getting old, you know.
