    - dougs email
      - From: Douglas E. Welch
      - Subject: Ear rings
      - Date: November 17, 2004 5:58:38 AM CET
      - To: Adam Curry
      - Dude,
      - Re: Earrings
      - Take a pair of side cutters to the earring stud and trim it down to size,
      - then file or sand off the newly trimmed point. Kind of a "power tools guy"
      - solution. In most cases it is gold or brass and therefore very soft metal to
      - work with.
      - Good luck!
      - Douglas
