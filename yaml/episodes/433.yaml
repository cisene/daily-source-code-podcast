description: |-
  <div class="storycontent">

  	<p>#433 Daily Source Code for Wednesday August 2nd 2006</p>

  <p>My last sunrise this trip from the Curry Condo in San Francisco, Ca.</p>

  <p>A quick wrap up of the past 3 weeks of my visit, as I prepare to fly home to my girls this afternoon.<br>Just in time for th trip, Amy Mac, from the <a href="http://fitness.podshow.com/">Fitness Attack</a> helps me with a personalized<br>workout program &#145;Adam&#146;s Assercize&#146;, be prepared to follow along with her expert instructions!<br>There&#146;s trouble in Hollywood with the unions thats brewing and I try to explain this amazing<br>multi-touch computing demo I saw on the <a href="http://www.podshow.com/showguide/?key_id=f71bd34bd8f757c51b492d6f8b3da66b&amp;feed_type=ext">TED feed</a>, you gotta check it out for yourself.</p>

  <p>Music and Promos played in this episode:</p>

  <p><a href="http://music.podshow.com/music/listeners/artistdetails.php?BandHash=00f036535c9b07ec01d2af588aa9d066">Mark Mallman</a> - Tell me how a man gets close to you<br><a href="http://www.podshow.com/shows/?mode=detail&amp;episode_id=18272">PLW Summer Club Mix</a> of Groove is in the heart<br>Great British Beer Festival <a href="http://beercast.podshow.com/">Beercast</a><br><a href="http://shrinkrapradio.podshow.com/">Shrink Wrap Radio</a></p>
  	<p>I&#146;m headed home finally, talk to you tomorrow from The Curry Cottage!</p>

  <p>Leave a voice mail anytime: +1201-625-6357 or +4420-7681-3753</p>

  <p>Dig me at <a href="http://adam.podshow.com/">adam.podshow.com</a></p>
  	<p>Direct <a href="http://m.podshow.com/media/21/episodes/18398/deltasierracharl-18398-08-02-2006.mp3">Link</a> to the show</p>
