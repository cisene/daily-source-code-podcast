  Audio inspector plugin
   email
    Adam,

    Here's a workaround tip for better audio clip level control. As you know from your many years in the business, -12 dB is the Broadcast Standard for output level. With this
    knowledge in hand, you should re-record your clips to the proper -12 dB and watch your production value increase.

    Download this FREE AU plugin application:

    http://www.elementalaudio.com/products/inspector/index.html

    1. Once installed, use your Effects settings in Audio Hijack Pro to insert "Inspector".

    2. Use the "Inspector" gain control to adjust gain input/output to -12 dB on the meters. (avg.)

    3. Re-record the audio clips.

    You could also adjust dB on the fly but you would have to be quick on the "Inspector" gain control. Don't blow out my ears and remember this, the iPod's volume control is not that accessible so a little extra time in pre-production goes a long way in audience appreciation.

    -Greg Walker
