    Mix Cast Live update
    - email
      - From: MixCast Live Beta
      - Subject: MixCast Live status
      - Date: January 29, 2005 5:29:36 PM GMT+00:00
      - To: 'Adam Curry'
      - Hey Adam, I heard you wondering about MixCast Live on the Daily Source Code
      - the other day. Here's an update.
      - I've been slowly adding people to the beta for the past three weeks.
      - Whenever I get some knarly bugs, I stop adding people until the big ones are
      - fixed. I've had 5 releases during that period, and I'm preparing for the
      - 6th.
      - The big changes in the application are mostly configuration related. In
      - fact that original demo that you linked to is totally outdated. Most of the
      - configuration is now automated. The installation includes a sample podcast
      - with effects and a soundtrack. So the first time you run the program you
      - can simply press record to start your first podcast.
      - The response from my testers has been very positive, and, I'm working hard
      - to get the biggest remaining bugs squashed before a public release. I'm
      - avoiding putting a date on it, but I can say "soon".
      - Let me know when you get your windows box together and I'll send you an
      - invitation to the download website.
      - - James
    Hazards of podcast consumption.
    - Andrew Grumet's Weblog, 1/28/05; 6:10:12 PM
    - So I'm sitting on the bus listening to another one of those "name that tune" segments on Daily Source Code. They're so much fun! On comes a tune that I recognize, and I blurt out "Can't Explain!". The guy sitting next to me turns his head and looks at me. "Oh, see, uh, I'm listening to this music trivia game."
