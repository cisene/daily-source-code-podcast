    Colege Radio Podcasts
    - From: MC Rundle
    - Subject: Podcasting UK University Styleee
    - Date: January 30, 2005 8:37:57 PM GMT+00:00
    - To: Adam Curry
    - Adam,
    - I just wanted to let you know about something great happening with podcasting and indpendent music in the UK.
    - I'm at Cambridge University (although i live in Weybridge near Guildford, hoorary!) and have set up a podcast to showcase the best in this town (note town, not just university) in the way of independent music. We have had one show up for 5 days and are already one of the highest rated student radio shows in the university. Its a closed community - with great communications in the uni press and indie societies, and its proved relatively easy to get the show known.
    - The great thing is that other universities are joining in. York university has set up their own podcast - although they are yet to put together a show - and durham and liverpool are thinking about getting shows started. Eventually we are going to have a UK wide network of university and town based podcasts, playing thousands of songs that have never been heard before - and never would have - if it werent for this podcasting thingy.
    - So, um. Cheers basically. This is awesome,
    - Your Pal
    - Michael Rundle
