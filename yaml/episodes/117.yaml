  WinAmp podcast solution
  	email
  		Frank Siedlaczek
  		<siedlaczek@gmx.de> to adam
  		 Show options	 4:22pm (2 hours ago)
  		Adam,

  		I thought your listeners might be interested in a freeware podcasting
  		recording setup for Windows XP.

  		It consists of 3 Winamp instances, a mixer (and ­ optionally - the windows
  		mixer dialogs for playback and recording.

  		Note: To run 3 winamp instances at the same time, make sure to activate
  		'Allow multiple instances'. Then start them with the /NEW option on the
  		command line (or parameter in the desktop link).

  		The 3-way-mixer (it¹s called fcMixer) allows all three winamps to play
  		simultaneously. This can be used to mix music with trailers, prerecorded
  		material or sound effects as needed. It can do automated crossfading of the
  		connected winamp instances you select. Even the speed of the automated blend
  		can be configured. But of course, you can do the fading by hand, if you are
  		a virtuos mouse user.

  		In the first winamp I have loaded a music playlist, in the second I
  		collected a few sound effects. The third winamp is configured to use its
  		built-in Input plugin called CD/LineIn. This way, it¹s possible to do the
  		voice recording with a microphone. fcMixer than mixes all that together at
  		the current levels.

  		How is the whole stuff recorded? I am using All2Wav (available from
  		www.download.com). It can record everything that¹s being played on the
  		soundcard. You can specify the quality of the recording and you are all set
  		for a live podcast recording! All of the components are freeware! Isn¹t that
  		nice ;-)

  		WinAmp www.winamp.com (I recommend version 2.80full, it¹s fast and it works)

  		fcMixer
  		http://www.winamp.com/plugins/details.php?id=71153&download=yes&url=http%3A%2F%2Fdownload.nullsoft.com%2Fcustomize%2Fcomponent%2F2001%2F7%2F10%2FP%2FfcMixer.exe

  		All2Wav http://www.download.com/3001-2168_4-10267687.html

  		I¹ll attach a screenshot of my recording setup.

  		Regards
  			Frank
