description: |-
  <span class="contentIndent"><div class="episode-desc" id="episode-desc_90641"><p><span class="contentIndent"><strong>#699 Daily Source Code for Wednesday December 12th 2007</strong></span></p>
  <p><span class="contentIndent">I was once again very disappointed as a
  United States&nbsp; citizen upon arrival at 'Liberty' airport in Newark NJ
  for a quick week of meetings in New York City. It is now abundantly
  clear that the 'Automatic Targeting System' of the Treasury Enforcement
  Computer System is showing sufficient 'points' to flag me for secondary
  screening upon entering the USA. It's called the 'Look Out List' and
  millions of Americans are on it, including yours truly. Details at the
  beginning of the show. Kinda took the wind out of me at the start of
  this trip to be honest. Vote for Ron Paul before I get sent to Gitmo!<br></span><span class="contentIndent"><strong><br>Music In This Episode:</strong></span></p>
  <p><span class="contentIndent"><a href="http://www.btpodshow.com/music/?artist_id=4303">The Michael E Thomas Band</a> - Going To New York City<br>Adam Sandler - The Chanuka Song Part 3<br><a href="http://www.btpodshow.com/music/?artist_id=12392">Duran Duran</a> - Falling Down<br></span><span class="contentIndent"><br>For&nbsp;lowest prices&nbsp;on domain names, check out the <a href="http://curry.podshow.com/?page_id=845">DSC GoDaddy&nbsp;coupons</a> you can use for the best discount anywhere.</span></p>
  <p><span class="contentIndent">Enter the <a href="http://www.btpodshow.com/shows/www.audiostreet.net/contestentries.aspx">Hard Rock Hotel San Diego</a> Battle Of The Bands. Perform live with Black Eyed Peas.</span></p>
  <p><span class="contentIndent">The new <a href="http://curry.podshow.com/?page_id=846">Nokia N810</a>&nbsp;is for sale here.</span></p>
  <p><span class="contentIndent"><span class="contentIndent"><strong><br>Call Anytime:</strong> </span></span></p>

