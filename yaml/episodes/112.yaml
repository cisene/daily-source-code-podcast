    Sound levels
    - email
      - From: Eric Kauschen
      - Subject: Line Limiter PLEASE!
      - Date: January 25, 2005 9:48:34 PM GMT+00:00
      - To: Adam Curry
      - Cc: Adam Curry
      - Adam,
      - I have to admit you're one of the few podcasts I listen to regularly and your evangelism for the format I think is great, but your levels just up and down by huge amounts. You need to put a line limiter at the end of your production so the levels don't go so loud and soft. I think Apple's Audio Units has one that's useable for free or if you've got a few bucks get the AU or VST LA-2 plug in.
      - Eric Kauschen
      - Saundhaus Studios
    PPL comment
    - From: ritterd@softhome.net
    - Date: January 25, 2005 9:16:37 PM GMT+00:00
    - To: Adam Curry
    - Hey Adam,
    - Just wanted to comment about you going for your PPL. I find your comments about the difficulty of flying a private plane very misleading. Flying an airplane is not simply taking off, throwing on the autopilot and drinking a martini, in fact I have never seen an autopilot in a single engine trainer.
    - Also navigation is not as simple as GPS, etc., unless you become instrument rated, until that time you will be flying VFR baby...time to line up that water tower for base...haha
    - Now who knows, maybe you plan on beginning your training in a Citation, but if you begin in a Cessna 152 or 172(or equivalent piper), you are in for more than you imagine. I understand that you already have your helicopter license, but there is still going to be a learning curve.
    - Anyhow, I love the the show and listen every day, however I just wanted to let you know that I feel your comment about airplanes are very misleading for your listeners, and I only hope that you will correct yourself after your first couple lessons.
    - I may be all wrong on this, and that is your experienced opinion. You may have 30 hours of fixed wing experience already, and just need to finish up your PPL.
    - Anyhow good luck to you, flying is an awesome thing isn't it? I hope to get into helicopter at some point, I find them fascinating when I am at the airport, and would love to experience it. I would imagine helicopter time is much more expensive than fixed wing time, so we will see.
    - Doug,
    - Philadelphia, PA, USA
