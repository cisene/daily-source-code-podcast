description: |-
  <div class="storycontent">

  	<p>#434 Daily Source Code for Thursday August 3d 2006</p>

  <p>From Curry Cottage in Guildford, UK</p>

  <p>Just returned from San Francisco, got in around 10am and agreed with
  Patricia that we would hold off on &#145;updating&#146; each other until I had
  reinstalled the studio for a show.</p>

  <p>I kicked it off with one of her all time favourite tracks (with permission of course) by <a href="http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewAlbum?playlistId=56209379&amp;s=143441&amp;i=56209342">Andrew Gold</a>,
  the unforgettable&nbsp;&#148;Never let her slip away&#148;. We got caught up with each
  other and have news about our house hunting. It&#146;s good to be back home!
  Also played in this episode: <a href="http://phobos.apple.com/WebObjects/MZStore.woa/wa/viewAlbum?playlistId=6371621&amp;s=143441&amp;i=6371599">Ron Sunshine&#146;s</a> Coffee and Reefer thanks to the <a href="http://www.podshow.com/showguide/?key_id=42965ae1c5340572d2c1d72793bf88e9&amp;feed_type=ext">Jazz Suite</a>.</p>

  <p>Regular listeners take note: I do a call out for you on the show&#133;<br>Leave a voice mail anytime: +1201-625-6357 or +4420-7681-3753</p>

  <p>Dig me at <a href="http://adam.podshow.com/">adam.podshow.com</a></p>
  	<p>Direct <a href="http://m.podshow.com/media/21/episodes/18721/deltasierracharl-18721-08-03-2006.mp3">Link</a> to the show.</p>
