            <p>#547 Daily Source Code for Thursday February 16th 2007</p>
   <p>From The Curry Manor, Guildford, UK</p>
   <p>We&#146;re FUBAR&#146;d again, totally out of control and how can&#146;t I be after an intro from Don LaFontaine?<br>
