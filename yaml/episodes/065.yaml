        - Curry Gets Scooped -- Adam Curry was listening to The Gillmor Gang live from Gnomedex while in the UK. He recorded it and was hoping to be the first to post an excerpt on his Daily Source Code. But he was beat out by Pete at RasterWeb! Audio. Check out the clip from RasterWeb! and AdamÕs commentary in this edition of the Daily Source Code. ItÕs at about 11:00 minutes in.
        - The Gillmor Gang: November 5, 2004 -- (The Gillmor Gang on IT Conversations). Steve and The Gang may be suffering from post-election traumatic-stress syndrome. They consider the effect of the election on technology and vice versa. Reviewing a clip from a presentation by Thomas Barnett, they ask: Is keeping the peace really a system-administraton problem? The U.S. is clearly divided, even polarized. But is it dynamically stable or will it soon tip in one direction or another? And what is the effect of information (including blogging) on the country and the election process? Is there too much data for most people to absorb and understand?
        - The Gillmor Gang: October 22, 2004 -- The extended Gang dives deep into podcasting this week with Dave Winer, Adam Curry and three of the four members of the Firesign Theatre: David Ossman, Philip Proctor and Peter Bergman. Adam and Dave give the history (all eight weeks of it) and the raison d' tre of podcasting, and Steve suggests it's similar to the early days of pirate radio. Is podcasting just a flash in the pan, or a major challenge to big-business radio? Will the impact be similar to that of blogs or something altogether different? What are the implications of Howard Stern moving to satellite, and will legislation like the INDUCE Act inhibit freedom of speech in the exploding podcasting phenomenon? By the end of the show, the Firesign guests not only get it, they're guzzling the Cool-Aid.
        - The Gillmor Gang: October 15, 2004 -- The Gillmor Gang: Google Desktop Search is this week's hot topic even though Doc isn't happy that it's not available on either Mac or Linux. No doubt it's a powerful personal tool, but what does it mean for IT departments? If it sneaks in at the desktop level, what about security and privacy? For that matter, what does it mean that "the application sends non-personal information about things like the application's performance and reliability to Google?"
        - The Gillmor Gang: October 8, 2004 -- On The Gillmor Gang, CEO Kim Polese explains what her new company, SpikeSource, is all about: making open source safe for IT by aggregating best-of-breed components. Kim believes this is part of a fundamental shift in the way the software industry works, and many Gang members agree.
        - The Gillmor Gang: October 2, 2004 -- Recorded live at Gnomedex 4.0, the Gang digs into audioblogging and podcasting. What's it all about? Is it a fad, a future trend, or here today and to stay? And what about the state of RSS? Is there too much content, a glut of information?
        - The Gillmor Gang: September 24, 2004 -- This week The Gillmor Gang tackles a little bit of everything. Sun announced CPU time on demand, but where's the real opportunity? Is it for loosely coupled systems? For remotely hosted on-demand Windows? Technology is advancing fastest for consumers and SMBs, so is that the best place to try new ideas? The iPod platform is suddenly taking off including RSS integration. Does this portend something for the enterprise?
        - The Gillmor Gang: September 16, 2004 -- Ray Ozzie is the guest on the latest edition of The Gillmor Gang. The lead developer of Notes and the founder of Groove Networks joins The Gang to look at big-picture issues. Innovation no longer flows from IT out, but from the consumer world to IT, and most innovation and growth is at the edge of the network. iPods are caches for iTunes on the desktops, which are in turn caches for the iTunes store. What does the future hold for VoIP and Skype, and what do the recent Longhorn announcements mean for ISVs? CRN's Michael Vizard returns as a Gang member.
        - The Gillmor Gang: September 3, 2004 -- Along with guest Michael Vizard, and with a week to think about it, The Gang considers the ramifications of Microsoft's Longhorn announcement: the stock market's non-reaction; implications for the channel and storage vendors; alternative user interfaces vs. Avalon/XAML.
        - The Gillmor Gang: August 27, 2004 -- The Gillmor Gang analyzes today's hot news: Microsoft will ship Longhorn in 2006 as originally announced, but without some important components. Is this good news or bad? Consider that they made the announcement late on a Friday. The Gang considers what this means for Microsoft, IT customers, open source and competitors.
        - The Gillmor Gang: August 20, 2004 -- Steve Gillmor and Technorati's David L. Sifry have been working on something called Attention.xml for nearly a year, and this week they discuss the concept with the rest of The
          - Gang. What is it? It's a specification for tracking, prioritizing and sharing
          - what people are reading, looking at or listenting to in RSS and elsewhere.
        - The Gillmor Gang: August 13, 2004 -- Fresh from a great presentation
        - The Gillmor Gang: August 6, 2004 -- The Gillmor Gang, August 8, 2004. Some of the Gang members report from Linux World. (Doc says it's too much about what the vendors are doing. [clip].) Our guests from RealNetworks discuss their plans to open source components
        - The Gillmor Gang: July 29, 2004 -- Dave Winer has had a huge impact on the Internet as we know it. Blogging and RSS? They might not exist if it weren't for Dave. Live from the Democratic National Convention, Dave joined The Gillmor Gang to discuss ConventionBloggers.com and the reaction it has received from the traditional press who have no idea what's under the covers. Dave says the DNC is "truly visionary" and have accepted this "technology transplant" but they probably don't realize what they've done. This could be the the turning point for RSS--when it becomes just another part of the infrastructure.
        - The Gillmor Gang: July 22, 2004 -- Our special guest, Dave Sifry, founder and CEO of Technorati, will be providing real-time analysis of the political blogosphere for CNN at next week's Democratic National Convention. Dave discusses this announcement and gives us his social and technical insights into Technorati: "tracking patterns of influence and authority in real time." 140+ servers give Technorati a huge grid-computing system, and Dave explains how their technology is different from traditional search engines. On open-source software, "We wouldn't exist without it." He even goes deep into the Postgres/MySQL debate.
        - The Gillmor Gang: July 9, 2004 -- Is this the start of Browser War II? Can Mozilla-based browsers corner 6% of the market by year end? And if they do, will they be targeted by the same crackers who go after IE flaws? Does the potential for "tag soup" sound like what Microsoft did to the browser market in 1996? This week's special guest is Brendan Eich, chief architect, Mozilla Foundation.
        - The Gillmor Gang: July 1, 2004 -- Special guest: Jonathan Schwartz (Sun) and guest Gang member, Michael Vizard (CRN Magazine). Solaris goes open source. Is Sun the low-cost provider because their oeprating system cost-of-goods sold are essentially zero? Will IBM buy Novell to acquire SUSE Linux?. Will Schwartz succeed in prioritizing its sales (and compensating its staff) according to the NPV of products and services? Will Wall Street let him do it? The Gang assesses the futures of Sun and its new president.
        - The Gillmor Gang: June 25, 2004 -- Special guests: Esther Dyson, chairman of EDventure Holdings (CNet), and Dan Farber, Editor, ZDNet/CNet. The program was recorded at Supernova 2004.
        - The Gillmor Gang: June 18, 2004 -- Are the venture investors back? Are they putting money into open-source software? What about Java--is it still an important platform? Should Sun make it open source?
        - The Gillmor Gang: June 4, 2004 -- Guest: Michael Vizard, editor-in-chief, CRN Magazine
        - The Gillmor Gang: May 28, 2004 -- Web services, SOAs, commodity IT and open source. Which vendors will survive and how will they do it? Why are they pushing suites when web services were all about best-of-breed components? This week's special guest is Dan Farber, ZDNet Editor.
        - CA's CEO resigns. Sun announces open-source Solaris. As the PC becomes more powerful, will desktops become servers? Is the middleware market as we've know it dying due to open source (JBoss)? Does IBM just talk the open-source talk? How are vendors creating their open-source strategies?Are applications and services the only remaining battlegrounds? Trends follow the talent, so where is the talent going? Globalization? The Gillmor Gang plays Vendor Sports: Who will win? Who will become the JetBlue of IT services?
        - With special guest Mitchell Kertzman, Partner at Hummer Winblad Venture Partners, the Gillmor Gang tackles these questions as well as DRM, and of course RSS.
