        - ID3 Tags -- Lots of discussion and email about the best way to utilize the MP3 ID3 tags. IÕve recently made some changes for IT Conversations, and IÕve received both positive and negative comments. IÕd like your feedback on my current thoughts.
        - Podcasting Isn?t a Genre -- Some have suggested that podcasted MP3s have the ID3 genre tag set to Podcast. Bad idea. Podcasting is no more a genre than is TV or radio. ItÕs a transmission mechanism: audio files as RSS enclosures. You can do that with music (of all kinds) speech, sound effects, and more. Those are genres. If you want to use a genre to idenfity things like Daily Source Code or Evil Genius Chronicles, you could refer to them as audioblogs, but even then it might be too much of a catch-all. In any case, podcasting is not a genre.
        - The Music Swap -- What have you started, Steve Gillmor? Okay, IÕll go back to the old theme music for The Gillmor Gang. To explain, the original music was by an L.A. band named Tanj. My son is the bass player in addition to his other gigs. I switched to One at a Time by Burnshee Thornside, a Magnatune band because the quality of the Tanj track, Kielbossa, wasnÕt very good. Lots of hiss and noise.
