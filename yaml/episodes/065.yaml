      - Evil Genius Chronicles
        - Audioblog for Nov 7, 2004 -- Here is the Bittorrent link and direct MP3 download for the audioblog for November 7, 2004. It was recorded in the Charlotte airport as I changed planes to go home.
        - Eric Enberg of CBS on Bloggers -- Eric Enberg, a retired CBS correspondent posted a piece critical of bloggers, particularly in the context of politics, on the CBS news website. This might pack more of a punch if it didn't come from the organization that ran a big ol' story based on a poorly forged memo, like, six weeks ago. Until the stink of Rathergate has faded, CBS doesn't get to call out the credibility of political bloggers for getting things wrong. Well, they can try as Enberg does but I'm just going to laugh at them. They should maybe move out of the glass house before picking up the rocks is all I'm saying.
        - Podcasting Vibe -- From Podcasting Avenue:
        - License Achieved -- Great news in EGC audioblog world! As of today, I am legal and have explicit permission to use my theme music and music bed. I've been really worried about this. When I first started and I had 20 listeners, it wasn't a big deal. As we got into 3 and then 4 figures in downloads, I got more and more nervous. I started in August trying to get permission but I never got an answer to any of my emails. Today, with the kind intercession of rock and roll angel Sonia Tetlow who put me in touch with Lee Cuthbert of the Gentle Readers, the deal was sealed. That is a great relief to me!
        - Hanging with Mr. Curry -- Here's the photo of me and Adam Curry from the Saturday night podcasting dinner. I barely got to talk to him during the dinner, but I did spend a little time with him later that night. All things considered with him being a MTV celebrity, highly successful as a business man and all that, he's a really down to earth guy, just hanging out like the rest of us. Note that he literally does see the world through rose colored glasses. If Danielle of Audible.com who snapped the picture was slightly taller and standing slightly to her left, that light fixture would be giving Adam the full beatific halo effect. That would have been suitable for capturing in stained glass.
        - More Light Blogging -- Super busy in life (getting rid of the house helped, but didn't ease the load.) I have an episode of the audioblog that I recorded in the Charlotte airport but haven't been able to edit and assemble and some more photos to post. I'll do all that as I can and then with any luck in a day or three I can record my post-mortem audioblog entry about Bloggercon. Sorry that it is going to take a while.
        - Audioblog for Nov 6, 2004 -- Here is the Bittorrent link and direct MP3 download for the audioblog for November 6, 2004. It was recorded the morning before Bloggercon and is just now getting posted (although it's been on the Bittorrent feed for days though, hint hint). Getting this writeup written was the slow step that I just couldn't get to.
        - More Simple Pleasures -- Bloggercon was fun, but it was fantastic to sleep in my own bed next to my wife, wake up in the morning and help her carry stuff to her car, sit down to work at my desk in my comfortable office with my dog at my feet. Ahhh, my regular life is so nice and I love it so much.
        - El Podcast M °s Corto De La Historia -- At Bloggercon I met a guy named Jaime Batiz-Mendoza who told me that he had heard my appeals for Spanish language podcasting and thought that he'd be the first, only to find out that Communicando beat him. Oh well, sorry about that Jaime, but I'm glad that your podcast is online.
        - Bloggercon Wrap Up -- I'm now sitting at SFO, waiting to emplane. To quote George Carlin, "Why do we deplane? I've never de-bused or de-boated? What's so goddamn special about airplanes that they get to make up a word for getting off them?" Thanks again to Ruth and Dannie for shuttling me around the Bay area. I had figured that I'd catch a cab back, but they were kind enough to drive me back the airport.
        - Bloggercon, Day 1, Part 2 -- We're winding down here. We're in the post-mortem panel. Prior to that was Doc Searls cheerleading the "Making Money" session, which was pretty good. There were a lot of good ideas coming so fast and furious that even though I was hear, I'm going to have to relisten to the IT Conversations recorded version just to remember it all. I'm very happy I got a chance to meet him, as Doc is one of my heroes. I'm looking forward to the dinners tonight and maybe we'll get to hang out later on. This day has been a lot of fun, and kind of wearying. I'm hoping to catch a nap before we move on to the dinners and beyond.
        - Bloggercon, Day 1, Part 1 -- I'm in the initial session, the Podcasting presentation. I got to talk for a few minutes and lay out what I think and a little about my history. Through sheer luck, I ended sitting very close to Tony Kahn. I can never overemphasize how good the people at WGBH have been to me over the course of my career in broadcasting. To this day, I get great emails from them. Tony said something great to me. Once he realized the value of the platform (in 10 seconds, "bing") he wanted WGBH to get out and lead because he thought it was important to prove to the public radio world that this was of value and to lend their credibility to that. I find that really cool. WGBH rocks.
        - Thanks, Stranger -- Here's a big thank you to the anonymous stranger working at the pizza place at Embarcadero and El Camino, for giving us directions on how to get to Mings last night when we were looking for it about 2 miles from where it really was. I felt bad about walking into an empty restaurant and asking the dude how to get to a different restaurant, but he did it with a smile. Thank you, Masked Man.
        - Bloggercon, Day 0 -- The day before the con has now come and gone. After getting picked up at the airport by Dannie and Ruth (thank you!), we went to the dinner at Ming's with a gazillion other people. I met Adam Curry and Doug Kaye for the first times in person, as well as talking to Steve Gillmor, Mike Geoghegan, Wendy Seltzer of the EFF and a bunch of people's whose names I didn't get. It was fun, in a complete noisy chaos sort of way.
        - I'm On A Plane -- I'm in the air, between Charlotte NC and San Francisco, heading out to Bloggercon. I'm looking forward to it for a number of reasons. Hanging with my peeps, geeks of like mind, holds a lot of appeal to me. I want to meet some of the folks whose work - writing and podcasting - I hold in high regard. If I am a lucky man, this will be reciprocated in some small fraction.
        - Nathan Sheppard -- Band of the Day! Man, I haven't done one of these in ages. Today the lucky winner is Nathan Sheppard. He has a page with songs available at Garageband.com. Most are Real Audio (ugh) but you can get the MP3 of "Travelling on". I played his song "Travelling On" in the last EGC audio post, and I've been listening to it over and over. I find it is one of the few things cheering me up in this ugly time. As of this point, I've never bought anything from the iTunes Music Store. I'm considering buying a few of his tracks. If I had found out about him a few yars earlier, I'm sure I could have easily seen him in Atlanta when I lived there. Better Nate than lever, I guess.
        - One Bit of Misery Down -- Our half of the paperwork on the house sale is being overnighted to the closing attorney's office. By the end of the business day tomorrow, we should be one house lighter. That is a huge chunk of stress that will be lifted from of our shoulders. I'd be happier if we weren't taking such a horse-choking hit on it. Oh well, what's a life savings between friends? At least we are only making one mortgage payment now.
        - More From Shetterly -- It's so short, I reproduce another Will Shetterly bit I agree with completely in its entirety.
        - Will Shetterly on the Election -- I barely know author Will Shetterly. I've interviewed him and his wife a few times, and have had a few pleasant chats with him. Thus far, he has the advice for dealing with the election that makes me feel the best and most motivates me to pick back up and carry on.
        - Swapping Directions -- I am strongly considering swapping the roles of Bittorrent and the direct MP3 downloads in my RSS feeds. Currently, the MP3 downloads are the enclosures in my main feed and you need a special feed for the Bittorrent enclosures. I'm thinking about switching that, so that the main feed has the Bittorrent enclosures. If that doesn't work for you, then you'd need to switch over to the special MP3 download feed.
        - Right now, the vast majority of podcatching clients that are downloading the MP3s could in fact be using Bittorrent. They are BT enabled iPodder variants. The only reason most people are subscribed to the main feed is because that is the first one I publicized and the one that ended up in the directories. In fact, if (when) I do this switch I think many many people will just end up getting the files and not even know anything has happened. If 80% of the people downloading the MP3s were using Bittorrent, there would be an incredible overlap and lots of concurrent peers in that period right after I publish. I think it would work very very well.
        - I'm looking for feedback on this. Does anyone have a big problem with this? The worst case is that you have to unsubscribe from one URL and resubscribe to a different one. If I do this, the last thing I podcast before switching will be a short announcement saying what is happening that will be a direct MP3 download. I want to avoid breaking subscribers feeds such that they just stop getting it and never know why. Talk to me, friends. What do you think about this?
        - Comment on Swapping Directions
        - The worst? John Scalzi and his moronic post that "Anyone still paralyzed by liberal depression at midnight, Monday November 8 will be summarily brained with a plank". How about this - why don't you bite me. I missed the election returns where Scalzi won the race for boss of me. Don't tell me that it's OK if my emotions are on your timetable but not otherwise. That's just dickheaded.
        - Update: Read the comments, as Scalzi responds. Note here that what I'm describing in this post is not philosophical but empirical. Shetterly's post lifted my spirits and motivated me to move forward and heal. Scalzi's brought me down and made me think "You, John Scalzi, should go piss up a rope" and to continue seething. This is all about the ROI here, and ways not to motivate. Scalzi might think he's helping, but I found it highly counterproductive.
        - Comment on Will Shetterly on the Election
        - "I won't concede until the last vote has been counted."
        - Comment on More From Shetterly
        - Comment on One Bit of Misery Down
        - Comment on Nathan Sheppard
        - More than that, I want to put this week behind me. The election is one thing, the horribleness that has been trying to sell our house is another. It was supposed to close while I was in the air, and I spent most of the morning sweating a wire transaction that hadn't cleared and looked on track to screw up this deal. As bad as it is, as big as loss as we are incurring, as absolutely fricking galling it is to have to kick in a grotesque amount of cash to sell the house, we need this thing out of our lives. Tell me again how the tax cuts for the uberwealthy are helping me out, as I hemhorage money. Oh, thank god I have four more years of this to look forward to.
        - In the small favors department, I have a block of three seats all to myself so I am kicked back and stretched out here. I took a little nap, laying full out supine, daddyo! Always a bonus when you can get that in the overwhelming bummerness that is air travel in general. I'm listening to podcasts right now, Tracks up the Tree with Funtime Ben. Of course, having no iPod (yet indeed I love the name podcast, smoke that Marc Canter) I had to burn a CD full of goodies and play it on my iRiver. This should help me catch up a little. Thus far it has worked out well, because I started off in the mood for music and listened to a couple of TUTT episodes. Now I'm ready for some more talk.
        - Actually in my playlist, Rock and Roll Geek show was the next up. I think I'll finish this one out and then skip the rest and come back later. The next one up in my playlist is the Linux Link Tech Show, which really is more like what I'm in the mood for now. Having listened to 30 minutes of them, this is exactly what I wanted to hear. I love these knuckleheads! It's kind of like having your friends sit around goofing on each other. Of course, it's downright comical how little they talk about Linux, but I don't care. I've been meaning to email Linc Fessenden and rag on him about how much more sensible he is when he's on Matthew Bischoff's cast.
        - In about 3 hours, I should be meeting Dannie Gregoire and his girlfriend at the SFO airport, who kindly shuttlling me from the airport to the dinner tonight. Lest it be forgotten, Dannie is the brilliant bastard who coined the term podcasting, and with whom I went in on the eTech proposal on podcasting (which still has never been accepted or rejected as far as I know.) It will be nice to finally meet him in person, since I have more or less thrown my lot in with him.
        - Hope to see as many of you dudes and dudettes as I can at Bloggercon. Come talk to me, I want to meet you!
        - Comment on I'm On A Plane
        - Where things fell apart a little was in a bad assumption. We figured that everyone would be getting together at the hotel bar at the Rickey's Hyatt, where many of us are staying. The only hitch there - it closes at 11 PM. I'm willing to go so far as to say that a hotel bar that closes that early is basically useless in its function. Dannie and I went down the street to some college bar and had a drink. It was a private function for a group birthday party but we went in anyway. A cash bar is a cash bar, really. I talked to some of the celebrants, including one of the birthday girls. After a while, I made myself at home enough to eat a piece of cake. That's just how I am. I will wander in to your party and make myself at home unless I am physically restrained from doing so.
        - Festivities tomorrow start early early, like sevenish in the AM. That won't be so horrible for me since I'm still on EST but I predict there will be many bleary eyes and stragglers amongst the Californian night owls.
        - I could tell one thing from the dinner tonight that will probably be a theme up until I get back on the plane for home: too many people I want to talk to and not nearly enough time. That's definitely how it was tonight - there were at least a dozen people in the room I would have liked to talk to but didn't even see there or don''t yet know what they look like. Having all day tomorrow will help, as will nametags.
        - Comment on Bloggercon, Day 0
        - Comment on Thanks, Stranger
        - Comment on Bloggercon, Day 1, Part 1
        - Comment on Bloggercon, Day 1, Part 2
        - Last night was fun and wearying. I talked to a lot more folks at the podcasting dinner at Jing Jing's and ate some really tasty food. It was a deal where we paid a fixed price and dishes just kept coming. We finished with sweet pecan encrusted shrimp, yum! I batted cleanup on that, eating about all that I could find on the table.
        - Between hanging at the hotel bar, the dinner and the post-dinner bar business, I got to talk a little more with Doc Searls and give him an overview of what to do technically to record a podcast. I think perhaps on the plane I wll write up an overview of what I do, bearing in mind it is all based on the work of Hugo Schottman, who deserves 99% of the credit for the research into how one can build this system with combinations of free tools. Man, am I excited about the prospect of listening to Doc's podcast! If I can help reduce the barrier to that happening, I'll do it.
        - I got to talk with Steve Gillmor several times spread out through the affair, Friday and Saturday. It was a month ago that I was freaked out (in a good way) at hearing my name on the Gillmor Gang, and now I get to hang with the man. I quite liked it, but I have to say that a lot of the time I felt like the Karate Kid letting down Mr Miyagi. It seemed like he was trying to lead me to insights that I'm too dense to grasp. Steve Gillmor, welcome to the ongoing frustration that is trying to wise me up!
        - All in all, I met lots of great people. I must have talked to 50 people that said they like the show. That was great, but a little shocking. If you met me and said hi, leave me a little comment on this post. I tried my best to catch and remember everyone's names but all refresher information helps. If we do this again, please please when you meet me, tell me your name. Maybe 40% of people that came up and talked to me didn't volunteer their name and either had no tag or it was turned around. I did a lot of asking folks their names and/or violating of their personal space by reaching in and straightening out nametags so I could read them. It really is important to me to try to figure out who y'all are so I recognize your names if you interact here or I see you again online in a different context. It's all about the connection, so help me make that as symmetric as possible.
        - My one big disappointment was that I didn't get to talk to Lawrence Lessig. I walked past him one time, but he was on his way to be the leader of his law session and I had a mouthful of cookie so I couldn't even say hi. He smiled and said hi and I waved like a dumbass whilst chewing my snack. Sigh. If I could have just had 5 minutes with him, I would have got his opinion on the use of music in podcasts. Not doing that will go down as the one thing I really missed out on from the whole experience. I was in the guy's building, for god's sake. All weekend long, every time I saw someone taking a photo in my direction, I pulled a stealth Lessig pose. It's from the wrong angle, but up top here is Tony Kahn inadvertantly pulling a stealth Lessig. Below is a stealth Lessig of a different sort, from during the wrapup session.
        - I'll be mulling over the results of this weekend for a long time. A good portion of what I got out of it was meeting people that I've been interacting with online. I got a lot out of that, but I heard lots of interesting ideas about the power of blogging in general and podcasting in specific. At the wrapup session, Ed Cone talked about doing a regional Bloggercon in Greensboro NC and afterwards I talked to him about it for a few minutes. That got me thinking that the Conway/Myrtle Beach area is pretty centrally located. There are multiple universities within one or two driving hours - USC in Columbia, UNC-Wilmington just across the North Carolina border, Charleston College to the south, as well as smaller colleges like Francis Marion University in Florence. Not anytime soon, but maybe next spring or summer I might think about trying to do that. Maybe I'll float the idea then and see if I can enlist some help. If no one climbs on board I'll bag the idea, but if I can get a few people interested, like say people in the computer science department at Coastal Carolina, we can push forward.
        - All in all, a great time. I met lots of cool people, heard lots of thought provoking stuff, and I'm glad I went.
        - Comment on Bloggercon Wrap Up
        - Comment on El Podcast M °s Corto De La Historia
        - Comment on More Simple Pleasures
        - I talk about the meet and greet dinner the previous evening; I talk about how I'm planning to tape spontaneous interviews with people (which never happened - I never unpacked it); and wonder if I am becoming a cheap bastard. It's a pretty short episode for me.
