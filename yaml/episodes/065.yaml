        - Steve said people complained to him about the new music at the Web 2.0 conference, and tonight I got email from a listener who agreed. AlrightÉIÕll switch back. My son will be both flattered that you like his music and pissed at me for switching in the first place. What kind of a father am I anyway?
        - ThereÕs also a lot of confusion about the definition of podcasting. Again, I say itÕs no more (or less) than audio files as RSS enclosures. A podcaster is someone who sends audio Ð any audio Ð in this way. So what do we call the receiving end Ð the people who use iPodder, its derivatives, or (heaven forbid) copy the MP3s to their players by hand or listen to them on their computers? Are the listeners of podcasts podcatchers? Okay, I admit thatÕs a bad name that should die an immediate death, but letÕs remember that podcasting is the act of sending, which is quite decoupled from the acts of receiving or listening.
        - Oh, one more thing. ThereÕs been a lot of talk about the history of podcasting. According to the above definition, the first podcast I can recall was when Dave Winer worked with Christopher Lydon to deliver some of ChrisÕ interviews as RSS 2.0 enclosures. I immediately copied the idea. Does that make IT Conversations the second podcast? Does anyone even care who was second? And of course Steve Gillmor was probably the first to consider the iPod platform, and Adam Curry was first to automate the receiving process all the way to the player.
