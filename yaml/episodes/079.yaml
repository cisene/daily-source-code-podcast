    #title "DSC-2004-12-03"
    The first podcast from the Starbucks in Guildford. It's on Market Street, just off the High Street. You're welcome to party along every weekday at 2pm, until I get the cottage connected!
    This episode of the Daily Source Code
    - The Broadband saga continues
    - UKOnline
    - British Telecom
    - ADSL Availability checker
    - NTL Cable
    Songs
    - American Heartbreak - Sick and Tired
    - Rock and Roll Geek Show
    - Lascivious Biddies - The Truck Song
    Lee Wilkins
    - Weblog
    - Alfie and Benson
