  	<p>Music in this episode:<br>
  <a href="http://www.podshow.com/music/?artist_id=5328">Jonny Sonic</a> - Pesos Y Euros<br>
  <a href="http://www.podshow.com/music/?artist_id=7388">Hydrogyn</a> - Blind<br>
