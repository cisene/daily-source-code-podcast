  <div class="storycontent">
           	<p>#511 Daily Source Code for Friday December 8th 2006</p>
  	<p>From Curry Condo, San Francisco, Ca.</p>
  	<p>Although
  short, the week was jammed packed. As usual we blast into the weekend
  with drivin&#146; tunes from the PMN, as sub,itted by the CharlieHeads. I
  also have a mystery song for you to ponder over the weekend. My British
  friends really try to help me figure out the UK Dept. of motor
  vehicles, pretty much to no avail <img src="http://curry.podshow.com/wp-images/smilies/icon_smile.gif" alt=":)" class="wp-smiley"> </p>
  	<p>Relevant Links:<br>
  Buy a domain name from <a href="http://godaddy.com/">GoDaddy</a> and use code DSC3 for a great discount!<br>
