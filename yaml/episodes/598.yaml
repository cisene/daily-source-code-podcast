description: |2-
    <p><strong>#598 Daily Source Code for Thursday May 10th 2007</strong></p><p>From The Curry Manor, Guildford, UK</p><p>Are there 99 words for boobs? You bet, and we've got 'tm on today's charlie. An update on BTPodshow and my day in London. Savant feedback preceeds a plea to help find<a href="http://news.bbc.co.uk/1/hi/england/leicestershire/6626251.stm">Madeleine</a>, featured in today's album art. Also, and uncanny<a href="http://learning2share.blogspot.com/2007/04/venus-by-shocking-blue.html">discovery</a>of plagerism<br><br><strong>Music in this episode: <br><br></strong><a href="http://www.btpodshow.com/video/?persona_id=15150&amp;movie_id=29476771d691bc0889fab941124b3d0e">The Kooks and Pete Townshend</a> - Ooh La<br>Brick House<br>Big3 - The Banjo Song<br><a href="http://www.btpodshow.com/music/?artist_id=8073">Robert Lund</a> - 99 Words For Boobs</p><p>Anji Bees<a href="http://unwind.podshow.com/">Unwind</a> , sponsored by Tylenol PM</p><br><div><strong>Call or VoIp the VoiceMail line anytime:</strong></div><br><div><span class="contentIndent">+1<span class="jajahWraper"><a class="jajahLink" title="Click to call this number with JAJAH..."><span class="jajahInLink">201 625 6357</a>or<span class="jajahWraper"><a class="jajahLink" title="Click to call this number with JAJAH..."><span class="jajahInLink">+44 207 681 3753</a></div><br><br><div><span class="contentIndent"><span class="contentIndent">Dig me: <a href="http://adam.podshow.com/">adam.podshow.com</a></div>
