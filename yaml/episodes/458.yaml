  <div class="storycontent">
           	<p>#458 Daily Source Code for Friday September 8th 2006</p>
  	<p>From Curry Cottage Guildford, UK</p>
  	<p>&nbsp;<br>
  FUBAR Friday in full effect! 3 Great songs for you, definitely check
  out Erik Schwartz&#146; Clinton/Bush tribute along with cowbellbanging
