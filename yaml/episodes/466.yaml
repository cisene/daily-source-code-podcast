description: |-
  <div class="storycontent">
           	<p>#466 Daily Source Code for Friday September 22nd 2006</p>
  	<p>From Curry Cottage, Guildford, UK</p>
  	<p>The Lady Patricia and I wrap up the week in the midst of an almost tropical rainstorm at the cottage.<br>
  Pat really dominates the show (what else is new) with advice for a
  distraught listener and &#145;how to react when your 16 year old daughter
  wants to sleep over at her 21 year old boyfriend&#146;s house&#146;. Arggh!! It&#146;s
  FUBAR Friday on the Charlie everrrrybodddyyy..<br>
  &nbsp;<br>
  Relevant Links:<br>
  Acura <a href="http://acura.podshow.com/">TargetCast</a><br>
  Earthlink <a href="http://adchallenge.podshow.com/">AdChallenge</a><br>
  <a href="http://pfp.podshow.com/">Perversion For Profit</a><br>
  &nbsp;<br>
  &nbsp;<br>
  Music in this episode:<br>
  <a href="http://music.podshow.com/music/listeners/artistdetails.php?BandHash=9f8cfa18bb9d253d46ef9217a7dac963">Pepper</a> - No Control<br>
  Wylde Bunch - Stomp the Bleachers (<a href="http://www.surfdog.com/">Surf Dog</a>) via <a href="http://jerseytodd.podshow.com/">Jersey Todd</a><br>
  <a href="http://music.podshow.com/music/listeners/artistdetails.php?BandHash=d6ee3cce65ee35e66e62cd023c967852">Anonymous American</a> - Don&#146;t be Late For The Rest of Your Life<br>
  &nbsp;<br>
  Call the Voice Mail and leave a message any time: +1 201 625 6357 or +44 207 681 3753</p>
  	<p>Dig me: <a href="http://adam.podshow.com/">adam.podshow.com</a></p>
