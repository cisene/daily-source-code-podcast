            <p>#466 Daily Source Code for Friday September 22nd 2006</p>
   <p>From Curry Cottage, Guildford, UK</p>
   <p>The Lady Patricia and I wrap up the week in the midst of an almost tropical rainstorm at the cottage.<br>
  Pat really dominates the show (what else is new) with advice for a
  distraught listener and &#145;how to react when your 16 year old daughter
  wants to sleep over at her 21 year old boyfriend&#146;s house&#146;. Arggh!! It&#146;s
  FUBAR Friday on the Charlie everrrrybodddyyy..<br>
  &nbsp;<br>
