    Kids complaining about parents
    - Hi, I'm a 17 year old teen from Australia and just wanted to pipe in that not all parents are horrible! Since I'm a fourth child (catholics...) my parents have pretty much accepted I'm going to grow up and that I want my privacy. That respect helps make a good relationship between my parents. Just thought I would tell you that not all parents and teens have hate each other!
    PodSafe: Griddle - Preoccupied [Site ]
    - San Francisco's GRIDDLE just released its second album, Turning Violet, with a southwestern tour that took the boys across Texas. Members Kimo Ball, Xifer Fortier, Chris McGrew, and Kevin Seal enjoy volume, alcohol, melodies and confusion. Their songs are strange but catchy. More at Griddle.
