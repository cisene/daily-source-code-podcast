    Bar Stool Today!
    - Tom Hickey
    Is mijn podcast ervaring uniek?
    - Dag Adam, Ik download al sinds januari je podcast en vind je gebabbel leuk om naar te luisteren, vooral als er Nederlands gesproken wordt. Ik vraag mij af of er nog mensen zijn die hetzelfde ervaren als ze naar podcasts luisteren, spreek er eens over tijdens je podcast: I listen a lot to podcasts when I walk to the office and when I work out: running, riding my mountainbike and race-bike, bouldering, ... I've noticed that locations can trigger my memory about a particular podcast. It happened again today: I rode my mountainbike along a route I take frequently (west of Brussels) and at a certain road crossing I remembered a discussion about a new tablet PC on the Tablet PC Show I had listened to the previous time I rode past that location. It's a kind of reverse soundseeing: things I see trigger sounds I heard. Have you experienced this or have people mentioned this to you? Thanks for the show, en wanneer komt er nog een PPP? Didier Stevens, Brussel
    PSA: Katrina wichita
    Promo: Gaming Edge Weekly
    DS and GBA explained
    - Michael Shotter Hello, I'm sure plenty of other nerds will jump on this, but I figured I'd join the chorus. The DS is the "Nintendo DS," Nintendo's latest handheld gaming device. The letters DS refer to the system's Dual Screens, which allow unique display and input options for games. The GBA is the GameBoy Advance, which was Nintendo's previous handheld system, still in wide use by gamers and backward compatible with original GameBoy games. For more information on current gaming platforms and operating systems, check out our State of the Game article on Gaming's Edge. www.gamingsedge.com—viewcontent.cfm ? content=21&content_type=Article&department=1 And yes, I'm going to bug you again about playing the promo for our "Gaming's Edge Weekly Roundup" podcast. Here's a direct link to the promo: www.gamingsedge.com—gewrpromo.mp3 and our podcasting info page: www.gamingsedge.com—info.html Hope this is useful. Michael Shotter (a.k.a. VorTech)
    Katrina relief auctions going on right now
    - Dear Mr. Curry, (I know you're not THAT old) :) I was listening to your podcast this morning when you spoke of Hurricane Katrina and asking for us to let you know of any ways that people can help the victims of this devastation. My new podcast Boutique Café is almost ready to launch and we'll be doing a show late this week about hurricane Katrina and how people can help and get involved. Our Boutique Selling community is vast and a big hearted group. Many of our fellow designers that we know have lost their homes and all their possessions. Fellow designers have joined together to give from our hearts. Please go to eBay and search "Boutique Angels", these talented designers are donating 100% of the proceeds through the verifiable eBay charity association of Mission Fish to MERCY CORPS - Hurricane Katrina fund. These sellers are giving of their talents, time, and materials to making some beautiful boutique items so please ask your listeners to check the auctions out and bid on some gorgeous one of a kind items to support Mercy Corps and those that need so much right now. Sincerely, Daria Muirhead Boutique Café www.boutiquecafe.com
    Biodiesel - Crap in your Tank
    - I love your biodiesel idea about being able to crap in your tank. I think we need to talk to Roto-rooter about some joint development of this technology. I mean, if they're pumping the stuff out of my septic tank already, why can't they pump it back into my gas tank. Of course, if the cooking oil biodiesel smells like french fries... _____________________________ Bill Lefler
