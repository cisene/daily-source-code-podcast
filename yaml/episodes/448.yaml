  <div class="storycontent">
           	<p>#448 Daily Source Code for Thursday August 24th 2006<br></p><p>
  From Curry Cottage Guildford, UK</p>
  	<p>I&#146;m
  back flying solo, without the dear lady, but with the broken Airspeed
  Indicator. Amy Mac hits me with another edition oif the Accersize
  workout.<br>
  Audio of the F-16 intercept of Northwest flight 42, more feedback on
  the naked pix of Karmyn Tyler and another blasted riddle to solve! I
  can&#146;t wait for FUBAR Friday&#133;.<br>
  &nbsp;<br>
  Relevant Links:<br>
  Nothing to click today!</p>
