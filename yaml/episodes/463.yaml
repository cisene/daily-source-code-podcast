            <p>#463 Daily Source Code for Tuesday September 19th 2006</p>
   <p>From Curry Cottage, Guildford, UK</p>
   <p>Laptops <a href="http://techfreep.com/virgin-atlantic-bans-dell-apple-laptops.htm">banned</a> on Virgin, Willie Nelson <a href="http://news.yahoo.com/s/ap/20060918/ap_en_mu/people_willie_nelson">busted</a>,
  ACBT for all your telco needs and ofcourse a happy PodSafe tune to kick
  off the show from The Jellybricks. Your voice mails about death and
  spirituality, mixed with some profanity as always <img src="http://curry.podshow.com/wp-images/smilies/icon_smile.gif" alt=":)" class="wp-smiley"><br>
  &nbsp;<br>
  Relevant Links:<br>
  Acura <a href="http://acura.podshow.com/">TargetCast</a><br>
  Earthlink <a href="http://adchallenge.podshow.com/">AdChallenge</a><br>
  <a href="http://pfp.podshow.com/">Perversion For Profit</a><br>
  &nbsp;<br>
  &nbsp;<br>
  Music in this episode:<br>
  <a href="http://music.podshow.com/music/listeners/artistdetails.php?BandHash=139a8ba84343de05f8e857c4fbdbe671">The Jellybricks</a> - Only Smile<br>
  <a href="http://music.podshow.com/music/listeners/artistdetails.php?BandHash=2673377414907b3d6d7de87470c872ad">Munk</a> - I Am (accoustic)<br>
  &nbsp;<br>
  Call the Voice Mail and leave a message any time: +1 201 625 6357 or +44 207 681 3753</p>
   <p>Dig me: <a href="http://adam.podshow.com/">adam.podshow.com</a></p>
