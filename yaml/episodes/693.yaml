    <p><span class="contentIndent"><strong>#693 Daily Source Code for Wednesday November 28th 2007</strong></p><p><span class="contentIndent">From The Curry Condo, San Francisco, Ca. USA</p><p><span class="contentIndent">Missing a day always makes the catch-up shows filled with diversity. This hump day edition of the Charlie is no exception: theFerf/Twitter, Choir Idol, TiVoCast to kick off the first half of the show, followed by some mobile chatter about the iPhone, <a href="http://www.amazon.com/gp/product/B000QAUDQU?ie=UTF8&amp;tag=adamcurrysweb-20&amp;linkCode=as2&amp;camp=1789&amp;creative=9325&amp;creativeASIN=B000QAUDQU">E61i</a>, <a href="http://www.amazon.com/gp/product/B000RL5C0U?ie=UTF8&amp;tag=adamcurrysweb-20&amp;linkCode=as2&amp;camp=1789&amp;creative=9325&amp;creativeASIN=B000RL5C0U">N95</a>and of course the<a href="http://www.amazon.com/gp/product/B000Y4AH3C?ie=UTF8&amp;tag=adamcurrysweb-20&amp;linkCode=as2&amp;camp=1789&amp;creative=9325&amp;creativeASIN=B000Y4AH3C">N810</a>internet tablet. The gadgets don't stop there, with feedback on the new<a href="http://www.sony.com/headphones/">Sony headphones</a>I'm pimpin'. <br><br>To finish of this veritable cornucopia we delve into European politics with CSB and hear a plea for the republic, our republic.</p><p><span class="contentIndent"><span class="contentIndent"><strong>Music In This Episode: <br><br></strong><a href="http://www.djmoule.com/">DJ Moule</a> - Deep Message<br><a href="http://www.btpodshow.com/music/?artist_id=11538">Tom Keiffer</a> - Blue Christmas<br><a href="http://www.amazon.com/gp/product/B0000025HO?ie=UTF8&amp;tag=adamcurrysweb-20&amp;linkCode=as2&amp;camp=1789&amp;creative=9325&amp;creativeASIN=B0000025HO">ELO</a> - Telephone Line<br><br>For lowest prices on domain names, check out the<a href="http://curry.podshow.com/?page_id=845">DSC GoDaddy coupons</a>you can use for the best discount anywhere.. </p><p><span class="contentIndent">The new<a href="http://curry.podshow.com/?page_id=846">Nokia N810</a>is for sale here.</p><p><span class="contentIndent"><span class="contentIndent"><strong><br>Call Anytime:</strong></p><br><br><div class="episode-desc" title="Click to edit"><br><p><span class="skype_tb_innerText">+1 201 625 6357or<span class="skype_tb_innerText">+44 207 681 3753</p></div><br><br><p><a href="mailto:adam@podshow.com">adam@podshow.com</a></p>
