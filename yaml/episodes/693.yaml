    #693 Daily Source Code for Wednesday November 28th 2007

    From The Curry Condo, San Francisco, Ca. USA

    Missing a day always makes the catch-up shows filled with diversity. This hump day edition of the Charlie is no exception: theFerf/Twitter, Choir Idol, TiVoCast to kick off the first half of the show, followed by some mobile chatter about the iPhone, E61i, N95and of course theN810internet tablet. The gadgets don't stop there, with feedback on the newSony headphonesI'm pimpin'.

    To finish of this veritable cornucopia we delve into European politics with CSB and hear a plea for the republic, our republic.

