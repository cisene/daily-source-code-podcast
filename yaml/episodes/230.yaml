  Daily Source Code for Monday August 29th 2005 #230<br>From Curry Cottage, Guildford, United Kingdom<br><a href="http://mp3.dailysourcecode.podshow.com/DSC-230-2005-08-29/DSC-230-2005-08-29.mp3">Direct Link</a> to the show<br><a href="http://mp3.dailysourcecode.podshow.com/DSC-230-2005-08-29/DSC-230-2005-08-29.opml">ShowNotes in OPML</a><br>Mashup: Aggro1's Got MJ and JJ Under Pressure<br><a href="http://mashuptown.com/">Site</a><br>BA inflight food baggie :-D<br><a href="mailto:ggarside@gmail.com">Geoff Garside ggarside@gmail.com</a> to adam More options Aug 28 (1 day ago) Hi Adam, I just listened to your August 24th podcast and thought I would share with your my experience of my British Airways flight from Moscow. Due to the strike of Gate Gourmet there was to be no food on the flight. However while the plane was being refueled and so on the stewards and stewardesses had gone out and purchased some food for the passengers. Each passenger was then given a bag of food and so on as they boarded the plane. In the bag was an apple, banana, can of pepsi, sandwich, mars bar. Personally I thought this was the best selection of food I had ever had on any flight anywhere, it was also much nicer to be able to eat as and when I felt like it rather than in the slice of time when they have put the food in front of me. Happy birthday for you and your daughter, Geoff<br>PW's growing up a geek in a society that worships jocks Digital Flotsam<br><a href="http://digitalflotsam.org/">Site</a><br>Promo: 1010 uses for babywipes<br><a href="http://101usesforbabywipes.com/">Site</a><br>Promo: Fairy Tale Corner<br><a href="http://www.chestnutbay.com/ftc">Site</a><br>GPS Accuracy<br>DSC #229 GPS<br><a href="http://www.ngs.noaa.gov/FGCS/info/sans_SA/">Pilot Mike to adam More options Aug 27 (2 days ago) Adam, Thanks! We'll work on a Pilotcast promo for you. I'm listening to DSC #229. You should know the Selective Availabilty dithering for the GPS signal has been gone since its removal was ordered by President Clinton in 2000. SA hasn't even been restored in war time. We suspect that the government has more tricks so SA isn't needed. www.ngs.noaa.gov—sans_SA</a> <a href="http://europa.eu.int/comm/dgs/energy_transport/galileo/index_en.htm">We know that the govmint retains the right to restore SA and kill GPS in its entirety in case of emergency. There was a rumor, from supposed knowledgeable CFIs, that VORs and other navaids were turned off on 9/11 but when I brought it up online we found out that wasn't true. There is a competing GPS system called GALILEO being setup by the by EU specifically so they have a system where the USA doesn't have the OFF switch. europa.eu.int—index_en.htm</a> <a href="http://www.pilotcast.com/">The other GPS system is WAAS (Wide Area Augmentation System) and local WAAS where ground-based GPS transmitters and repeaters are being installed to get the kind of precision needed for precision approaches. AOPA President Phil Boyer demonstrated using a new WAAS approach at Frederick, MD, comparing it to ILS and it was amazing. You'll hear from us on the demo shortly! Thanks again. --"Pilot Mike" The Pilotcast www.pilotcast.com</a><br>GPS selective availability<br><a href="mailto:greg@thoughtagency.com">Greg Grusby greg@thoughtagency.com</a> <a href="http://tinyurl.com/cgd3u">to adam More options Aug 26 (3 days ago) Adam, After listening to Friday's show I thought this site on GPS might interest you: tinyurl.com—cgd3u</a> The news goes back to 2000 but it speaks to your point on the removal of selective availability built into the GPS system. Then again, when our government gives us something it usually means they have something much, much, more advanced that they've created in a lab that 'doesn't exist.' No worries, even if somebody managed to find out about it, the government would neither confirm nor deny its existence. And, by the way I have purchased original-back catalog tracks after hearing remixes/mash-ups on Daily Source Code. I'd rather buy my music on ITMS then anyplace else. Keep up the fantastic work. Staying subscribed, -Greg<br>Selective Availability<br><a href="mailto:rjolivier@mac.com">rjolivier@mac.com</a> <a href="http://en.wikipedia.org/wiki/Selective_availability">to adam More options Aug 26 (3 days ago) Robert in Los Angeles [1] sent this email to you through the Radio UserLand [2] community server, re this page [3]. Adam, I work with GPS on cell phones all day and I can tell you that your listener that said commercial GPS is less accurate that military GPS due to induced errors is BS. It was called Selective Availability and it was turned off in May, 2000. A commercial GPS with a good stable clock and a good antenna design is accurate to better than 5 meters. Military GPS is better becasue the GPS satellites actually transmit data on two frequencies, only one of which is available to commecial GPS receivers. Military units listen on both frequencies. The reason for this is that the a large source of error is caused by ionospheric interferences in the atmosphere. The ionosphere causes slight delay in the signal reaching earth but this delay is inversely proportional to the frequency of the signal. Hence, by using two frequencies, a military receiver can detect the ionospheric delay difference between the two frequencies and cancel it leading to mugh higher accuracy. Additionally, bombs are moving entities. The last source of GPS error is called multipath reflection where the GPS signal bounces off of objects and causes the receiver to see duplicates of the signal delayed by various amounts of time. This happens mostly in urban environments where the signal bounces off of tall buildings. A moving GPS receiver is able to see the difference in the multipath characteristics as it is moving through the terrain and create a model that cancels out most of them where a stationary unit cannot. Since a bomb is definitely moving, it is able to cancel the multipath out with great accuracy. These two factors are soley responsible for why a smart bomb is so accurate, not induced errors. Check the wikipedia ... en.wikipedia.org—Selective_availability</a> Peace out. robert<br>"PODCAST FOR HURRICANE VICTIMS"<br><a href="mailto:wichitarutherford@mac.com">wichitarutherford@mac.com</a> to WichitaRutherf. More options 12:54 am (12 hours ago) Hi everybody. Wichita Rutherford here. Why don't we do this as the podcasting community. Let's all do 2 to 3 minute podcasts that will inspire people to give to the Red Cross or food banks or whatever organization they choose to help these folks who are gonna be without food, water, shelter, clothing, medicine and Lord knows what all else. This thing could get ugly quick. So if we went ahead and prepared, we'd be ready to do what we do best to help them. We have a big infrastructure now with millions of listeners, let's put ourselves and our podcasts to the side for a minute and put links to these organizations (whichever ones you choose) as the main focus and links on our sites. I mean on the front page too. There are lots of us now and I think we've got enough ears listening that might help make a difference to these people. Let's keep it simple and call it "PODCASTING FOR HURRICANE VICTIMS". Let's not have a site to go to or anything for it, let's just put that phrase on our sites, and send listeners on to where they can help. In a nutshell it would look like this: I'M PODCASTING FOR HURRICANE VICTIMS. Please help by donating your time/money/assistance to one of the following organizations: LINK - LINK - LINK Even a little will help a lot. Thank you so much _______. Then do a short 1 to 2 minute podcast asking folks to help the same way. No joking around, no bad language. Just as serious as you can get with your delivery. Thank them, then sign off. Or send a copy of it to me if you want and I'll put it on the "PODCAST FOR HURRICANE VICTIMS" Podcast. Or do both. The first one goes up tonight. (Sunday) Let's do this as the podcasting community. Let's show how powerful this medium actually is. This goes for the directories too. PodcastAlley.com PodcastDirectory.com PodcastPickle.com ALL of you in charge of podcast directories. Pass this on to your podcast host connections, send it to everyone you know who does a podcast. Professional or beginner. iTunes and Disney as well as your cousin in Toledo who's only done 2 shows. Don't even email me back, just get started forwarding this message. Let's get ready to help these people. They're gonna need it. Let's PODCAST FOR HURRICANE VICTIMS. Podcasting for hurricane victims, your pal, Wichita 5MinutesWithWichita.com<br>Teenagers<br><a href="mailto:caroline@jedimaster.smith.edu">Caroline caroline@jedimaster.smith.edu</a> to adam More options Aug 27 (2 days ago) Ahoy Adam. In the DSC today you mentioned that you hadn't gotten any feedback from teenagers... So here you go. I'm about the same age as Christina (turning 15 in a couple months) and, speaking as a teenage girl (and oldest child), I can tell you that fathers are no picnic either. Your relationship with her actually reminds me a lot of mine with my dad and, although I love him dearly, he's a hassle. My parents haven't experienced a child grow up before, and it seems to be harder for them to let go of me than for me to renounce them. Go figure. Also worth mentioning, I think, is that (in my case) much of the insolence and rebellion is calculated. We teenagers are smarter than you think. After 15 years of living under the rule of parents, we have learned how to manipulate, placate, and annoy you in ways that I don't think you understand. Or maybe my parents are just easy. Whatever the reason, I think that us capable, intelligent teenage girls are vastly underrated. I don't really know what Christina is like, but I would bet that she has things much more under control than you believe. Thanks for your great podcast, if not for your love of teenagers. =) - Caroline<br>What do we expect??<br>Vogue, MTV etc<br>Zen TV Experiment<br><a href="http://daghlian.net/scrapbook/zentv.html">Site</a><br>Promo: Mini Paul Podcast<br><a href="http://www.minipaul.co.uk/">Site</a><br>Promo: Wed Vid Talk<br><a href="http://www.wedvidtalk.com/">Site</a><br>Senseo<br><a href="mailto:bren83@bigpond.net.au">Bren Barnes bren83@bigpond.net.au</a> to adam More options Aug 27 (2 days ago) Oh and one more thing Adam just letting you know I'm now a Senseo connisseur too! From listening to your show I discovered this product and so last weekend I took my cash down to a local department store and got one. And here in Australia the pods work out at about 33 cents each so it's cheaper in the long run than getting takeway coffees from a cafe. The dark roast pack is quickly becomming my favourite. It would be good to know what roast is your preference, and also if there is a Senseo/coffee podcast out there somewhere.<br>Bar stool recommendation + your new equipment broke my ipod!<br><a href="mailto:GraemeShaw@bigfoot.com">Graeme Shaw GraemeShaw@bigfoot.com</a> <a href="http://www.johnlewis.com/Home+and+Garden/Dining+Room/Barware/Stools/">to adam More options Aug 28 (1 day ago) Adam, Loving the DSC, keep up the good work. Thought I'd recommend a bar stool to you, my Dad has a Bombo Bar stool. They look very stylish, you can adjust the height, and they're incredibly comfortable. John Lewis seem to be one of the cheapest places to buy them, their page is here: www.johnlewis.com—Stools</a> 230176394/Product.aspx On a slightly different note, I was sitting having my lunch time coffee in a coffee shop, listening to the DSC at the beginning of the week when you first mentioned your new audio equipment. Literally as you said "it's a Monday, so shit's going to break" the audio went dead. I just thought it was you pissing about, but when I looked down, I noticed my ipod had turned itself off. I pressed the play button and it turned back on, pressed it again, and it resumed playing the DSC! So your new equipment temporarily killed my ipod! I'm sure you'll pleased to know that it's been fine since. As I said, keep up the good work! Cheers, Graeme<br>IRAQ<br><a href="mailto:subrolex@sssnet.com">Brian Shirey subrolex@sssnet.com</a> to adam More options Aug 27 (2 days ago) Mr. Curry: Love the DSC! I got turned on to Ipod when stationed in Iraq. Just heard the August 16th show. Your views about the Iraqi people are right on target. I was stationed at ABU GHRAIB, (after the scandal broke, thank you) and most of the Deatinee (prisoner) population weren't Iraqi. Mostly they were Syrian. After all how can a group of insergents gallavant across the country unfunded? The Iraqi people are SO poor that they couldn't fund this type of terrorism. My thought is that the Syrian government is afraid. They are think first Iraq, then us. Syrian culture is economically, politicalily and religiously mirror that of Iraq. Just my two cents, that's all. Love the Daily Source Code, I remember you from back in the days when MTV actually played music videos! Brian<br>Promo: The Obtuse Angle<br><a href="http://stevedupont.com/">Site</a><br>PodSafe: Scott Turchin - Always Love<br><a href="http://www.songmon.com/">Site</a><br>The PodSafe Music Network<br><a href="http://podsafemusicnetwork.com/">podsafemusicnetwork.com</a><br>Bio Diesel<br>NO BIODIESEL, PLEASE<br><a href="mailto:juergen.schlund@vr-web.de">Jürgen Schlund juergen.schlund@vr-web.de</a> to adam More options Aug 28 (16 hours ago) Hi Adam, in your last DSC you mentioned to buy a Diesel and use Biodiesel. DONt DO THAT, allthough its cheaper than "normal" Diesel Why ? Ok, I try to explain. Biodiesel is a synthetic product, made out of Rapeseed and Methanol. Allthough the molecular structure is very similar to Diesel, it may damage your engine. Diesel fuel made out of oil has a lot of lubrication capabilities for the special Injection and Pump parts of a diesel engine. The use of Biodiesel does not garantee the lubrication of these parts. In addition, Biodiesel is very, very aggressive to the small fuel pipelines and rupper parts in your engine, which have contact with the fuel. This is the reason why BMW Diesel cars need a special Biodiesel kit when using Biodiesel fuel. Volkswagen does not approve their current Diesels for Biodiesel, the old ones are approved. There is a huge german Diesel-Community on the Internet, where these topics are discussed very contrary, but most of the people agree to my opinion, that it is not worth saving 10 or 15 ct for a liter of biodiesel when you need to spend 1.500 Euro for the repairing of your Diesel injection system. Hope that helps Keep on rocking with DSC!! Greetings from Bavaria, Germany Juergen ... driving a Volkswagen TDI with 195.000 km, first engine, first injection pump and NO Biodiesel ;-)<br>Forget biodiesel - check out bioHEAT!<br><a href="mailto:cspenn@gmail.com">Christopher S. Penn cspenn@gmail.com</a> <a href="http://www.boston.com/yourlife/home/articles/2005/03/24/bioheat_gaining_steam_as_home_heating_option/">to adam More options Aug 26 (3 days ago) Bioheat - the use of biodiesel fuel for home heating... eliminating another avenue of fossil fuels... www.boston.com—bioheat_gaining_steam_as_home_heating_option</a> Rock on! -- Christopher S. Penn<br>Buying from iTunes after Mashups and HitTests<br>Bought after mashup<br><a href="mailto:paulstringer@mac.com">Paul Stringer paulstringer@mac.com</a> <a href="http://www.kisky.co.uk/">to adam More options 8:10 am (4 hours ago) It happens! Duran Duran - Notorious, purchased literally about 10 seconds after hearing the Mashup.. Paul, www.kisky.co.uk</a><br>Purchase after hit test<br><a href="mailto:mkatz@heartsurgeryva.com">Marc Katz mkatz@heartsurgeryva.com</a> to adam More options 3:22 am (9 hours ago) Adam, In answer to your question, I frequently purchase songs on iTunes after having heard them on DSC and the Hit Test. It is great to hear that music and the memories it rekindles. Congratulations on the success you are having with Podcasting. I have been listening since the beginning of the year and am hooked. I rarely ever turn on the radio anymore. I am a heart surgeon in Richmond, Virginia, and am likely older than your average listener. If I can be of assistance from the stand point of medical information (I also work in transplantation and surgical robotics) in your continued progress promoting podcasting please feel free to contact me. Keep up the great work, Marc -- Marc R. Katz MD Chief of Cardiac Surgery Henrico Doctors’ Hospital Virginia Transplant Center<br>EWF Fantasy bought!<br><a href="mailto:antonio@amrosario.com">Antonio M. Rosario antonio@amrosario.com</a> to adam More options 12:39 am (12 hours ago) Adam, I thought I'd let you know that after listening to the Hit Test on your last podcast, I, too , went to the iTunes Music store and bought EW<a href="http://www.amrosario.com/">&amp;F's song Fantasy. While I was there I picked up 4 more of their songs that I was surprised I did not have in my collection yet. So, hell yeah, the Hit Test sells songs! Antonio Portfolio - www.amrosario.com</a> Blog - amrpix.blogspot.com "Time flies like an arrow. Fruit Flies like a banana." Groucho Marx<br>Music purchased from mashups<br><a href="mailto:sheaffer@sac.sticare.com">David Sheaffer sheaffer@sac.sticare.com</a> <a href="http://homepage.mac.com/chubcreek/iblog/chubcreek/B189300973/index.html">to adam More options Aug 28 (19 hours ago) Adam, I've purchased four songs from itunes after hearing them in mashups. You're right, it's a great way to promote back catalog. ie: I hadn't thought about 'Rock Steady' by Aretha Franklin for years, heard a snippet in a mashup, went to itunes, downlaoded it, dragged it to my ipod, done. BTW, if you haven't already, you have to listen to this episode of Chub Creek. They do a great sendup of the source code and it and the skit surrounding it are the funniest stuff I've heard in a podcast. I actually had to turn off my ipod to breathe. It's at the beginning and it's only about 5 minutes. homepage.mac.com—index.html</a> episode 'chub creek not' from August 5th. Thanks for all the great work promoting this method of getting content that isn't available anywhere else. I really haven't listened to commercial radio for about 6 months now and, when I have to, I hate it even more than I used to. Leo Laporte was on our local NPR station here in Sacramento last week discussing podcasting and he made a great point. When you're home in the evening you have lots of audio/video equipment competing for your time but podcasts can be enjoyed while you're doing things like gardening, riding your bike, running, putting away the dishes, etc. I've done all of those activities while listening and that's so true. Thanks again, Dave Sheaffer<br>Purchasing music heard on DSC / People Downloading via Dialup<br><a href="mailto:kevin@kevdo.com">Kevin Crossman kevin@kevdo.com</a> <a href="http://www.the-frat-pack.com/">to adam More options Aug 27 (2 days ago) Yep. Purchased two Rob Costlow tracks and Stevie Wonder's Superstition ("Bootystition"). I also download lots of mashup and podsafe tracks you play. You know... the kind of stuff you can't purchase even if you wanted to. Would happily happily happily purchase mashups if I could! Have heard from a relatively high percentage of my listeners and they are downloading via a dialup connection! It takes them an hour to download my show, which is incredible since we've got a really "narrow interest" show and we're not exactly the most produced. But it does show how motivated folks can be about the topics they love. -Kevin Kevin Crossman, The Frat Pack Tribute Stiller, Vaughn, Ferrell, Wilson, Wilson www.the-frat-pack.com</a> <a href="http://www.fratpackpodcast.com/">Listen to our Podcast, www.fratpackpodcast.com</a> <a href="http://www.the-frat-pack.com/podcast/promo/FPT-Promo-1min-Aug2005.mp3">www.the-frat-pack.com—FPT-Promo-1min-Aug2005.mp3</a><br>buying music after hearing it<br><a href="mailto:brett@breesestreet.org">Brett Rann brett@breesestreet.org</a> <a href="http://mp3.jet2web.net/data/">to adam More options Aug 27 (2 days ago) I certainly go looking for it after I hear it on your show! Unfortunately I'm in australia and we don't have much option for buying music online -- i think there' s a couple but it's windows media player drm stuff and we're a 100% mac house. I'd much rather pay $1-$2 than spend half an hour digging through the scum of p2p and cleverly crafted google searches to find a song. I'm currently looking for earth wind and fire fantasy... love that song! Found "groove tonight" here mp3.jet2web.net—data</a> <a href="http://www.allofmp3.com/">online_classics/dance_classics1/, which is ok, but I'd much rather fantasy. This is after about 15 minutes of searching. Who knows how much longer before I can find Fantasy. Half an hour of my time is worth much more than $1-2 freaking dollars. C'est la vie! At least Apple is on the case. A few friends use www.allofmp3.com</a> which I think is some russian site that offers music downloads for unbelievably low prices, and apparently don't really pass on any royalties. I'd rather get it for free than give them some $ ! It's insane that the only way I can get my music easily is to either order a CD online and wait a few days for delivery, or make a trip to the city and cross my fingers that they have the album I'm after. Keep that podsafe stuff coming through! Brett -- software developer in melbourne, australia.<br>hit test drives track sales<br><a href="mailto:frankherfs@gmail.com">frank herfs frankherfs@gmail.com</a> <a href="http://www.fherfs.blogspot.com/">to adam More options Aug 26 (3 days ago) Hello Adam, referring to the Hit Test drive track sales question, yes I have bought a lot of music from itunes after listening the daily source code. The main reason that I did it after a hit test and not years before is simple. I didn´t know the name of the band or the song. Jan plays a lot of great songs of the 70th. The time when I grow up. I have always liked this music but was too young to keep in mind the artists when they were at the crest of their fame. 30 years later I hear these great songs again. But today there is a big difference: you and jan can tell everyone from whom the music is which is fantastic. With this knowledge itunes helps me to find what i am looking for and usually it takes only a few minutes until the song is mine. Thank god for podcasting. Frank -- www.fherfs.blogspot.com</a><br>Hit Test 52<br><a href="http://www.janpolet.com/">Site</a>
