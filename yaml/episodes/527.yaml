description: |-
  <div class="storycontent"><p>#527 Daily Source Code for Tuesday January 16th 2007</p><p>A full-blown Chrlie for y&#146;all today, from the Curry Compound on the West Side of G-Town.<br>Lots
  of new additions to the PodShow Network, all promo-ed appropriately of
  course. Some banter about a great drama I watched last night; &#147;<a href="http://www.channel4.com/more4/drama/t/trial_tony/index.html"><u>The Trial Of Tony Blair</u>&#147;, </a>and live performances from Rachel Fuller and the Gang.</p><p>Relevant Links:</p><p><a href="http://intheattic.btpodshow.com/">In The Attic</a> with Rachel Fuller and Pete Townsend<br><a href="http://podfinderuk.btpodshow.com/">PodFinderUK</a> with <a href="http://josephinelaurence.btpodshow.com/">Josephine Laurence</a><br>Castblaster Video <a href="http://www.castblaster.com/forums/showthread.php?t=637?">Beta</a><br>Stomp The Yard <a href="http://www.msnbc.msn.com/id/16583100/site/newsweek/">Controversy</a></p><p>Music in this episode:<br><a href="http://www.btpodshow.com/music/?artist_id=4484">Former Fat Boys</a> - MakeOut Party<br><a href="http://rachelfuller.btpodshow.com/">Rachel Fuller</a> - Fly</p><p>Buy a domain name from <a href="http://godaddy.com/">GoDaddy</a> and use code DSC3 for a great discount!<br><a href="http://destinationflavor.com/">Splenda</a>&nbsp;-<span class="jajahWraper"><a class="jajahLink" title="Click to call this number with JAJAH..." jajahtargetnumber=" +1-206-600-4415" href="javascript:void(0)"><span class="jajahInLink"> +1-206-600-4415</span></a></span>, what&#146;s your flava?<br><a href="http://stompthepodcast.com/">StompThePodcast</a><br>Maire Claire <a href="http://themasthead.btpodshow.com/">Mastehead</a></p><p>Call the VoiceMail line anytime:<br><span>+1</span><span class="jajahWraper"><a class="jajahLink" title="Click to call this number with JAJAH..." jajahtargetnumber=" 201 625 6357" href="javascript:void(0)"><span class="jajahInLink"> 201 625 6357</span></a></span> or<span class="jajahWraper"><a class="jajahLink" title="Click to call this number with JAJAH..." jajahtargetnumber=" +44 207 681 3753" href="javascript:void(0)"><span class="jajahInLink"> +44 207 681 3753</span></a></span><br><span></span>&nbsp;<br><span></span><span>Dig me: <a href="http://adam.podshow.com/">adam.podshow.com</a></span><br>&nbsp;<br>Direct <a href="http://m-uk.podshow.com/media/21/episodes/45903/dailysourcecode-45903-01-16-2007.mp3">Link</a> To The Show</p><p><a href="http://www.btpodshow.com/shows/?mode=detail&amp;episode_id=45903">Comment</a></p></div>\nDuration: 00:39:06
