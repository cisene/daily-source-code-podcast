           	<p>#479 Daily Source Code for Monday October 16th 2006</p>
  	<p>From Manhattan, New York</p>
  	<p>We&#146;re
  on a two day trip to NY to meet with advertisers and their agencies. Of
  course I&#146;m still sick as a dog, and the mobile equipment combined with
