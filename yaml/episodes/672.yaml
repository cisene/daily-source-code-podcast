    <p><span class="contentIndent"><strong>#672 Daily Source Code for Monday October 15th 2007</strong></p><p><span class="contentIndent">From The Curry Manor, Guildford, UK.</p><p><span class="contentIndent">The Fire Apes kick off this new week, putting everyone in a groovy mood, for there is lots to discuss! <br>A response from the Presidential candidate<a href="http://ronpaul2008.com">Ron Paul</a>, with many views on US society from the listener base, including NYLON and Parky. Controversy is bound to ensue.....</p><p><span class="contentIndent"><strong>Links to check:</strong></p><p><span class="contentIndent"><a href="http://theplustv.com">thePLUSTV</a><br><a href="http://en.wikipedia.org/wiki/Aaron_Russo">Aaron Russo</a></p><p><span class="contentIndent"><strong>Music in this episode:</strong></p><p><span class="contentIndent"><a href="http://www.btpodshow.com/music/?artist_id=6153">The Fire Apes</a> - Let Me Know<br><a href="http://www.djmif.com/music.htm">DJ Icky</a> - Short Dick Cheney</p><span class="contentIndent"><br><br><br>Call Anytime:<br>+1 201 625 6357 or +44 207 681 3753<br><br>Dig me: adam@podshow.com<br>
