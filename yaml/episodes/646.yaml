    <p><strong>#646 Daily Source Code for Monday August 6th 2007</strong></p><p>From The Curry Manor, Guildford, UK.</p><p>Good morning from Guildford, home of the new<a href="http://news.bbc.co.uk/2/hi/uk_news/northern_ireland/6930707.stm">outbreak</a>of Hoof and Mouth disease! We're so proud. <br>A recap of an airborne weekend, some of it with 82 year olds and power tools. A chock full charlie today, with savant feedback, heartwrenching stories and naked pictures, or at least the promise of them. Other topics discussed: PodSafe Cafe Nero, Elton John, Channels with Cheddar and some excellent promo-age.<a href="http://youtube.com/watch?v=BBwepkVurCI"><br></a><br>Brand New: The Season Finale of<a href="http://portcitypd.podshow.com/">Port City PD</a><br><br>Visit The PodShow<a href="http://suckless.podshow.com/">Suckless Zone</a></p><p><br><strong>Music in this episode: <br></strong><br><a href="http://www.mashuptown.com/2007/07/post.html">DJ TopCat</a> - Young Folks Rehab<br><a href="http://www.btpodshow.com/music/?artist_id=3457">Melanie Lewis</a> - Revelation<br><a href="http://www.btpodshow.com/music/?artist_id=4495">Will Deynes</a> - Super Wonderful<br></p><p>Call the VoiceMail Line anytime to help the revolution. <br>Tell us your story of Mainstream Mockery and Deception: <br></p><p>+1 201 625 6357 or +44 207 681 3753<br></p><p>Dig me: <a href="mailto:adam@podshow.com">adam@podshow.com</a></p>
