  typing blind
  	squip
  		From: 	  squipper@nyc.rr.com
  		Subject: 	Learning to type without looking
  		Date: 	February 2, 2005 5:02:59 PM GMT+00:00
  		To: 	  Adam Curry <adam@curry.com>

  		Adam,

  		It will be easy for you to break the habit of looking at the keys while you type!

  		Just get yourself a poster-size keyboard layout that you can hang on a wall in
  		front of your laptop or desktop.  Force yourself to look up at the poster and
  		NOT at the keyboard.  You'll get the hang of it in no time!

  		http://www.speedskin.com/html/posters.asp
  Jeff Nemcher - Cooking on the Radio
  	Sound seeing tours with iPod Photo
  		Question for Adam about iPhoto
  satt bandwidth
  	email
  		From: 	  Rob Frieden <rmf5@psu.edu>
  		Subject: 	Satellite Capacity Measurement
  		Date: 	February 2, 2005 6:27:06 PM GMT+00:00
  		To: 	  Adam Curry <adam@curry.com>

  		Hello Adam:

  		I very much enjoy The Daily Source Code and have an answer to your question about how satellite bandwidth is measured.  The unit of capacity for satellites is the transponder, and these units are measured in MegaHertz, usually 36-72 MHz.  Of course you can make a conversion from bandwidth to throughput which in a digital environment is measured in bits per second.

  		I am a Telecoms Professor at Penn State University and teach this stuff; you might have an interest in a tech course syllabus on my web page at: http://www.personal.psu.edu/faculty/r/m/rmf5/Comm484spring05.htm

  		Best wishes, Rob Frieden

  		Pioneers Chair and Professor of Telecommunications
  		Penn State University
  		102 Carnegie Building, University Park, PA  16802
  		office: (814) 863-7996; fax (814) 863-8161
  		home: (814) 867-2545
  		Web page:	http://www.personal.psu.edu/faculty/r/m/rmf5/
  		Faculty profile: http://www.psu.edu/dept/comm/faculty/frieden.html

  adamcurryJaime
