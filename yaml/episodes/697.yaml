    <p><span class="contentIndent"><strong>#697 Daily Source Code for Thursday December 6th 2007</strong></p><p><span class="contentIndent">A festive episode of holiday cheers turns into a eureka moment! It all comes together in this Charlie. We have a solution for the perfect protest that will put the government back into our hands of control. We can stop the<a href="http://www.answers.com/topic/menticide-1">menticide</a>. We must all immediately<a href="http://shopwrong.com/">shop wrong</a>! <br>Confused? You won't be after this episode of The Daily Source Code.</p><p><span class="contentIndent"><a href="http://storyofstuff.com/">The Story Of Stuff</a></p><p><span class="contentIndent"><strong>Music In This Episode:</strong></p><p><span class="contentIndent"><a href="http://www.btpodshow.com/music/?artist_id=124">American Heartbreak</a> - The Greatest Xmas Song Ever<br><a href="http://www.btpodshow.com/music/?artist_id=4897">Valerian</a>- Children Of The Menticide<br><a href="http://www.adamsandler.com/">Adam Sandler</a> - The Chanuka Song Part II<span class="contentIndent"><br><span class="contentIndent"><br>For lowest prices on domain names, check out the<a href="http://curry.podshow.com/?page_id=845">DSC GoDaddy coupons</a>you can use for the best discount anywhere.</p><p><span class="contentIndent">Enter the<a href="www.audiostreet.net/contestentries.aspx">Hard Rock Hotel San Diego</a>Battle Of The Bands. Perform live with Black Eyed Peas.</p><p><span class="contentIndent">The new<a href="http://curry.podshow.com/?page_id=846">Nokia N810</a>is for sale here.</p><p><span class="contentIndent"><span class="contentIndent"><strong><br>Call Anytime:</strong></p><br><br><div class="episode-desc" title="Click to edit"><br><p><span class="skype_tb_innerText">+1 201 625 6357or<span class="skype_tb_innerText">+44 207 681 3753</p></div><br><br><p><a href="mailto:adam@podshow.com">adam@podshow.com</a></p>
