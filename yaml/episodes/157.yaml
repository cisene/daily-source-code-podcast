description: |-
  Another beta-cast of the CastBlaster Software. This show still has some<br>bugs in it, but much better than yesterday. I need to do a better job<br>of watching my levels when not using the 'auto' feature, so the sound<br>is a bit 'hot' now and then. But again, it's beta :) My father in law jumped into the mix by building me a mini sound-dimmer<br>so I can use my normal microphone on the input of the tablet. Pictures<br>here. Today also featured a skype call with Christina to demonstrate that integration. Overall I'm really jazzed! Over the weekend I'm sure I'll be doing more testing. mp3
