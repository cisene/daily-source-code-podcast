  <div class="storycontent">
           	<p>#552 Daily Source Code for Monday February 26th 2007</p>
  	<p>From The Curry Condo, San Francisco, Ca.</p>
  	<p>Back
  from Hollywood for another jam packed week at PodShow HQ. Proud to be a
  member of the Academy and not ashamed to say it. My WiFi woes have been
  resolved and some of the tips I received and things&nbsp;we learned are
  worth mentioning should you ever encounter similar problems. They&#146;re
  switched on down under to the whole Folder/Scruncher thing. I knew it
  would work in <a href="http://youtube.com/watch?v=8gW3p5CA9eg">advertising</a>. It certainly works well in <a href="http://www.youtube.com/watch?v=QTsXlTKaFq0">Lego</a>. A shot across my bow from an eco-terrorist and a brand new segment: A Track From Adam&#146;s 1st Gen. iPod.</p>
