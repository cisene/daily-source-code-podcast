  Maire Claire <a href="http://themasthead.btpodshow.com/">Mastehead</a></p>
  	<p>Music in this episode:</p>
  	<p><a href="http://www.podshow.com/music/?artist_id=7846">Lemonheads</a> - No Backbone<br>
  <a href="http://www.podshow.com/music/?artist_id=4420">The Marauders</a> - Kill Pop Radio</p>
