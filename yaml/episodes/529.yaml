  <div class="storycontent">
           	<p>#529 Daily Source Code for Monday January 22nd 2007</p>
  	<p>From The Curry Condo, San Francisco, CA. USA</p>
  	<p>I&#146;m
  so happy to be connected (there&#146;s some story there as discussed in the
  show) that I decided to record the Charlie early, Sunday evening early <img src="http://curry.podshow.com/wp-images/smilies/icon_wink.gif" alt=";)" class="wp-smiley"> </p>
  	<p>Full blown tin-foil hat moment regarding the packets to the premises, as well as an update on Trinity and <a href="http://twit.tv/TWIT">Twit</a>.</p>
