    Podcast Courtesy
    - email
      - From: Joseph DeRose
      - Subject: Podcast community ~ Where's the magic?
      - Date: January 1, 2005 2:47:01 AM GMT+00:00
      - To: Adam Curry
      - Hi Adam,
      - Thank you for your great podcast. I particularly liked when you asked whose
      - God was responsible for the tsunami disaster. Spot on! That's the type of
      - question that you'll not hear elsewhere, and just simply, an excellent
      - question. I think we have parallel thoughts in this regard.
      - I wonder if you would remind the podcast community to be couteous to it's
      - supporters? I've tried to email the podcasters I enjoy to show my support.
      - No one, except for Nicole Simon (Useful Sounds) and the iPodlounge guy,
      - bothered to at least say "thanks". Podcasting has to compete for my time
      - since I enjoy both XM and Sirius stallite radio, medium wave bandscanning,
      - ham and shortwave radio. I was attracted to podcasting because it felt like
      - a community with some level of camaraderie (and because of you - in the
      - early years MTV was about all I watched)). But now it feels disinterested,
      - and I'm about to check out.
      - Good luck to you in the future with your endeavor.
      - Joe
      - Bel Air, Maryland.
      - --
