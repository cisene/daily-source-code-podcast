           	<p>#549 Daily Source Code for Tuesday February 20th 2007</p>
  	<p>From The Curry Manor, Guildford, UK</p>
  	<p>One
  more show from the Manor this week, tomorrow it&#146;s off to SF and the
  Curry Condo where I shift my schedule to evening shows. Despite low
