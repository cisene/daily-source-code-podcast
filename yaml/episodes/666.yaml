   <p>#666 Daily Source Code for Tuesday September 25th 2007</p>

   <p>From The Curry Manor, Guildford, UK..</p>

   <p>The
  mark of the beast is a human number, yes it&acirc;&#128;&#153;s episode 666 of the Daily
  Source Code. Today&acirc;&#128;&#153;s episode catches us up on the Red Pill - Blue Pill
  conversation, an update from PodShow Germany and the loving feedback
  from fellow cha-cha heads. London today, Chicago tomorrow, california
  by the weekend, lord I&acirc;&#128;&#153;m a travellin&acirc;&#128;&#153; man!</p>

