description: |2-
    <p><span class="contentIndent"><strong>#703 Daily Source Code for Friday December 21st 2007</strong></p><p><span class="contentIndent">My head hurts from finishing John Perkin's excellent book<a href="http://www.amazon.com/gp/product/B0009JKV7E?ie=UTF8&amp;tag=adamcurrysweb-20&amp;link_code=as3&amp;camp=211189&amp;creative=373489&amp;creativeASIN=B0009JKV7E">Confessions</a>of an economic hitman' and so will yours after you read it, or listen to the audio book. How come Oprah never had this guy on her book club? The rest of this Fubar show is filled with some funny feedback (can you say'TSA didn't find my rockets'?) and some 'festive' music to get you into the Christmas vibe. <br><br>Steven Brill is<a href="http://www.slate.com/id/2133060/">behind</a>the '<a href="http://verifiedidpass.com/vip.html">Clear</a>' program<br>TSA Job<a href="https://tsa.taleo.net/servlets/CareerSection?art_ip_action=MultipleBrowserConflict&amp;art_servlet_language=en&amp;csNo=10160">requirements</a><br>Jan Polet's<a href="http://hittest.podshow.com/">HitTest</a><br><a href="http://www.btpodshow.com/music/?artist_id=2090">Commonsplice</a> - Everyday Choices<br><span class="contentIndent"><br>For lowest prices on domain names, check out the<a href="http://curry.podshow.com/?page_id=845">DSC GoDaddy coupons</a>you can use for the best discount anywhere.</p><p><span class="contentIndent">The new<a href="http://curry.podshow.com/?page_id=846">Nokia N810</a>is for sale here.commonsplice-everyday_choices<br></p><p><span class="contentIndent"><strong>Music in this episode</strong>:</p><p><span class="contentIndent"><a href="http://www.ultravox.org.uk/">Ultravox</a> - Dancing With Tears In My eyes<br><a href="http://www.btpodshow.com/music/?artist_id=3118">Sophia Ramos</a> - Let Me Tell You Something<br><a href="http://www.btpodshow.com/music/?artist_id=1144">Jimmie Bratcher</a>- It's Christmas<br><a href="http://www.mashuptown.com/2007/12/the-latest-nige.html">DJ BC</a> - You Shook Me All Noel</p><p><span class="contentIndent"><span class="contentIndent"><strong><br>Call Anytime:</strong></p><br><br><div class="episode-desc" title="Click to edit"><br><p><span class="skype_tb_innerText">+1 201 625 6357or<span class="skype_tb_innerText">+44 207 681 3753</p></div><br><br><p><a href="mailto:adam@podshow.com">adam@podshow.com</a></p>
