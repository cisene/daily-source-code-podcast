description: |-
  <div class="storycontent">

  	<p><strong>#669 Daily Source Code for Friday October 4th 2007</strong></p>

  	<p>From The Curry Manor, Guildford, UK.</p>

  	<p>There
  is no way I was going to let the week slip by without a proper Fubar
  Friday, which is maximum mashup today thanks to the release of the
  Bootie 2006 Collection.</p>
  	<p>Jan&#146;s HitTest, a final glance back at
  the PME, with contribution from Anji Bee, amazing success at this
  year&#146;s Digital Music Awards and for my secret message to the TSA, just
  check today&#146;s album art <img src="http://curry.podshow.com/wp-images/smilies/icon_smile.gif" alt=":)" class="wp-smiley"> <br>Oh yes, we&#146;re all Fubar&#146;d, bring on the weekend</p>
  	<p><a href="http://www.tmbg.com/">They Might Be Giants</a> - Take Out The Trash<br><a href="http://bootieusa.com/bestofbootie2006/">The Kleptones</a> - Careless Or Dead<br><a href="http://www.btpodshow.com/music/?artist_id=228">Bittersweet</a> - Dirty Laundry<br><a href="http://bootieusa.com/bestofbootie2006/">Pilchard</a> - Fox Problems</p>

  	<p>Check out <a href="http://theplustv.com/">thePLUStv.com</a></p>
