description: |2-
    <p><span class="contentIndent"><strong>#700 Daily Source Code for Friday December 14th 2007</strong></p><p><span class="contentIndent">As promised, a full on FUBAR show today in celebration of episode 700 of this program. Included is another milestone, episode 100 of Jan's HitTest. Of course we look back at the NY trip, talk some more about the Automatic Targeting System illegally deployed by the Department of Homeland Security and come up with yet another campaign tactic to send a message to the government in 'We The Consumers...' a letter we still need to write :)</p><p><span class="contentIndent"><strong>A couple links to check: <br></strong><br>ACLU's<a href="http://www.aclu.org/privacy/gen/27642prs20061207.html">take</a>on the ATS<br>The Ron Paul<a href="http://teaparty07.com/">Blimp<br>Teaparty07</a><br>I endorse<a href="http://ronpaul2008.com/">Ron Pa</a>ul for President<br><span class="contentIndent"><strong><br>Music In This Episode:</strong></p><p><span class="contentIndent"><a href="http://djlobsterdust.com/">DJ Lobsterdust</a> - Stand Up Like A Hurricane<br><a href="http://www.btpodshow.com/music/?artist_id=6629">Alice Smith</a> - Woodstock<br><span class="contentIndent"><br>For lowest prices on domain names, check out the<a href="http://curry.podshow.com/?page_id=845">DSC GoDaddy coupons</a>you can use for the best discount anywhere.</p><p><span class="contentIndent">The new<a href="http://curry.podshow.com/?page_id=846">Nokia N810</a>is for sale here.</p><p><span class="contentIndent"><span class="contentIndent"><strong><br>Call Anytime:</strong></p><br><br><div class="episode-desc" title="Click to edit"><br><p><span class="skype_tb_innerText">+1 201 625 6357or<span class="skype_tb_innerText">+44 207 681 3753</p></div><br><br><p><a href="mailto:adam@podshow.com">adam@podshow.com</a></p>
