        - Show options 7:31pm (21?2 hours ago)
        - Adam,
        - Thanks for playing my promo on your Sunday podcast.
        - On your Thursday triva, someone entered song lyrics that had been translated into
        - another language and then back.
        - I wanted to give you a background on where that idea originated. It was talked
        - about in one of Philip K. Dick's novels from the 1960's - "Do Androids Dream of
        - Mechanical Sheep" That book was later turned into the the Movie Bladerunner -
        - Although all reference to this game was dropped in the movie.
        - You are probably aware of other movies based on Philip K. Dick's works.
        - Total Recal
        - Screamers
        - Minority Report
        - Imposter
        - Paycheck
        - Just wanted to make sure one of the most underappreciated Sci-Fi Writers gets his
        - due.
        - Best Regards,
