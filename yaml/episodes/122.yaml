    Commenting on: Daily Source Code for February 8th 2005

    - I think the license says .0185 is the multiplier, which means 1.85%. It's still money, but not as scary. It's still subject to the minimum $288. MUCH SCARIER is the idea that this license says it's experimental. So, when they decide not to renew podcaster's license after the first period, they've acquired a lis t of names of people to watch and go after if they don't accede to later demands. Be careful before you go down that road... - Saying you think MJ was framed is one thing, but giving one reason you think that is because he's a "musical prophet" is pretty weak. So is saying you met the guy. (I'm sure a lot of people will say they've met the kids in the case, and the kids wouldn't lie, either.) If the evidence is weak or nonexistent, great, pound on that. But saying, essentially, 'he could never do that, because I like the guy' is just not a good reason. Plenty of "pillars of the community" have murdered, raped, etc., in the past, you know.
  Jenny & Lee <a href="http://thejennyandleeshow.com/?p=10">post</a>
