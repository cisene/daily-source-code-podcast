description: |-
  We watched the BBC's Culture Show live here on BBC2 during our thanksgiving feast at the cottage. I was really pleased with the outcome, clearly they understand what we're doing and did a wonderful job on the piece. Kudo's to Colin, Zina and the rest of the crew who worked so hard on this, amidst many technical issues they had and tight deadlines. No video yet, but I'm sure I'll be able to point to that by tomorrow.
   The best part was watching what Podcast listeners had to say. Really cool to see and hear the people on the 'other end' of the podcast, listening in during their commute.
