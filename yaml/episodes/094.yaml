      - From: Joan Nicolai
      - Subject: Philips Senseo coffee
      - Date: December 28, 2004 6:59:29 PM GMT+00:00
      - To: Adam Curry
      - Hi Adam,
      - It's a small world.
      - At christmas, my parents came over for dinner. I talk a lot with my dad about geeky and tech stuff . We talked about my internetbusiness (www.ribox.nl) and also about podcasting. He like's the idea and the last few days he totally dived into this shit. Great because he's 60 :-)
      - Anyways, today, tuesday that is, you mentioned you're using one of those Philips Senseo machines. Well my dad happens to be the developer of the electronics and processing unit of the Senseo. Great isn't it?
      - He retired a few weeks ago and as a present het received a highly tweaked Senseo (tweaked bij some colleagues), completely made of Aluminium.
      - His colleagues constructed a display on top which counts the number of processed cups since his retirement, also it measures the temperature and some other stuff. Nice isn't it?
      - Bye,
      - Joan Nicolai.
