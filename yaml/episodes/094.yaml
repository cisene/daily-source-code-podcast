    - You have to change it back to whatever the defaults were on LameBrain. This podcast sounded horrible with compression artifacts evident all over the place. I'm sure you know that with the same bitrate at a higher sampling rate you are now having to encode far more information than what LAME can accomplish by automatically applying it's defaults to the source material it's given. LAME has become the best over the years because it's defaults have been tweaked to death to provide the best sound for any material it's been given and the preset handed to it. And when you start getting into lower bitrates such as 64k and lower, you have to start cutting either channels or sampling rate in order to keep it sounding decent. So I would say either the 24 setting or find a way to force 22.050 or the warbles are sure to drive a bunch of us mad.
