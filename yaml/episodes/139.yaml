    Mark Fonseca Rendeiro
    to Adam
      More options 11:07am (16 minutes ago)
    Hey Adam... I wanted to point you to me latest show, as I did
    something different with soundseeing. It's actually quite a simple
    and maybe not-worth-noting concept, but instead of doing soundseeing
    and showing pictures AS I walk around, this last show I actually sit
    home and flip through my flickr photos together with the listeners.
    (trying to describe details for the listeners not at a computer to
    experience it) I found it to be a really good way to incorporate
    images and a pseudo-soundseeing. Plus I just remember to share more
    details as opposed to when Im actually there podcasting.

    http://libsyn.com/media/bicyclemark/bmpodcast16-020305.MP3

    see ya round....

    bicyclemark
