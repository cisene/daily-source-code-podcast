  <div class="storycontent">
            <p>#522 Daily Source Code for Sunday January 7th 2007</p>
   <p>It&#146;s
  Sunday afternoon at the cottage and whilst clearing out my closets and
  drawers, I cracked open my old PowerBook G$, which contained a
  semi-finished interview with 3 partners of venture capital firm Kleiner
  Perkins: John Doerr, Ray Lane and Bill Joy. The reason for the
  interview was the firm&#146;s annoncement of a $100 million fund for &#145;Green&#146;
  technologies.</p>
   <p>If you want to learn more about venture capital
  funding and the people behind it, then this is a must listen. If you&#146;re
  calling about Giselle, this probably isn&#146;t for you <img src="http://curry.podshow.com/wp-images/smilies/icon_smile.gif" alt=":)" class="wp-smiley"> </p>
   <p>I explain it all in the show&#146;s intro.</p>
