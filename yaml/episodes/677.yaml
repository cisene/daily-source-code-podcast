    <p><span class="contentIndent"><strong>#677 Daily Source Code for Wednesday October 24th 2007</strong></p><p><span class="contentIndent">From The Curry Manor, Guildford, UK.</p><p><span class="contentIndent">Today a full half hour interview with Republican Presidential Candidate Dr. <a href="http://ronpaul2008.com/">Ron Paul</a>. <br>We discuss almost every topic that has been a part of the recent week's conversation on this program. <br>Includeding: The 2nd amendment, Roe v. Wade, Global Warming, Net Neutrality. <br></p><p><span class="contentIndent">Homework for the RP interview: <a href="http://video.google.com/videosearch?q=Constitution+Class">Constitution Class</a></p><p><span class="contentIndent"><strong>Links to check:</strong></p><p><span class="contentIndent"><a href="http://theplustv.com">thePLUSTV</a><br><a href="http://pussythemusical.podshow.com/">Pussy The Musical</a><br><a href="http://en.wikipedia.org/wiki/Aaron_Russo">Aaron Russo</a></p><p><span class="contentIndent"><strong>Music in this episode:</strong></p><p><span class="contentIndent"><a href="http://btpodshow.com/music/?artist_id=6286">Lee Alexander</a> - Soul Of America<br><a href="http://www.btpodshow.com/music/?artist_id=2503">Tadago Pie</a> - Dumbing Of America</p><span class="contentIndent"><br><br><br>Call Anytime:<br>+1 201 625 6357 or +44 207 681 3753<br><br>Dig me: adam@podshow.com<br>
