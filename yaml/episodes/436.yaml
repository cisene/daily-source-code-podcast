description: |-
  <span class="contentIndent"><div title="Click to edit" id="episode-desc"><p>#436 Daily Source Code for Monday August 7th 2006</p><br><p>From Curry Cottage in Guildford, UK</p><br><p>We
  kick the week off with a chock-full 'o Charlie! There was so much
  feedback coming in that I just roll 'em out one after another. I'm
  learning heaps about you listener and am lovin' it!<br>Ofcourse we announce the winner of the Troy needs an iPod contest alog with another installment of the Yanks versus the Brits.</p><br><p>Relevant links for this episode:<br><a href="http://shadowfalls.podshow.com/">Shadow Falls</a><br><a href="http://podsavethequeen.podshow.com/">Reuters Picture<br>Pod Save The Queen</a></p><br><p>Music played in the show:<br><a href="http://music.podshow.com/music/listeners/artistdetails.php?BandHash=c95d995fd4f40459f34cf050e6b1c137">Beth Thornley</a> - Mr. Lovely<br><a href="http://music.podshow.com/music/listeners/artistdetails.php?BandHash=a76d54e71aa628bab8c8176235807245">Sophia Ramos</a> - Love me tonite<br><a href="http://music.podshow.com/music/listeners/artistdetails.php?BandHash=abe2aec12a922d27316ad92f04a84c80">Lee Rocker</a> - Rockin' Harder</p><p>Leave a voice mail anytime: +1201-625-6357 or +4420-7681-3753</p>Direct <a href="http://m.podshow.com/media/21/episodes/19771/deltasierracharl-19771-08-07-2006.mp3">Link</a> To The Show<br><p>Dig me at <a href="http://adam.podshow.com/">adam.podshow.com</a></p></div></span>\nDuration: 00:49:47
