   email
    Gabe Kangas
    <gabek@real-ity.com> to me
     Show options 4:16am (5 hours ago)
    Hey Adam,

    Wanted to send you a quick audio comment/show promo to tell you about a
    couple new things i'm doing over at my show "The r33tcast". Due to your
    discussion of show notes in the past, I setup a system that I feel works
    really well. As each person subscribes to the show they enter their
    email address. This email address gets saved and they in return get a
    custom RSS feed to subscribe to. Then, as each show is downloaded they
    receive, in thier email, the show notes for that show after it's been
    downloaded. If they chose to unsubscribe, or skip certain shows, they
    receive no show notes. I really feel a system like this is what would
    add a lot to the integration of text and audio.

    Also, for novelty sake, I thought you might like the other "first"
    that's going on over at the r33tcast, virtual co-hosts that speak via
    chat throughout the whole thing. It's very cool. I'm still working out
    the bugs, but it's definitely a first. One real voice, many "not so real".

    Hope all is well, stay r33t!

    Gabe Kangas
