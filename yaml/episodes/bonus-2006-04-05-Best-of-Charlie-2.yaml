            <p>Best of Charlie #2</p>
   <p>Yesterday
  I was lying on the beach, toes pointed towards the sea, chuckling out
  loud at the BOC1. Patricia asked if I was laughing at myself. No, it
  was all the listener feedback, bits and songs that I was so tickled by.
  Charlie Heads truly are an amazing bunch!</p>
