description: |-
  <span class="contentIndent"><div title="Click to edit" id="episode-desc"><p>#437 Daily Source Code for Tuesday August 8th 2006</p>From Curry Cottage in Guildford, UK<br><p>Find out why Patricia is not on the show today and help me get her on the SHOW!<br>A
  quick scan of my inbox renders some cool sites to look at and lots of
  discussion around contests currently running on DSC for which you can
  win valuable prizes! (mock radio voice intended here).<br>We're down to the wire on our EarthLink <a href="http://adchallenge.podshow.com/">Ad Challenge</a> and play one of the finalists entries as well as welcome a new sponsor of great content to the Network, Acura, who have a '<a href="http://acura.podshow.com/">TargetCast'</a> that audiophiles and car enthousiasts will want to hear.<br>Of course the usual great voice mail feedback and comments, the folders appear to be leading the pack....</p>Relevant links from this episode:<br><p><a href="http://www.isoma.net/games/goggles.html">Goggles</a><br><a href="http://www.chinadaily.com.cn/entertainment/2006-08/04/content_657121.htm">Brad Pitt Podcasts</a><br><a href="http://testdrive.podshow.com/">Test Drive Girl</a><br><a href="http://www.waterproofmusic.com/swimp3.html">Swimp3</a><br><a href="http://podcamp.org/">Pod Camp</a></p>Music played in this episode:<br><p><a href="http://music.podshow.com/music/listeners/artistdetails.php?BandHash=22af758539a3ebd58f30e17048bd8ac9">Jack in the Pulpit</a> - Extraordinary Girl<br><a href="http://music.podshow.com/music/listeners/artistdetails.php?BandHash=6d2e6d5fa53f967519b617ffb79beafd">Kevin Reeves</a> - Throw me a line<br><a href="http://music.podshow.com/music/listeners/artistdetails.php?BandHash=8f061ef70bed3a0e5dd84147a13d7a0c">NewLeaf</a> - Magic Carpet</p>Leave a voice mail anytime: +1201-625-6357 or +4420-7681-3753<br><p>Dig me at <a href="http://adam.podshow.com/">adam.podshow.com</a></p></div></span>Direct <a href="http://m.podshow.com/media/21/episodes/19979/deltasierracharl-19979-08-08-2006.mp3">Link</a> to the show<br>
