  <div class="storycontent">
           	<p>#539 Daily Source Code for Monday February 5th 2007</p>
  	<p>From The Curry Manor, Guildford, UK</p>
  	<p>After
  a perfect weekend (discussed in some detail) the week ahead looks to be
  just as groovy. Free Trinity is rolling along nicely and causing plenty
  of pre-production time consumption, but I love it!</p>
  	<p>In a Yanks
  vs The Brits, we talk about the letter H, Charles the drunk londoner is
  back and in true form. Comments coming in from Equador, Korea and
  Alaska. Bad and WorldWide Baby!</p>
  	<p>As I retire the &#145;worn out tubes&#146; thread, the Posh People are Potty Pigs feedback continues to stream in.</p>
  	<p>Speakin&#146; of streamin&#146;, here&#146;s <a href="http://www.metro.co.uk/news/article.html?in_article_id=35685&amp;in_page_id=34">the link</a> for that new hair product we talked about <img src="http://curry.podshow.com/wp-images/smilies/icon_wink.gif" alt=";)" class="wp-smiley"> </p>
  	<p>Links to visit:<br>
  <a href="http://www.btpodshow.com/music/?artist_id=1288">Munk</a> - Superheroes<br>
  <a href="http://www.btpodshow.com/music/?artist_id=8273">Laura Lambert</a> - Am I Wrong For Loving You</p>
  	<p><a href="http://groups.google.com/group/FreeTrinity">Free Trinity</a> Google Group</p>
  	<p>Buy a domain name from <a href="http://godaddy.com/">GoDaddy</a> and use code DSC3 for a great discount!<br>
  <a href="http://destinationflavor.com/">Splenda</a> -<span class="jajahWraper"><a class="jajahLink" title="Click to call this number with JAJAH..." jajahtargetnumber="" href="javascript:void(0)"><span class="jajahInLink"></span></a></span>, what&#146;s your flava?</p>
  	<p>Call the VoiceMail line anytime:<br>
  <span>+1</span><span class="jajahWraper"><a class="jajahLink" title="Click to call this number with JAJAH..." jajahtargetnumber="" href="javascript:void(0)"><span class="jajahInLink"></span></a></span> or<span class="jajahWraper"><a class="jajahLink" title="Click to call this number with JAJAH..." jajahtargetnumber="" href="javascript:void(0)"><span class="jajahInLink"></span></a></span><br>
  <span></span> <br>
  <span></span><span>Dig me: <a href="http://adam.podshow.com/">adam.podshow.com</a></span><br>
   <br>
