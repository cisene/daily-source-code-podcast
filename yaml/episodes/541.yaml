description: |-
  <div class="storycontent">
           	<p>#540 Daily Source Code for Tuesday February 6th 2007</p>
  	<p>From The Curry Manor, Guildford, UK</p>
  	<p>Today marks the future of <a href="http://www.apple.com/hotnews/thoughtsonmusic/">Steve Jobs&#146; legacy</a>.
  Apple will become THE record company, music will be set free of DRM.
  And it will all start with The Beatles. I&#146;m so confident of this
  strategy that I kick off the show with Help! by the <a href="http://www.beatles.com/">Fab Four</a>.</p>
  	<p>We
  learn more about Koreans and Ozzies in our continuing quest to discover
  if Posh People are Potty Pigs, and Trinity gets offers from The high
  north and far East.</p>
  	<p>Links to visit:<br>
  <a href="http://freetrinity.com/">Free Trinity</a> <a href="http://groups.google.com/group/freetrinity">Google Group<br>
  </a></p>
  	<p>Music in this episode:<br>
  <a href="http://www.beatles.com/">The Beatles</a> - Help!<br>
  <a href="http://www.ronsunshine.com/">Ron Sunshine</a> - Cofee and Reefer</p>
