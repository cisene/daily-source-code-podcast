description: |2-
    <p><strong>#722 Daily Source Code for Tuesday February 12th 2008</strong></p><p>A lot of news coming out of the snoop dogg nation today, as the UK announces a<a href="http://www.techcrunch.com/2008/02/12/uk-proposes-three-strikes-and-your-out-illegal-downloading-law/">three strikes you're out</a>law and we can't talk about that without also discussing the lack of right to protest (thanks Tony!) and the nothern rock crisis. A possible fix for sporadic flash problems on the N8xx series of Internet Tablets and some kick ass tunes tick all the boxes on this episode of the show. </p><p>Music in the show today from:</p><p><a href="http://www.btpodshow.com/music/?artist_id=37">Radio Orphans</a> - World Wide Web</p><p>Here’s the DSC Demographics<a href="http://tinyurl.com/356kct">survey link</a></p><p>For lowest prices on domain names, check out the<a href="http://curry.podshow.com/?page_id=845">DSC GoDaddy coupons</a>you can use for the best discount anywhere.</p><p>Now available exclusively through PodShow, a 15% discount on the<a href="http://curry.podshow.com/?page_id=846">Nokia N810 Internet Tablet</a>. Check out my promo codes and coupon page for USA and UK links.</p><p>Call Anytime:</p><p>+1 201 625 6357 or +44 207 681 3753</p><p>adam@podshow.com</p>
