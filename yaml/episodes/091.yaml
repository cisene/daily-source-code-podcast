    Paul Eastman's band
    - email
      - From: Paul Eastman
      - Subject: Breaking that damn monoculture!
      - Date: December 23, 2004 2:57:03 PM GMT+00:00
      - To: Adam Curry
      - Hey Adam,
      - Writing to you from the blustery shores of Brighton, just down the road from
      - Curry Cottage. No snow here yet!
      - I was incredibly interested in what you were saying about breaking down the
      - ?monoculture? of restricted music distribution, and the politics of getting
      - your music on a radio stations play list.
      - If I were to dabble in the art of neologism, I would try to come up with a
      - word that best describes the look of joy and realisation on the iPod
      - listeners face when the PodCaster drops a gem of information, for example
      - when you read the article written by Dave Winer concerning monoculture! I
      - had to just stop what I was doing and repeat it a couple of times.
      - I know a whole bunch of people that have had their creativity stifled
      - because of record company and radio station politics.
      - A person?s career can be in the hand of the person that chooses a radio
      - stations play list. If they don?t like your song, it simple wouldn?t get
      - heard. I hope PodCasting will finally break the monopoly that broadcasters
      - and record companies have enjoyed for so long.
      - Would there be a conflict of interests if you and Dave were to set up your
      - own record label on itunes and feature your artists in the show?
      - Anyways here is a little tune that I did with a few friends of mine. It?s a
      - cover of an old song written by Holland/Dozier/Holland. We have permission
      - from their publishers to cover this song; we own the sound recording and
      - would love to hear it on the Daily Source Code if you like it. It?s a mere
      - 4.1MB!
      - http://www.atnz11.dsl.pipex.com/comesee.mp3
      - Reeeeeeeeeespect to the Prince of Boing,
      - Paul@AudioDesigners.co.uk
