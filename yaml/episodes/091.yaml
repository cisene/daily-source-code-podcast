    IFP-799 Hacking
    - lee comment for adam
    - email from Maria
      - From: Maria Hamilton
      - Subject: USB Mass Storage & iFP-799
      - Date: December 16, 2004 7:37:44 PM GMT+00:00
      - To: Adam Curry
      - Hi Adam,
      - When I heard you mention that your newly acquired iRiver flash player didn't
      - support USB mass storage, I thought, "Huh - that's not like them. Sounds
      - like the sort of stuff that might get fixed in a later firmware release,
      - though - wonder if it has been?"
      - Well, according to this link ->
      - http://rocknerd.org/comments.pl?sid=1187&cid=2192 which leads, more to the
      - point, to this link -> http://www.iriveramerica.com/support/ums.aspx , it
      - has - or at least it sounds like it.
      - (The upgradeable firmware is one reason why the techies love iRivers -
      - there's even a project on the go to write a new, independent firmware for
      - the H1xx series of hard drive players from the people who wrote Rockbox
      - http://www.rockbox.org/ for the Archos jukebox.)
      - Hope this was useful,
      - MH
    - Firmware hacking
    - don't hack says AB
      - Hey Adam,
      - ?
      - ? I heard about podcasting from a BBC programme, heard your name and I've been listening to DSC for a few weeks now, its great.
      - ?
      - To the point, I was listening to your problems with your new iRiver device. I have a Creative Zen Extra mp3 player which has to use its own software to transfer music like yours. It came with loads of classical music preloaded and they are all protected as well.
      - However when I installed ?Windows Media Connect? an option from windows update, it appeared as an icon in "My Computer" and it allowed me to view the files in a very basic explorer view. Here I could copy normally to and from the device, apart from the protected files.
      - This obviously isn't a solution for your Mac, and it might not even work for your Windows, but if it does it might be better than resorting to hacking the firmware like someone else suggested.
      - ?
      - Adam B
      - ?
