   <p>#432 Daily Source Code for Tuesday August 1st 2006</p>

  <p>From the Curry Condo in San Francisco, Ca.</p>

  <p>MTV is 25 today and I got some stories from the old days.<br>Roger Smalls checks in and gets things rolling, and what is the deal with Mel?</p>

  <p>Music in this episode from:<br><a href="http://music.podshow.com/music/listeners/artistdetails.php?BandHash=109d0360d3e6b756d70215187cb52169">Jeremy Carr</a> - Just One Night<br><a href="http://music.podshow.com/music/listeners/artistdetails.php?BandHash=5cc420b7ce325ed6c3626544688b4ef2">Monika Herzig</a> - Just Something Fun</p>
   <p>Leave a voice mail anytime: +1201-625-6357 or +4420-7681-3753</p>

  <p>Dig me at <a href="http://adam.podshow.com/">adam.podshow.com</a></p>
   <p>Direct <a href="http://m.podshow.com/media/21/episodes/18260/deltasierracharl-18260-08-01-2006.mp3">Link</a> to the show.</p>
