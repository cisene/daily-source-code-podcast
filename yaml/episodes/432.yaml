  	<p>#432 Daily Source Code for Tuesday August 1st 2006</p>

  <p>From the Curry Condo in San Francisco, Ca.</p>

  <p>MTV is 25 today and I got some stories from the old days.<br>Roger Smalls checks in and gets things rolling, and what is the deal with Mel?</p>

