    Mucisions for hurricane relief
    - press release
      - MUSICIANS 4 HURRICANE RELIEF
      - On February 5, 2005, Rick Derringer in conjunction with The John Entwistle Foundation will present the ?Musicians 4 Hurricane Relief? benefit concert.
      - Superstar guitarist, Rick Derringer will not only perform at the concert, but as Executive Music Director, he?s been the driving force behind this event, gathering many of his famous friends to join this very worthy cause.
      - All proceeds from the concert and CD/DVD of the event will go to ?Florida Hurricane Relief? and ?The American Red Cross?.
      - The event will be held at Universal Theme Park in Orlando, Florida.
      - Musicians who have generously volunteered their time are:
      - Aerosmith?s Steven Tyler
      - Bon Jovi?s Richie Sambora
      - AC/DC?s Brian Johnson
      - The Allman Brother?s Dickey Betts
      - Three Dog Night?s Chuck Negron
      - Grand Funk Railroad?s Mark Farner
      - Cheap Trick
      - Michael Bolton
      - Eddie Money & Band
      - Joan Jett
      - Pat Travers
      - From Styx, Tommy Shaw
      - Spencer Davis
      - Rick Derringer
      - Carnie Wilson
      - Flock Of Seagulls
      - Lauryn Hill
      - Plus many more surprise guests to be added between now and show time!
      - Please join us in making a difference in the lives of tens of thousands of Floridians who have been forever changed by the record-breaking tragedies of the summer of 2004.
      - My sincerest thanks,
      - Rick Derringer
      - Executive Music Director, Musicians 4 Hurricane Relief
