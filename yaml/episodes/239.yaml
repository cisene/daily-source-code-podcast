    Cirrus vs Cessna
    - Cirrus may be a sexy, modern plane, but the biggest problem I am hearing from other pilots that are looking to buy one is the Cirrus' longevity. The Cirrus is a composite airplane. It's value drops over time whereas the Cessna's does not. I used to fly a 1957 Cessna 182 and almost none of the major components had been replaced. That won't be true with a composite plane. I have flown the Katana and the Cirrus and they are great planes, they just won't stand the test of time as well. A Cirrus is fun to fly for it's modernness and sexyness, it's just not an investment. I bagged my last girlfriend with a Cirrus. Picked her up from work in it for a sunset flight. Todd
