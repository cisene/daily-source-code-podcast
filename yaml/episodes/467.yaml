description: |-
  <div class="storycontent">
           	<p>#467 Daily Source Code for Monday September 25th 2006</p>
  	<p>From Curry Cottage, Guildford, UK</p>
  	<p>The
  start of a new week brings us controversey in Podcasting land with
  Apple&#146;s quest for ownership of all things pod. The PodSafe Music
  Network continues it&#146;s global outreach and we&#146;ve got proof in this
  episode of The Charlie. Uncle Jesse drops by with a new project and
  you&#146;ll hear a few promos, dilligently selected for your listening
  pleasure.</p>
  	<p>Relevant Links:<br>
  Acura <a href="http://acura.podshow.com/">TargetCast</a><br>
  Earthlink <a href="http://adchallenge.podshow.com/">AdChallenge</a><br>
  <a href="http://pfp.podshow.com/">Perversion For Profit</a><br>
  <a href="http://bgblast.podshow.com/">BG Blast</a><br>
  <a href="http://blogs.zdnet.com/ip-telephony/?p=1252">ZDNET article</a> on Apple&#146;s trademarking initiatives<br>
  &nbsp;<br>
  Music in this episode:<br>
  Wylde Bunch - Stomp the Bleachers (<a href="http://www.surfdog.com/">Surf Dog</a>) via <a href="http://jerseytodd.podshow.com/">Jersey Todd</a><br>
  <a href="http://music.podshow.com/music/listeners/artistdetails.php?BandHash=5d0a0cd097c403746f71fb2dcf3407ad">Trinity Lane</a> - When Angels Fly<br>
  &nbsp;<br>
  Call the Voice Mail and leave a message any time: +1 201 625 6357 or +44 207 681 3753</p>
  	<p>Dig me: <a href="http://adam.podshow.com/">adam.podshow.com</a></p>
  	<p>Direct <a href="http://m.podshow.com/media/21/episodes/27638/dailysourcecode-27638-09-25-2006.mp3">Link</a> To The Show</p>
  	<p><a href="http://www.podshow.com/shows/?mode=detail&amp;episode_id=27638">Comment</a>
  </p>
