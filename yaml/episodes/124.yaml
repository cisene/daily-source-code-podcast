  Senseo
   email
    Brian Froeber
    <bfroeber@hotmail.com> to adam
     Show options 5:05pm (5 minutes ago)
    Adam,

    I just wanted to write you because I heard you mentioned your senseo coffee
    machine on your podcast recently. I got one recently through a website
    that links to a Yahoo group called Freecycle.org.... Basically its a link
    site to local Yahoo groups where people post usable items that they want to
    get rid of but don't want to mess with trying to sell it so they will post
    it up for grabs and if your looking for something, you can post a want ad
    and people will respond. bottom line is it has to be free.

    Its a great site and Im not sure if its worthy of mention on The Daily
    Source Code, but I think it might be to help boost membership worldwide as
    they have groups for all over the world.

    Back to the Senseo... The lady I got mine from had it for a month and
    didn't like the coffee it made... she said it was too "european". Well
    whatever!! So she offered it and I grabbed it... I haven't tried it yet
    but will soon.

    I was going to see if you were aware that there are 3rd party pod sites for
    flavored coffee, tea pods, and plastic adapters to make your own pod with
    self ground coffee.... I don't have links to them this moment but I was
    wondering if you have bought any pods from these sites, and if so, which
    sites do you like the best for purchasing pods??

    I want to stay away from the 4 basic "flavors" that Senseo makes for the
    machine and explore alternative pods and pod accessories....

    So what else do you use in your Senseo???

    Also I love the daily source code and keep up the great work!


    Brian Froeber


    P.S. Do you remember a record label from the '80s named Enigma Records and
    are you familiar with any of the bands they had??? I know you played Mojo
    Nixon before.
  David
