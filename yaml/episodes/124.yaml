   email
    Mjmaslar@aol.com
    to adam
      Show options Feb 10 (2 days ago)
    Adam,
    I thought you'd get a kick out of this email I'm the guy from Muze that's been harassing Bob Lefsetz to get into Podcasting. Lefsetz writes a very, very influential newsletter to all the top RIAA industry types. My CEO, Paul Zullo turned me onto him. As I've been evangizling RSS & Podcasting to him, he had the opportunity to go to his (Lefsetz) annual confab in Aspen this past December. When one of the heads of a major label got up to speak, he asked, "Who in here has heard of RSS & Podcasting?" My boss, and our SVP of Marketing were the only 2 to raise their hands out of a total of 130.

    Just thought you'd like to know that word is spreading....


    Matthew Maslar

    ---------- Forwarded message ----------
    From: Lefsetz@aol.com
    To: undisclosed-recipients:;
    Date: Wed, 9 Feb 2005 22:31:11 EST
    Subject: Dawn and Drew
    I was planning to go out hiking tonight but I might have to stay home. You
    see I'm hooked on DAWN AND DREW!

    There's this guy at Muze. He keeps bugging me. I've got to get into
    PODCASTING!

    I'm not sure I can get into ANYTHING fathered by Adam Curry. I can never
    forget that hair on MTV.

    But you don't have to download the software, bone up on tech to listen to
    podcasts. Hell, you can just listen to them as MP3s on your computer. I mean
    that's what I do whenever anybody e-mails me about these things.

    But now I'm hooked. I might have to download the software. To put all 70
    shows on my iPod. Dawn and Drew ARE JUST THAT RIVETING!

    Did you ever know anybody in love?

    God, are you reading "Blink"? Freaks me right out. The part where they talk
    about whether a marriage is going to last. The key element is CONTEMPT! Oh,
    it's very hard to read the signals. You've got to be a pro. But once you're
    clued in, you know that slight roll of the eyeball, that slight brow lift,
    that evidences contempt. And the marriage is doomed.

    My marriage was doomed by contempt. My ex-wife was just TOO UNTOGETHER! I
    would get frustrated. Couldn't you PLEASE lock the door when you leave the
    house? I've got TENS OF THOUSANDS OF DOLLARS WORTH OF SHIT IN HERE! But, as
    many times as I mentioned it, she always continued to leave the door unlocked.

    Whew!

    I guess a marriage has to be based on mutual respect.

    And I'm not sure I've ever had that relationship. You know, one that fits
    like an old penny loafer. Where you're COMFORTABLE with each other. Oh, it
    doesn't mean you never disagree, it's just that you're IN IT TOGETHER! TWO
    people foraging in the forest instead of one. A BEST BUDDY WITH FRINGE BENEFITS!

    It appears Dawn and Drew are in love.

    Or maybe it's just that I'm infatuated with Dawn. Maybe she really wears the
    pants. Maybe Drew is kind of passive.

    But Dawn is a dream. First and foremost, she's VERBAL!

    I hate the silent babes. Hell, silences drive me NUTS! I want to be with
    someone who's got something to SAY! So I don't feel like an idiot when I
    comment on the minutiae of my life, when I spin my theories, make my observations.

    Dawn can keep up her end of a conversation.

    But she's not didactic. She's not overbearing. She's kind of like...

    You know, the kind of girlfriend you can't stop BUMPING INTO on the couch!
    They say stuff to bug you the tiniest little bit, to get under your skin just a
    little, because they KNOW YOU! THAT'S WHY THEY'RE DOING IT! You just want
    to slide your hip over and BUMP HERS! As evidence of INTIMACY! As evidence of
    CONNECTION!

    Dawn talks about the world at large. About her family. About her adventures.

    And sex.

    But not in a porn star way. In a NORMAL WAY!

    Sex is illegal in the United States. Don't they have a JUST SAY NO campaign?
    The government can't pass out condoms. Pornography must be stopped.

    But we're sex-centric. It's in our BIOLOGY!

    I mean she starts talking about a sideways vulva... How would you have sex
    with a woman like THAT!

    And then Drew kicks right in. About the MERMAID baby. The one with its legs
    fused. And Dawn plays dumb. Saying SHE'S NOT REALLY A MERMAID, IS SHE?
    Oh, you LOVE people like this. You just want to SQUEEZE HER!!! JUMP HER!!!
    She's so fucking ENDEARING!

    And then she starts talking about this wild dream she had. Where she
    orgasmed to a candy bar. And it wasn't even one she liked.

    And she starts quizzing Drew about wet dreams.

    And he's both uptight and DOESN'T KNOW SHIT!

    I mean for the first ten minutes or so, it was kind of boring.

    Well, not exactly boring. Kind of like sitting in a college dorm room with
    your buds. Interesting, familiar, but not RIVETING! But then Dawn is so open
    you can't HELP but listen. Because this is what you want. This openness in
    your OWN LIFE!

    Now I'll post articles below where you can catch up on this phenomenon.

    But I recommend you start where I did. Go to dawnanddrew.com.

    No, just listen to the podcast I did. Plug:
    http://mp3.dndshow.com/DNDS20050207.mp3 into your browser.

    Answer e-mail while you listen. Surf the Web. Do stuff in the background.
    SLOWLY, you'll get hooked.

    It's kind of like radio in the forties. But with a twenty first century
    twist. People are taking radio into their own hands and speaking from their
    hearts, UNFILTERED!

    A savvy radio station would add Dawn and Drew TOMORROW!

    And not change a fucking thing.

    Oh, by the way, you'll see pictures of Dawn and Drew in the articles below.
    Dawn doesn't look like a porn star. She's got purple hair and is thick.
    Completely changes your sense of beauty. Hell, I guarantee you I'd be better off
    with Dawn Miceli than Pamela Anderson and the Desperate Housewives. Because
    Dawn is real. And not afraid to be herself. Just another woman on the planet.

    http://www.usatoday.com/life/lifestyle/2005-02-08-podcasting_x.htm

    http://www.jsonline.com/onwisconsin/music/feb05/300150.asp
