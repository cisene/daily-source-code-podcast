    <p><strong>#624 Daily Source Code for Tuesday June 26th 2007</strong></p><p>From The Curry Manor, Guildford, UK.</p><p>A new savant joins the show today, and he's quasi-famous. His contribution almost pales in comparison to what we receive from the Satellite repair man though. PW wails away exclusively for the Charlie family. Throw in some Channel stuff and you've got a perfect program for a tuesday. </p><p>Tomorrow: The Season Finale of<a href="http://portcitypd.podshow.com/">Port City PD</a><br><br>A couple channels for you to enjoy: <br><br><a href="http://www.podshow.com/collection/12777.smil">The Old Time Radio Channel</a></p><p>If you’re looking great music to listen to on this<a href="http://www.savenetradio.org/">Day Of Darkness</a>, check out my<a href="http://www.btpodshow.com/listeners/collection/?listener_id=14&amp;channel_id=0">PodShow channel</a>of Internet Radio music shows. It’s a little different than listening to streaming playlists, we’ve got passionate people introducing you to the soundtrack of their lives, will they be yours as well?</p><p>Play in<a href="http://www.btpodshow.com/collection/56152.smil">RealPlayer</a><br>Play in<a href="http://www.btpodshow.com/collection/56152.asx">Windows Media</a><br>Play in<a href="http://www.btpodshow.com/collection/56152.mpu">WinAmp</a><br>Put on your<a href="itpc://www.btpodshow.com/collection/56152.xml">iPod</a><br>See the<a href="http://www.btpodshow.com/listeners/collection/?listener_id=14&amp;channel_id=0">Channel</a></p><p><br>Visit The PodShow<a href="http://suckless.podshow.com/">Suckless Zone</a></p><p><br><strong>Music in this episode: <br></strong><br><a href="http://www.mashuptown.com/2007/06/could_you_be_ki.html">DJ Axel</a> - Could You Be Kicked, Pushed And Loved<br><a href="http://www.btpodshow.com/music/?artist_id=8216">Pete Hopkins</a> - Become</p><div><strong>Call or VoIp the VoiceMail line anytime:</strong></div><div><span class="contentIndent">+1<span class="jajahWraper"><a title="Click to call this number with JAJAH..." class="jajahLink"><span class="jajahInLink">201 625 6357</a>or<span class="jajahWraper"><a title="Click to call this number with JAJAH..." class="jajahLink"><span class="jajahInLink">+44 207 681 3753</a></div><div><span class="contentIndent">Dig me: <a href="http://adam.podshow.com/">adam.podshow.com</a></div>
