    - email
      - From: Eric Elliott
      - Subject: Drum Corps (DCI) - drum cadences to the next level
      - Date: December 30, 2004 5:00:17 PM GMT+00:00
      - To: Adam Curry
      - Hi Adam,
      - Since you've been getting so into "drum cadences" lately, I thought I would turn you on to the BEST of the genre - Drum Corps.
      - Drum (& Bugle) Corps is what the best of the best musicians from high school and college marching bands do during the summer. They travel around the country all summer performing, and end up at the nationals for the world championships.
      - Keep in mind, that these kinds not only play this music, but march very elaborate shows at the same time.
      - Here are some links to some mp3's and a video of one of my favorites, the Blue Devils out of Concord, CA.
      - First off, on their site, go to this page and scroll down a bit, there are some wicked vids of the Blue Devils practicing and warming up The "Vic Firth" promos are particularly impressive:
      - http://www.bluedevils.org/tty/index.php?year=2004&dir=media/video
      - Next, I put a some mp3s and vids here for you to download. Some are huge, but WELL worth the download:
      - http://homepage.mac.com/corsa/bdevils/
      - For more info, check out the Drum Corps International site at http://www.dci.org/, and for more info on the Blue Devils, check out their site at http://www.bluedevils.org/.
      - And if you are looking for "hits" check out some of the other corps listed on the DCI site, there are definitely corps that play hits in their shows.
      - Hope you enjoy this!
      - - Eric Elliott
      - (The Rendering Plant guy)
