description: "Show details\n\tPodcast on March 15th 2005\n\tFrom Curry Cottage, Guildford UK\n\t<a href=\"http://homepage.mac.com/dailysourcecode/DSC/DSC-2005-03-15.mp3\">Direct download link</a>\n\t<a href=\"http://radio.weblogs.com/0001014/categories/dailySourceCode/rss.xml\">Podcast feed</a>\n\t<a href=\"http://www.curry.com/\">Weblog</a>\n\t<a href=\"mailto:adam@curry.com\">Email</a>\n\t<a href=\"mailto:mp3feedback@gmail.com\">MP3 Submissions and feedback</a>\nDon't wanna fuck with\nNo Stinkin' Transmitters\nAdam's Podcasting Sweeper\nRockmaninov Opener\n\nDJ Riko - Whistlers delight\n\trundown\n\t\tDJ Riko - Whistler's Delight (Full version)\n\n\t\tDo you know how to whistle? People on the 22 tracks used in this number do. It's almost seven minutes of whistling mashup madness. Here are the songs that are included:\n\n\t\tPeter Gabriel ­ Games Without Frontiers\n\t\tBangles ­ Walk Like An Egyptian\n\t\tCredit to the Nation ­ Teenage Sensation\n\t\tBrother Bones ­ Sweet Georgia Brown\n\
  \t\tJ. Geils Band ­ Centerfold\n\t\tEarl Hagen ­ The Fishin¹ Hole (Theme to the Andy Griffith Show)\n\t\tBernard Herrmann ­ Twisted Nerve\n\t\tScorpions ­ Wind of Change\n\t\tBobby McFerrin ­ Don¹t Worry Be Happy\n\t\tMuzzy Marcellino ­ 4:20 a.m.\n\t\tOtis Redding ­ (Sittin¹ on) The Dock of the Bay\n\t\tRoger Miller ­ Robin Hood\n\t\tAir ­ Alpha Beta Gaga\n\t\tHonky ­ The Whistler\n\t\tThe Lovin¹ Spoonful ­ Daydream\n\t\tRick James ­ Loosey¹s Rap (Loosey¹s House of Trix Mix)\n\t\tAdam Ant ­ Something Girl\n\t\tRZA ­ The Whistler\n\t\tGuns N¹ Roses ­ Patience\n\t\tDwarf Chorus - Heigh Ho\n\t\tX2 ­ Trigga da Whistla\n\t\tHandsome Boy Modeling School ­ Rock n Roll (Could Never Hip Hop Like This) Part 2\n\n\t\tgrtz\n\t\tSid\n\tDJ Riko\n\t\tWhistler's Delight (Full Version)\nMicrophone buzz\nPapers\n\tWren\n\tvatican\n\t\tCInsider?\n\tMJ\nPimp Daddy disagrees about mashups\n\tsids email\n\t\tsid\n\t\tto Adam\n\t\t\t More options\t 4:33pm (11\x8E2 hours ago)\n\t\tYour comment about mash up are\
  \ temporary is wrong, Mister Curry. it's the\n\t\tsame as with everything that's new and in reach for everybody: there's a lot\n\t\tof bullshit in the beginning and the real quality will survive. I'll never\n\t\tforget the feeling when I heard Beyonce vs Michael Jackson (Crazy in love &\n\t\tThriller) Euphoric !! If you don't know that one (especialy for you):\n\tBeyonce vs Micheal Jackson\n\t\tThriller In Love\nUpdates\nDishwashers continued\n\temail\n\t\tohn Hartnup\n\t\t<john.hartnup@gmail.com> to adam\n\t\t\t More options\t 1:05pm (26 minutes ago)\n\t\tHi Adam,\n\n\t\tThe two dishwasher plan was not new to me, but has anyone described to\n\t\tyou the logical extension of this plan?\n\n\t\tIt's simple: buy two houses next to each other, with identical furnishings etc.\n\n\t\tLive in one house until it is no longer habitable. Then simply move\n\t\tnext door. While you're living in house number two, get industrial\n\t\tcleaners to clean the dirty house ready for when you need to swap\n\
  \t\thouses again.\nJan Polet\n\tJan Polet's Hit Test\n\t\tHIt Test 23\\nDuration: 00:34:47"
