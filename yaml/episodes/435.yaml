description: |-
  <div class="storycontent">

  	<p>#435 Daily Source Code for Friday August 4th 2006</p>

  <p>From Curry Cottage in Guildford, UK</p>

  <p>For today&#146;s friday festivities I decided to ram the show full of
  your music suggestions, feedback and promos. Just a little bit of
  commentary from me here and there, but you&#146;ll get lots of ideas for
  stuff to listen to and talk about over the weekend. Although I love the
  David Ippolito&#146;s &#145;Ooh Exxon&#148; song, I disagree with the general feeling
  of exploit and talk about it. 90% of this show is created entirely by
  you, the listeners, so enjoy!</p>

  <p>Music Played in this show:<br><a href="http://music.podshow.com/music/listeners/artistdetails.php?BandHash=2084912e47e4edd3c2576aa81c6852a5">The Shakes</a> - Liberty Jones<br>Eight Writers - Unknown<br><a href="http://www.thatguitarman.com/">David Ippolito</a> - Ooh Exxon<br><a href="http://music.podshow.com/music/listeners/artistdetails.php?BandHash=eea836d7cd5b015d54ce5ac34a8756ad">Rich Cronin</a> - Nothing lasts forever<br><a href="http://music.podshow.com/music/listeners/artistdetails.php?BandHash=6d2e6d5fa53f967519b617ffb79beafd">Kevin Reeves</a> - Throw me a line</p>

  <p>Relevant links:<br><a href="http://minimovies.podshow.com/">MiniMovies</a> Video Podcast<br><a href="http://www.youtube.com/watch?v=zmHm0rGns4I">Colbert </a>on WikiPedia<br><a href="http://garage.podshow.com/">PodShow Garage</a><br><a href="http://thestrip.podshow.com/">The Strip</a> with Toni Braxton</p>

  <p>Leave a voice mail anytime: +1201-625-6357 or +4420-7681-3753</p>

  <p>Dig me at <a href="http://adam.podshow.com/">adam.podshow.com</a></p>
  	<p>Direct <a href="http://m.podshow.com/media/21/episodes/19183/deltasierracharl-19183-08-04-2006.mp3">Link</a> to the show.</p>
