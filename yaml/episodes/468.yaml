description: |-
  <div class="storycontent">
           	<p>#468 Daily Source Code for Tuesday September 26th 2006</p>
  	<p>From Curry Cottage, Guildford, UK</p>
  	<p>The
  UK broadcasters and music companies are crying in their milk about the
  state of the market ands industry. We certainly can show them the
  light, on our &#145;dark side&#146; of the fence!<br>
  A detailed review of the letter Apple&#146;s lawyers sent to Podcast Ready,
  all is not what it appears to be! You&#146;ll be happy to hate me as I
  generally side with Apple in this case.<br>
  And finally&#133; Comic Strip Blogger gets his wish&#133;.</p>
  	<p>Relevant Links:<br>
  Acura <a href="http://acura.podshow.com/">TargetCast</a><br>
  Earthlink <a href="http://adchallenge.podshow.com/">AdChallenge</a><br>
  <a href="http://pfp.podshow.com/">Perversion For Profit</a><br>
  <a href="http://bgblast.podshow.com/">BG Blast</a><br>
  Podcast Ready&#146;s <a href="http://www.podcastready.com/info.php?section=8&amp;page=41">letter from Apple</a><br>
  &nbsp;<br>
  Music in this episode:<br>
  <a href="http://music.podshow.com/music/listeners/artistdetails.php?BandHash=0a02ae09c8ae5908a060ca8b1a83cc97">Monique Rhodes</a> - Doin&#146;&nbsp;Allright<br>
  Breaking Laces - God in Training<br>
  &nbsp;<br>
  Call the Voice Mail and leave a message any time: +1 201 625 6357 or +44 207 681 3753</p>
  	<p>Dig me: <a href="http://adam.podshow.com/">adam.podshow.com</a></p>
