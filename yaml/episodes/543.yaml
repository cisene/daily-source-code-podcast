           	<p>#543 Daily Source Code for Friday February 9th 2007</p>
  	<p>From The Curry Manor, Guildford, UK</p>
  	<p>The
  trip to the continent has been postponed due to illness, both the Lady
  P. and I are FUBAR-ed. After deliberating to run a Best Of Charlie
  today, I couldn&#146;t bear the thought of not ramming into the weekend with
  all your great contributions to the show. Yes, all your fave&#146;s are here
  for the party. Join us?</p>
