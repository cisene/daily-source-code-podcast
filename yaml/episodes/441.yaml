  <div class="storycontent">
            <p>#441 Daily Source Code for Monday August 14th 2006</p>
   <p>From Curry Cottage in Guildford, UK</p>
   <p>The
  week kicks into high gear with Deep Purple, who have just joined the
  PodSafe Music Network. Who ever thought the woman from Tokyo would be
  legal to play on a podcast?<br>
  Not uncommonly, I made some mistakes last week that I needed to
  correct, followed by a lesson in international phone dialing. Slau
  checks in with an awesome Folder/Scruncher tune and some discussion
  about terrorism is of course unavoidable.</p>
   <p>Relevant links in this episode:<br>
  Verizon&#146;s <a href="http://www.valleywag.com/tech/verizon/83-words-you-cant-say-on-verizon-wireless-193699.php#more%5D">list</a> of naughty words<br>
  <a href="http://www.slau.net/">Slau</a><br>
  </p><embed anchor_height="15" anchor_width="56" anchor_top="312" anchor_left="106" onmouseout="" hover="true" pref_url="http://www.npr.org/templates/story/story.php?storyId=5640180" type="application/browster-plugin" height="0" width="0"><a href="http://www.npr.org/templates/story/story.php?storyId=5640180">NPR Story</a> on bizz and first class travellers<br>
  <a href="http://godaddy.com/">GoDaddy</a> (use checkout code DSC3)<br>
  Acura <a href="http://acura.podshow.com/">TargetCast</a><br>
  <embed anchor_height="15" anchor_width="74" anchor_top="366" anchor_left="106" onmouseout="" hover="true" pref_url="http://adchallenge.podshow.com/" type="application/browster-plugin" height="0" width="0"><a href="http://adchallenge.podshow.com/">Ad Challenge</a>
   <p>Music in this episode:<br>
  </p><embed anchor_height="15" anchor_width="69" anchor_top="414" anchor_left="106" onmouseout="" hover="true" pref_url="http://music.podshow.com/music/listeners/artistdetails.php?BandHash=f103e10fde3e21772ab5045ec8b3cef2" type="application/browster-plugin" height="0" width="0"><a href="http://music.podshow.com/music/listeners/artistdetails.php?BandHash=f103e10fde3e21772ab5045ec8b3cef2">Deep Purple</a> - Woman in Tokyo (Live)<br>
  <a href="http://music.podshow.com/music/listeners/artistdetails.php?BandHash=f103e10fde3e21772ab5045ec8b3cef2">Deep Purple</a> - Girls like that
   <p>Leave a voice mail anytime: +1201-625-6357 or +4420-7681-3753</p>
