description: |-
  <div class="storycontent">
           	<p>#442 Daily Source Code for Wednesday August 16th 2006</p>
  	<p>From Curry Cottage in Guildford, UK</p>
  	<p>We
  almost missed a second day in a row of the charlie, due to weather my
  solo crossing of the English Channel has been cancelled, by me <img src="http://curry.podshow.com/wp-images/smilies/icon_smile.gif" alt=":)" class="wp-smiley"> </p>
  	<p>I
  filled up today&#146;s show with lots of feedback you sent me over the
  weekend and yesterday, catching up on topics like terrorism, why there
  are so many Paul&#146;s in UK Podcasting and the required sruncher/folder
  feedback. </p>
  	<p>Relevant links in this episode:<br>
  <a href="http://godaddy.com/">GoDaddy</a> (use checkout code DSC3)<br>
  Acura <a href="http://acura.podshow.com/">TargetCast</a><br>
  <a href="http://adchallenge.podshow.com/">Ad Challenge</a></p>
  	<p>Music in this episode:<br>
  <a href="http://music.podshow.com/music/listeners/artistdetails.php?BandHash=c9df90cd7821b83d72aed1db69dc7107">Alice Cooper</a> - No more mr. nice guy<br>
  <a href="http://music.podshow.com/music/listeners/artistdetails.php?BandHash=16d72b1b8aed9efd4bc41c612cb1b09c">Gary Moore</a> - Gonna rain today</p>
  	<p>Leave a voice mail: +1201-625-6357 or +4420-7681-3753</p>
  	<p>Dig me at </p><embed anchor_height="15" anchor_width="113" anchor_top="424" anchor_left="162" onmouseout="" hover="true" pref_url="http://adam.podshow.com/" type="application/browster-plugin" height="0" width="0"><a href="http://adam.podshow.com/">adam.podshow.com</a>
  	<p>Direct <a href="http://m.podshow.com/media/21/episodes/21218/dailysourcecode-21218-08-16-2006.mp3">Link</a> to the Show</p>
  	<p><a href="http://www.podshow.com/shows/?mode=detail&amp;episode_id=21218">Comment</a>
  </p>
