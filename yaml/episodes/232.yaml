    Nintendo begins podcasting!
    - Walter Nintendo has just begun podcasting, K9Cast has the scoop: www.k9cast.com—more-on-nintendogsnintendos-first.html The timing of this is interesting because the Play-Yan mp3/multimedia add-on player for the Nintendo DS and GBA may see a US release date in "late 2005" according to wikipedia. Nintendo could be planning to turn DS and GBAs into podcast players! With over 50 million Gameboy Advance units sold that's alot of listeners! The first episode of the Nintendo Podcast is on the subject of Nintendogs, a virtual dog game (hence the interest to K9Cast). Excellent. Walter
    Listening to a podcast story
    - JP Dane-Castro Hey Adam. My name is JP and I have been a long time listener and fan of the Daily Source Code. First off I would just like to say happy birthday to you and your daughter Christina, congratulations to both of you. Second I would just like to say that a funny thing happened to me the other day. The car I was in drove under an overpass while I was listening to the latest installation of the Daily Source Code and for a split second I thought to myself "oh no, I am going to lose reception". I then immediately thought to myself "wait, this is a podcast, you can't lose reception." So there is the beauty of podcasting, being able to listen to what you want, when you want without having to worry about bad reception, or interceptions. So Adam I just thought that I would share that little tidbit of podcasting goodness with you, I love the show and keep up the good work!
