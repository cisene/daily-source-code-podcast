    mp3 Licensing
    - Drew Sturgiss If you want to get around the mp3 licensing issue, a solution can be found in the ogg theora audio format. This is a lossy audio format, comparable to mp3, but completely without patents. It also boasts arguably better sound and compression. Anyhoo, just thought I'd let you know, thanks for doing the show, its like radio, but with perfect reception all the time. -- Drew Sturgiss
