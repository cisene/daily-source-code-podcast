    More on BioDiesel
    - Oil Supply
      - Mike Krus Hi this is Mike Krus, of newsisfree.com About the current state of oil supply, there's this thing called Tar Sands. It's basically oil which was not trapped under a non-porous layer of rocks, so the liquid & gas part has evaporated, leaving only tar in sand type soil. There is loads of that in Canada, more than in Gulf apparent. And we know exactly where it is. Getting the oil out of that is expensive though (you can't pump it, it's more like mining), would cost about $45 a barrel. But with the current price of oil, it would be economically viable. Of course, this means more oil related pollution for a longer time, with additional pollution produced while mining the damn thing... See en.wikipedia.org—Tar_sands www.wired.com—oil.html Anyway, great show... regards, Mike
    - pizza shop powers own car with bio-diesel
      - Tom Schuring Site
    - Not a Drop
      - Paul Clark Hey Adam, This may sound stupid, you can dismiss if you like, but I have been recieving numoerous emails about a rumor, about a "Not a Drop" day on September 1st, convincing people to not buy gas, forcing the oil companies to lower there prices. You live in the UK, you pay a lot more for "petrol" than we do here in the states. If you feel its a noteable cause, maybe give a little bleep out to your viewers. You have a strong voice in the community, make a difference. Even if not everyone does it, it will still make some ripples in the pond.
    Cirrus SR22 planes and test pilot
    - Nigel Savage Hey Adam, just listening to your show 231 and you mentioned the SR22 plane. My pal is a test pilot for it and I went up in it for a test flight with him. It's actually a great plane! don't knock it! You also mentioned the plane is destroyed after 'chute deployment and landing. This is not true, the landing gear only needed replacing in several tests performed in Minnesota, besides who gives a crap about the state of the plane when you survived what could have been a lethal crash. The chute does save lives and it's a great idea.. it WORKS! Keep up the great work and paint that Curry Complez brown or something, it's gotta look like wood at least Nigel
    I think guys (teens) are WAY different in mindset than girls
    - Rishabh Kumar Adam, Guy teens are MUCH MUCH MUCH MUCH MUCH different than girls....in mindset that is. Is it just me, or does it seem that more than 95% of advertisements on television directed to girls? Also, girls seem to do almost nothing but talk about fashion, and guys (hey, the guys part isn't THAT bad lol). Advertisements, in my opinion, are turning today's girls into fashion zombies. On the other hand, I'm not saying guys don't have their share of "weirdness" either. We dream about chicks more than half of the time, and need to get our lazy asses off of the ground at times. Both genders argue with their parents, and here's my view on it. For a guy teen, at least me, arguing with my parents seems to be an "every-other-day" sort of thing, and it feels commonplace nowadays. Our arguments seem to be more about our rights and why we're out with other people instead of "staying at home, with family" a lot. I agree with the other teens, parents DO seem to have a hard time "letting go". However, my arguments with my little brother (he is nine) seem to be much more frequent than with my parents. Anyways, I'm 14, and that's my 0.1 cents, Rishabh Kumar (pronounced Rish-ub)
    VMA's
    - Field Walsh Hey adam you never mentioned what you thought about this years VMA's on today show. I know that I thought they sucked ass, to damn much rap. I think they have gone way down hill ever since the year jimmy falon hosted them. I thought his montage opening skit was awsome, and I watch it every year expecting another awsome opening like that only to be disapointed. Oh yeah and how could you not like the cirrus sr-22? Its only the coolest GA plane out there, just look at that sweet panel! Even though I must say the 182RG is pretty cool also, i got about 30 hours in it. Later Field Walsh
