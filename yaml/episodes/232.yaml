    TV SCREEN BRAIN MELTING FACT :-)!
    - SeRgEy t Hi adam, its sergey again. first thing, happy birthday 2u. I wanted to tell you an interesting fact about TV screens, relating to what you said about the brain melting.... so: a friend of mine has been using computers for as long as he can remember, thats his job...and he used the first PC's, which had those green-black screens. The TV screens and the computer screens are basically the same thing, but, with the computers you just sit closer. anyways, he used his green black monitor every day, day after day for years. now his bald...and he started getting less hair in his early 20's.... noone in his familly had ever had problems like that.... after some reserch, in medical websites and books, he found out that that friken screen made the problem. what im basically trying to say is: TV screens DO IN SOME WAY MELTS YOUR BRAIN or atleast cause some health problems in the person.....and the closer you sit to it the more crap it does to ya. the last epesote was great, thanx alot for writing me back i was really happy to see that you did. later :-).
