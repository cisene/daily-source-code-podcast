    Using Email Addresses in Show Notes
    - Kevin Crossman I didn't like the new show notes format at first but do like seeing the text of the emails. So, I'm a net positive at this point. FYI: It wasn't a big deal for me, a podcaster who has his email address all over the net, but others might object to you posting their email addresses in the show notes (where they can be harvested by spam robots). You're spoiling us with all these daily Daily Source Codes. We appreciate it! Kevin Crossman The Frat Pack Tribute: Saluting Hollywood's Comedy Clique www.the-frat-pack.com Listen to our Podcast at www.fratpackpodcast.com
