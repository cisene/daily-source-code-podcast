  summary: <p>I bit the bullet and drove all around town(s) in search of some temporary solution for recording to mp3 externally from my computer. I got quite an education in what's available and it's all podcast ready! So I recorded an intro on the (low quality) memo-recorder function on my way home from the store.</p><br><br><p>The 'bic lighter' size mp3 recorder is damn handy. And because I'm recording from the headphone jack, it's feasible that I could record a podcast on almost any computer that is handy, or plug in my hi-quality microphone for podcasts on the go. Now for a battery powered mixer so I can mix in tunes from my iPod and I'm really set!</p><br><br><p>The show is 43 minutes long and comes in 19.7 megabytes of podtune filled fun :)</p><br><br><p><a href="http://homepage.mac.com/adamcurry/DSC/DSC-2004-10-25.mp3">mp3</a></p>
