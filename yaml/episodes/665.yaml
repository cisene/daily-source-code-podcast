description: '  <p><strong>#665 Daily Source Code for Friday September 21st 2007</strong></p><p>From The Curry Manor, Guildford, UK..</p><p>Today''s Medium Music Fubar Friday Show is a couple days in tha making after I swallowed a big red pill in London earlier in the week. So only two topic; a lightweight discussion on the crippled iPhone, and we dive deep into this fantastic piece of internet video documentary mashup that is compulsory material to watch: <a href="http://www.zeitgeistmovie.com/">The ZeitGeist movie</a>. <br><br><strong>And of course the music links:</strong><br><br><a href="http://www.mashuptown.com/2007/09/mashuptown-intr.html#_">Dr. Waumiau</a> - Where''s your URAQT Austin Powers<br><a href="http://www.btpodshow.com/music/?artist_id=6153">The Fire Apes</a> - For A Day<br><a href="http://www.btpodshow.com/music/?artist_id=2200">Stephanie Seskin</a> - Jerkin'' My Chains</p><p><strong>Call Anytime<br></strong>:  <br>+1 201 625 6357 or +44 207 681 3753</p><p>Dig me: <a href="mailto:adam@podshow.com">adam@podshow.com</a></p>\nDuration:
