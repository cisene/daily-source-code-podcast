    #665 Daily Source Code for Friday September 21st 2007

    From The Curry Manor, Guildford, UK..

    Today's Medium Music Fubar Friday Show is a couple days in tha making after I swallowed a big red pill in London earlier in the week. So only two topic; a lightweight discussion on the crippled iPhone, and we dive deep into this fantastic piece of internet video documentary mashup that is compulsory material to watch: The ZeitGeist movie.

    And of course the music links:

    Dr. Waumiau - Where's your URAQT Austin Powers
    The Fire Apes - For A Day
    Stephanie Seskin - Jerkin' My Chains

    Call Anytime
