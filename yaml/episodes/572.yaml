            <p>#572 Daily Source Code for Thursday March 29th 2007</p>
   <p>From The Curry Manor, Guildford, UK</p>
   <p>An
  angry mob awaits the return of NyLon, who in turn receives more
  creative work from the audience, the contributors, the very people he
  believes are not being serviced. Brilliant music from MC Lars and the
  Undercover hippy as well as poignant feedback and thoughts about Kathy
  Sierra</p>
