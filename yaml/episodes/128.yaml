  \ More options\t 3:42 pm (11\x8E2 hours ago)\n\t\tAdam,\n\n\t\tYou have a far greater listenership than my podcast so you might want\n\t\tto mention that if you record a song as a parody of the original you\n\t\tare protected from copyright infringement. Weird Al Yankovic showed\n\t\tthis to be true when he recorded parody songs that when he asked the\n\t\toriginal artist for permission first and they said no he did it anyway\n\t\tbecause it was a parody. I would think that Beatallica presenting\n\t\tBeatles songs in a parody format styled like Metallica should fall\n\t\tunder this as well, but Beatallica should check with their lawyers as\n\t\twell.\n\n\t\tEric Kauschen\n\t\tSaundhaus Studios\nMadge Weinstein\\nDuration: 00:49:20"
