    Arbitron Ratings
    - Hey, Adam! Talk about interesting, I just got a letter in the mail from Arbitron (the US ratings folks). They want me to participate in their “radio station” survey! I’m gonna say yes, but I’m gonna log my PODCAST listening right along side the ‘traditional’ radio! And I already know I listen to either podcasts or streaming internet radio much more often than over-the-air stations. I’ll keep you posted! I bet they don’t even have a podcast section yet. I’ll make sure we get that changed! My rating period starts on 9/22/2005. Cheers! -=\ Bob Robinson \=-
    Subliminal Experiment Worked -- sort of
    - Hi Adam, Normally I listed to the DSC in the car on my way to work, so you had the right idea with your subliminal experiment. Unfortunately, I listed to that particular show in bed before going to sleep. So, when you asked us to focus on an object, all I saw was darkness. The experiment was not a complete failure. That night I head a dream I was walking through an airport. I sat down to wait for my flight and decided to strike up a conversation with the traveler next to me. His name? Adam Curry... Kevin Crossman Fremont, CA The Frat Pack Tribute Podcast at www.fratpackpodcast.com
    Great jobcast...what about CVCast
    - Adam, I really enjoyed the jobcast, but was really surprised when the guys asked candidates to send in a "paper" CV. How about CVcasts, where the candidate adds the CV as show notes, but then uses 10-15mins to tell the company about themselves...would be a great way to really shorten the recruitment cycle. The thing I got from the jobcast was that these guys sounded like people I would like to work for, so I guess it might work in reverse, so that they hear someone they want to work for them....just an idea.... rgds Mark
    Help IS Here NOW...I've Seen It
    - Hi Adam, I was listening to your show as you were talking about the "instant relief" we expect in America. You played a promo by Chris Rockwell and in it he said " these people are not getting the help they need to survive". I'm sorry, but that's not the case. What Chris is seeing on TV is only a small amount of the people who are just now getting help. Why? Because some have been hiding in their homes not wanting to leave. They simply thought the water would go down quickly or because they wanted to protect what little they have left. One person told me he had plenty of food and water but was afraid to leave because of the "bad element" that was shooting at the rescuers and evacuees. I know this because I've spoken with many of the evacuees at the Red Cross shelter here in Shreveport. Yesterday I spent 4 hours just talking to Red Cross volunteers and refugees that just got out of New Orleans in the past 24 hours. You played one of my interviews on your show last Friday. ( ZIP 71101 with Ron Stroope) I spoke to a girl named Tammy. She had no idea if her father and mother was safe because they stayed behind. Yesterday, as I was leaving I spotted her. She told me that the Red Cross found her father and he was working with FEMA and they got him a place to live for his family in Lafayette, LA. He will pick up her and her twin brother today. I searched for the other people I spoke to on my first visit and they were not there. I was told that they probably found a place to live or maybe a family took them in. Many have gone back to south Louisiana to stay with family and friends. Yesterday many of the local companies held a job fair and many found employment. In fact, I saw one lady jumping for joy as she was telling her fellow refugees that she had a job. This shelter is housing over 1200 people. I know of another one housing about the same. On the LSU campus in Shreveport another shelter has been opened. Many of the local volunteers are taking people home with them or finding them places to live. I visited a church that bought out a mall. In the old Dillard's area there were hundreds of boxes stacked 6 feet high full of clothing, furniture and supplies like bottled water. This area must have been over 75,000 square feet or more and it was nearly full. Another church took another building about the same size and they are filling it up and giving it out. I'll tell these stories and more on my next podcast. I can tell you first hand, it's happening through the efforts and generosity of the people. We should never wait or depend on the government to take the first step in something like this. There will always be some folks that get missed or overlooked and that's a shame. Of course, I'm only seeing what's happening in my city but I'm 100 percent sure that in Austin, Dallas, Houston, Baton Rouge, Jackson, Atlanta, or anywhere there are shelters and concerned citizens getting involved, help will be available. It's a slow process and will be even slower and harder for many of the elderly and handicapped but I believe this country will pull together and find a solution, because together, we can make a difference. Ron Stroope
    Podsafe: Rob Costlow - Bliss [Info ]
    - Hello! I let another song into the Podsafe Music Network. A long…………….. one. I wrote it for my wife, for our wedding. It’s called “Bliss” and it’s in my info. Played it for her during the ceremony… 6 years ago, this Oct. 2 (yah, we got married young). Something that may inspire, give meaning to the unknown. I really wish I could do more for the utter crap that’s going on in the US. Crap that’s unavoidable devastation and other regular political poo. Don’t get me started. Thank God there is a lot of support from citizens. More to come. I hope you enjoy. Rob
    - Rob_Costlow_-_Bliss
