  		2005 The Year Of Podcasting
  Pimp Daddy Sid'd mashups
  	email
  		Yoh Curry,

  		Here's another track to kickstart this new week. Heard on the DSC that
  		people ask you where you get your Mash Ups. As a collector I can show you
  		and your listeners some cool sites that you can link on your weblog so
  		people could explore the wonderfull world of Mash Ups themselfs. No worries,
  		the specials ones are really hard to find so there's enough for the DSC.
  		This track was made by Pheugoo. One of the best in his kind and also one of
  		my personal favorites. This is a mash between Jackson and Therapy?. The're
  		many mases of 'I want you back' and this is one of the best I know. You can
  		find more stuff from at www.pheugoo.nl. Enjoy it.

  		Sidhappens
  	Pheugoo
  		Jackson Family Therapy?
  beatallica petition
  	http://www.petitiononline.com/p1gp0g/petition.html
  Brick House cadence from P-Dub
  	P.W. Fenton
  		Digital Flotsam
  			Radio Free Radio - Digital Flotsam 07.5
  iPodder.org
  Catholic Insider
  	ci20050227
  Mike Corley mashups
  	email
  		Hey Adam,

  		Since you didn't actually mention it on the show, and everyone may not
  		know, NDA stands for Non-Disclosure Agreement--which pretty much
  		translates to No Damn Announcements anyway.

  		Yes I do remember Veruca Salt. In fact, that leads right into the
  		first track I have for you. After Veruca Salt disbanded, Nina Gordon
  		went on to a solo career--much mure mellow then what you might
  		remember from Veruca Salt, but good nontheless. She also recorded a
  		cover song, of the classic NWA hit -- Straight outta Compton.

  		http://mywebpages.comcast.net/onyxfrog/mp3/StraightOutOfCompton.mp3

  		Now Adam, I know I haven't sent you one in a while, but I have sent
  		you mashups before. So I'll just assume that when you said that you
  		get all of yours from Cid that you mean "Cid and that Mike Corley."
  		Ok, well to get back on your good side here is one of my favorite
  		mashups as of late. Its by Dinbot (http://www.dinbot.com) and is quite
  		well molded. The first artist is 50 Cent, hard ass gangsta who's been
  		shot (nine times!,) stabbed, arrested, you name it, fiddys done it.
  		Now what can match the hardness of this rock of pure gangsta? Nothing
  		short of Devo with Whip It. Obviously. Check it out, its called
  		Whipsta!

  		http://mywebpages.comcast.net/onyxfrog/mp3/Whipsta-Devovs.50Cent.mp3

  		One last thing for ya. I did this a while ago and the plan was to get
  		it put on a t-shirt butthast never happened so I'll send it to you to
  		do waht you want with it.

  		http://mywebpages.comcast.net/onyxfrog/img/podfather.gif

  		Ok, Adam, I'll talk to you soon and I'll make sure that you have
  		someone else to get you mashups.

  		-Mike Corley
  	dINbOT
  		www.dinbot.com
  			Whipsta (Devo vs. 50 Cent)
  Break
  MegaSeg
  House Cold
  Jan Polet
  	Jan Polet's Hit Test
  		Hit Test 16
  Podsafe
