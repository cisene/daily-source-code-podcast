  Adam's Podcasting Sweeper
  Rockmaninov Opener
  Adam's groove mix
  	email
  		Hey Adam,

  		With your years of experience, you've got a natural rhythm.  So, I spent a
  		couple hours in front of ACID Studio and put it to music:

  		Openpodcast #1344
  		http://openpodcast.org/media/2005/3/15/openpodcast_1344.mp3

  		Some of the clips that I chose aren't necessarily the most flattering, but I
  		did it with love.  I remember the worst thing about being in radio was when
  		the Production Manager sat me down to go over my aircheck each week.  He
  		pointed out ALL of my stumbles and bumbles, but I always thought those
  		bumbles were part of my charm.  There is an enormous amount of character and
  		truth in those moments of verbal indecision, and that's one of the reasons
  		why I like listening to podcasts so much; Most podcasters haven't had the
  		innocence beaten out of them by the broadcast establishment.

  		Keep up the great work, and good luck with Boku.

  		--Scott Fletcher
  	Scott Fletcher
  		OpenPodcast.org
  			Adam's Groove Mix - OpenPodcast.org #1348
  MJ
  	doug's question
  		Doug Ritter
  		to adam
  			 More options	 Mar 15 (11 hours ago)
  		Let's step into the time machine and pretend Christina was actually born Christopher.  Would you let Christopher stay at Michael Jackson's house?

  		Love the show,

  		Doug in Philadelphia

  		--
  		Sent from my Treo
