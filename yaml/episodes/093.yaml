    Delay!
    - paul's email
      - From: Paul Eastman
      - Subject: Del-l-lay
      - Date: December 27, 2004 1:41:34 AM GMT+00:00
      - To: Adam Curry
      - Hi Adam,
      - Hope you had a great festive period.
      - Firstly, I'd like to tell you how cool it was to hear our tune 'come see
      - about me' on your last Daily Source Code before xmas. Our first PodCast!
      - Many thanx.
      - I've been thinking about the problem you have with the slight delay in your
      - headphones while recording your PodCast. I can't be sure, but this sounds
      - like a problem faced by all musicians when recording a live performance
      - directly to a computer, called 'Latency'. This is generated by the vast
      - amount of processing the computer has to do to the audio data before it
      - reaches your headphones. Looking at the diagram of your set-up, it seems
      - there's a fare few applications the audio is passing through before it
      - finally reaches the output stage.
      - This can be incredibly off-putting for, let's say, a singer who wants to
      - listen to their own voice during a recording session.
      - There are a few ways to get round this problem; the one I use is to have a
      - mixer at the input stage and take a split off to the singers headphones, the
      - same as taking the headphones out of your audio interface I guess. The mix
      - to the computer from this input mixer is sent via an auxiliary output which
      - enables you to bring the computer output back into the mixer, without the
      - vocals, so you can listen to the audio clips you drop in during the show.
      - You might have to put a bit of effects at the input stage just so you have
      - an idea how your voice is sounding, but doesn't end up in the final mix!
      - So you listen to you voice real-time through dedicated effects (with no
      - Latency) while everything else comes from computer. Clear as mud?!
      - Mmn, I think that kinda makes sense. If indeed it is the Latency problem.
      - Anyways, thanks again for the play, and hope some of this info is of use.
      - Respect to the Bastian of Boing!
      - Paul@AudioDesigners.co.uk
