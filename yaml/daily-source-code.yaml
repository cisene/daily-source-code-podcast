---
feed:
  filename: rss.xml
  # Host of the renovated feed and its images, filled in for __BASE_URL__
  # (Adam's domain, 2026-10-27).
  base_url: https://thedailysourcecode.com
  # Audio in /audio, video in /video, through the OP3 analytics prefix:
  # audio_url or video_url + release name (yaml/release-audio.yaml), set in
  # every episode by python/update-episodes-enclosures.py (folder structure
  # 2026-10-28: /audio /chapters /opml /srt /video /vtt).
  audio_url: https://op3.dev/e/thedailysourcecode.com/audio/
  video_url: https://op3.dev/e/thedailysourcecode.com/video/
  xml:
    version: 2
    namespaces:
      podcast: "https://podcastindex.org/namespace/1.0"
      itunes: "http://www.itunes.com/dtds/podcast-1.0.dtd"
      atom: "http://www.w3.org/2005/Atom"
      media: "http://search.yahoo.com/mrss/"
      content: "http://purl.org/rss/1.0/modules/content/"
      rawvoice: "https://blubrry.com/developer/rawvoice-rss/"
      #wfw: "http://wellformedweb.org/CommentAPI/"
      dc: "http://purl.org/dc/elements/1.1/"


# Tagline: Where developers and users party together.

rss:
  channel:
    tags:

    - tag: link
      namespace: atom
      attributes:
        rel: self
        type: application/rss+xml
        href: __BASE_URL__/rss.xml
        title: Adam Curry's Daily Source Code Podcast

    - tag: title
      namespace: dc
      text: Adam Curry's Daily Source Code Podcast

    - tag: language
      namespace: dc
      text: en

    - tag: creator
      namespace: dc
      text: Adam Curry

    - tag: author
      namespace: dc
      text: Adam Curry

    - tag: publisher
      namespace: dc
      text: Adam Curry

    - tag: date
      namespace: dc
      text: 2004-08-13

    - tag: dateDigital
      namespace: dc
      text: 2004-08-13

    - tag: docs
      text: https://blogs.law.harvard.edu/tech/rss

    - tag: link
      text: __BASE_URL__/

    - tag: title
      text: Adam Curry's Daily Source Code Podcast

    - tag: description
      text: "The Daily Source Code, Adam Curry's podcast that started podcasting. From August 2004 to November 2013: 863 episodes plus specials, recorded from Belgium, Guildford, San Francisco and on the road. News, technology, music and life, and a new medium being built in real time, with listener promos, voicemails and podsafe music. The complete archive, restored, with transcripts and chapters for every episode."

    - tag: category
      text: Technology

    - tag: category
      text: News & Politics

    - tag: language
      text: en-us

    - tag: copyright
      text: "Creative Commons Attribution-Noncommercial-ShareAlike 3.0: http://creativecommons.org/licenses/by-nc-sa/3.0/us/"

    - tag: managingEditor
      text: adam@curry.com (Adam Curry)

    - tag: webMaster
      text: adam@curry.com (Adam Curry)

    - tag: ttl
      text: 60

    - tag: image
      tags:
      
      - tag: url
        text: __BASE_URL__/artwork/dsc-logo-144.png
    
      - tag: link
        text: __BASE_URL__/

      - tag: title
        text: Adam Curry's Daily Source Code Podcast

      - tag: description
        text: Adam Curry's Daily Source Code Podcast
    
      - tag: width
        text: 144
    
      - tag: height
        text: 144
  
    - tag: pubDate
      text: Fri, 13 Aug 2004 13:52:49 +0000
  
    - tag: lastBuildDate
      text: __NOW__

    # itunes:new-feed-url belongs in the old feed (Apple moves a listing
    # from there), not in the new one: left out. itunes:block no: apps and
    # Podcast Index read yes as hidden everywhere, not only on Apple
    # (2026-10-29, the user). Off Apple: the feed is never submitted there.
    - tag: block
      namespace: itunes
      text: False

    - tag: summary
      namespace: itunes
      text: "The Daily Source Code, Adam Curry's podcast that started podcasting. From August 2004 to November 2013: 863 episodes plus specials, recorded from Belgium, Guildford, San Francisco and on the road. News, technology, music and life, and a new medium being built in real time, with listener promos, voicemails and podsafe music. The complete archive, restored, with transcripts and chapters for every episode."

    - tag: owner
      namespace: itunes
      tags:
      
      - tag: name
        namespace: itunes
        text: Adam Curry
      
      - tag: email
        namespace: itunes
        text: adam@curry.com
    
    - tag: author
      namespace: itunes
      text: Adam Curry

    # Apple's Technology has no subcategories (Gadgets, Software How-To,
    # Tech News, Podcasting were dropped by Apple)
    - tag: category
      namespace: itunes
      attributes:
        text: Technology

    - tag: category
      namespace: itunes
      attributes:
        text: News
      tags:

      - tag: category
        namespace: itunes
        attributes:
          text: Politics

    - tag: explicit
      namespace: itunes
      text: True

    - tag: complete
      namespace: itunes
      text: False

    - tag: type
      namespace: itunes
      text: serial

    - tag: series_name
      namespace: itunes
      text: Daily Source Code

    - tag: keywords
      namespace: itunes
      text: dsc,adam,delta,sierra,charlie

    - tag: image
      namespace: itunes
      attributes:
        href: __BASE_URL__/artwork/dsc-logo-3000.png

    - tag: guid
      namespace: podcast
      # UUIDv5 (namespace ead4c236-bf58-58c6-a2c6-a6b28d128cb6) of the feed
      # url without scheme, thedailysourcecode.com/rss.xml (the address on
      # Adam's page, 2026-10-28); never change it once published
      text: 854cabf3-8c71-51de-8ad5-510a4d6a816c

    - tag: medium
      namespace: podcast
      text: podcast

    - tag: updateFrequency
      namespace: podcast
      attributes:
        complete: 'true'
      text: "Complete: 863 episodes, August 2004 to November 2013"

    - tag: locked
      namespace: podcast
      attributes:
        owner: adam@curry.com
      text: True

    # The licence of the original feeds (<copyright>); not in the namespace's
    # license list, so a custom identifier with the url (required then).
    # To confirm with Adam.
    - tag: license
      namespace: podcast
      attributes:
        url: https://creativecommons.org/licenses/by-nc-sa/3.0/us/
      text: CC-BY-NC-SA-3.0-US

    # The host of the show, as on every episode (../yaml/persons.yaml)
    - tag: person
      namespace: podcast
      attributes:
        role: host
        group: cast
        href: https://en.wikipedia.org/wiki/Adam_Curry
        img: https://upload.wikimedia.org/wikipedia/commons/thumb/d/d5/Adam_Curry_2016.jpg/500px-Adam_Curry_2016.jpg
      text: Adam Curry

    # podcast:image, one per purpose (podcast:images is deprecated)
    - tag: image
      namespace: podcast
      attributes:
        href: __BASE_URL__/artwork/dsc-logo-3000.png
        alt: "Daily Source Code: the words DAILY SOURCE CODE on three tilted bands, white on navy and navy on white (the show's first logo, 2004, reconstructed)"
        aspect-ratio: 1/1
        width: 3000
        height: 3000
        type: image/png
        purpose: artwork

    - tag: image
      namespace: podcast
      attributes:
        href: __BASE_URL__/artwork/dsc-logo-circle-3000.png
        alt: "Daily Source Code: the words DAILY SOURCE CODE on three tilted bands, white on navy and navy on white (the show's first logo, 2004, reconstructed)"
        aspect-ratio: 1/1
        width: 3000
        height: 3000
        type: image/png
        purpose: circular

    - tag: image
      namespace: podcast
      attributes:
        href: __BASE_URL__/artwork/dsc-logo-16x9-1920.png
        alt: "Daily Source Code: the words DAILY SOURCE CODE on three tilted bands, white on navy and navy on white (the show's first logo, 2004, reconstructed)"
        aspect-ratio: 16/9
        width: 1920
        height: 1080
        type: image/png
        purpose: social banner

    - tag: image
      namespace: podcast
      attributes:
        href: __BASE_URL__/artwork/dsc-logo-9x16-1080.png
        alt: "Daily Source Code: the words DAILY SOURCE CODE on three tilted bands, white on navy and navy on white (the show's first logo, 2004, reconstructed)"
        aspect-ratio: 9/16
        width: 1080
        height: 1920
        type: image/png
        purpose: canvas

    # podcast:block, one tag each (yes/no); the id must be on the service
    # slug list (serviceslugs.txt): threads, fediverse, bluesky are not, and
    # cannot be blocked by name. Was: global no, spotify yes (twice), facebook
    # yes, threads yes, fediverse no, bluesky yes. To confirm with Adam.
    - tag: block
      namespace: podcast
      text: False

    - tag: block
      namespace: podcast
      attributes:
        id: spotify
      text: True

    - tag: block
      namespace: podcast
      attributes:
        id: facebook
      text: True

    - tag: rating
      namespace: rawvoice
      text: TV-MA

    - tag: location
      namespace: rawvoice
      text: Austin, Texas, USA

    - tag: subscribe
      namespace: rawvoice
      attributes:
        feed:         __BASE_URL__/rss.xml
        amazon_music: null
        anghami:      null
        blubrry:      null
        deezer:       null
        gaana:        null
        iheart:       null
        iheartradio:  null
        itunes:       null
        pandora:      null
        pcindex:      null
        podchaser:    null
        spotify:      null
        stitcher:     null
        tunein:       null

